  // Hardware MMIO & ROM Region Map (must all lie within 0x000000..0x0FFFFF with zero overlaps)
  const HARDWARE_REGIONS = [
    { name: "FONT_ROM",   start: 0x0EF000, size: 768   }, // 0x0EF000..0x0EF2FF
    { name: "VRAM",       start: 0x0F0000, size: 64000 }, // 0x0F0000..0x0FF9FF
    { name: "PALETTE",    start: 0x0FFA00, size: 768   }, // 0x0FFA00..0x0FFCFF
    { name: "TIMER_MS",   start: 0x0FFD00, size: 4     }, // 0x0FFD00..0x0FFD03
    { name: "VSYNC_CNT",  start: 0x0FFD04, size: 4     }, // 0x0FFD04..0x0FFD07
    { name: "SOUND_REGS", start: 0x0FFD20, size: 32    }  // 0x0FFD20..0x0FFD3F
  ];

  function verifyHardwareRegions(regions) {
    for (let i = 0; i < regions.length; i++) {
      const r = regions[i];
      const end = r.start + r.size;
      if (r.start < 0 || r.size <= 0 || end > 0x100000) {
        return { ok: false, msg: r.name + " out of 1 MiB bounds (0x" + r.start.toString(16) + "..0x" + (end - 1).toString(16) + ")" };
      }
      for (let j = i + 1; j < regions.length; j++) {
        const b = regions[j];
        const bEnd = b.start + b.size;
        if (!(end <= b.start || bEnd <= r.start)) {
          return { ok: false, msg: r.name + " overlaps " + b.name };
        }
      }
    }
    return { ok: true, msg: "6 regions verified in 0x000000..0x0FFFFF" };
  }

  function initHardwareMemory(cpu) {
    // 1. Startup hardware region bounds & overlap assertion
    const check = verifyHardwareRegions(HARDWARE_REGIONS);
    cpu.hwAssertOk = check.ok;
    cpu.hwAssertMsg = check.msg;

    // 2. Load 8x8 font at 0x0EF000..0x0EF2FF
    for (let i = 0; i < 768; i++) {
      cpu.ram[0x0EF000 + i] = parseInt(FONT_8X8_HEX.substr(i * 2, 2), 16);
    }
    // 3. Load 256-colour VGA Mode 13h style palette at 0x0FFA00..0x0FFCFF
    const ega16 = [
      [0,0,0],       [0,18,110],    [0,150,40],    [0,160,160],
      [170,20,20],   [150,0,150],   [170,95,0],    [180,185,195],
      [85,90,105],   [65,125,255],  [72,255,122],  [0,240,255],
      [255,80,80],   [255,85,255],  [255,230,60],  [255,255,255]
    ];
    for (let i = 0; i < 16; i++) {
      cpu.ram[0x0FFA00 + i * 3 + 0] = ega16[i][0];
      cpu.ram[0x0FFA00 + i * 3 + 1] = ega16[i][1];
      cpu.ram[0x0FFA00 + i * 3 + 2] = ega16[i][2];
    }
    for (let i = 16; i < 256; i++) {
      cpu.ram[0x0FFA00 + i * 3 + 0] = (i * 37) & 255;
      cpu.ram[0x0FFA00 + i * 3 + 1] = (i * 73) & 255;
      cpu.ram[0x0FFA00 + i * 3 + 2] = (i * 139) & 255;
    }
  }

  // 4-Channel Web Audio Synthesizer
  class TabCompSound {
    constructor(cpu) {
      this.cpu = cpu;
      this.ctx = null;
      this.channels = [];
    }
    unlock() {
      if (this.ctx) {
        if (this.ctx.state === "suspended") this.ctx.resume();
        return;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      const types = ["square", "triangle", "sawtooth", "square"];
      for (let i = 0; i < 4; i++) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = types[i];
        osc.frequency.value = 0;
        gain.gain.value = 0;
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        this.channels.push({ osc, gain });
      }
    }
    syncFromRAM() {
      if (!this.ctx) return;
      const ram = this.cpu.ram;
      for (let i = 0; i < 4; i++) {
        const base = 0x0FFD20 + i * 8;
        const freq = ram[base] | (ram[base + 1] << 8);
        const vol = ram[base + 2];
        const ch = this.channels[i];
        if (freq > 20 && vol > 0) {
          const f = i === 3 ? (freq * ((Math.random() * 0.5) + 0.75)) : freq;
          ch.osc.frequency.setTargetAtTime(f, this.ctx.currentTime, 0.005);
          ch.gain.gain.setTargetAtTime((vol / 255) * 0.08, this.ctx.currentTime, 0.005);
        } else {
          ch.gain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.005);
        }
      }
    }
  }

  // Display Renderer: draws ONLY the tear-free present buffer (cpu.presentBuf), NEVER live VRAM!
  function renderFramebufferToCanvas(cpu, ctx2d, imgData) {
    const ram = cpu.ram;
    const pbuf = cpu.presentBuf;
    const data32 = new Uint32Array(imgData.data.buffer);
    const palBase = 0x0FFA00;
    const pal32 = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      const r = ram[palBase + i * 3];
      const g = ram[palBase + i * 3 + 1];
      const b = ram[palBase + i * 3 + 2];
      pal32[i] = (255 << 24) | (b << 16) | (g << 8) | r;
    }
    for (let i = 0; i < 64000; i++) {
      data32[i] = pal32[pbuf[i]];
    }
    ctx2d.putImageData(imgData, 0, 0);
  }

  class TabCompFS {
    constructor() {
      this.files = new Map();
      this.dirs = new Set(['/', '/src', '/bin', '/home']);
      this.fds = new Map();
      this.nextFd = 3;
    }

    normPath(p, cwd = '/home') {
      if (!p) return cwd;
      p = p.replace(/\\/g, '/').trim();
      if (!p.startsWith('/')) {
        p = (cwd === '/' ? '/' : cwd + '/') + p;
      }
      const parts = p.split('/');
      const out = [];
      for (const part of parts) {
        if (!part || part === '.') continue;
        if (part === '..') { out.pop(); continue; }
        out.push(part.slice(0, 31));
      }
      return '/' + out.join('/');
    }

    writeFile(path, content) {
      const p = this.normPath(path, '/');
      const lastSlash = p.lastIndexOf('/');
      if (lastSlash > 0) {
        const dir = p.slice(0, lastSlash);
        this.mkdir(dir);
      }
      if (typeof content === 'string') {
        this.files.set(p, new TextEncoder().encode(content));
      } else if (content instanceof Uint8Array) {
        this.files.set(p, new Uint8Array(content));
      } else {
        this.files.set(p, new Uint8Array(content));
      }
    }

    readFile(path) {
      const p = this.normPath(path, '/');
      return this.files.get(p) || null;
    }

    readText(path) {
      const d = this.readFile(path);
      return d ? new TextDecoder().decode(d) : null;
    }

    mkdir(path) {
      const p = this.normPath(path, '/');
      const parts = p.split('/').filter(Boolean);
      let cur = '';
      this.dirs.add('/');
      for (const part of parts) {
        cur += '/' + part;
        this.dirs.add(cur);
      }
      return 0;
    }

    unlink(path) {
      const p = this.normPath(path, '/');
      if (this.files.has(p)) {
        this.files.delete(p);
        return 0;
      }
      if (this.dirs.has(p) && p !== '/') {
        this.dirs.delete(p);
        return 0;
      }
      return -1;
    }

    stat(path) {
      const p = this.normPath(path, '/');
      if (this.dirs.has(p)) return { exists: 1, isDir: 1, size: 0 };
      if (this.files.has(p)) return { exists: 1, isDir: 0, size: this.files.get(p).length };
      return null;
    }

    list(dirPath) {
      const p = this.normPath(dirPath, '/');
      if (!this.dirs.has(p)) return null;
      const prefix = p === '/' ? '/' : p + '/';
      const entries = [];
      for (const d of this.dirs) {
        if (d !== p && d.startsWith(prefix)) {
          const rest = d.slice(prefix.length);
          if (!rest.includes('/')) {
            entries.push({ name: rest, isDir: 1, size: 0 });
          }
        }
      }
      for (const [f, data] of this.files.entries()) {
        if (f.startsWith(prefix)) {
          const rest = f.slice(prefix.length);
          if (!rest.includes('/')) {
            entries.push({ name: rest, isDir: 0, size: data.length });
          }
        }
      }
      entries.sort((a, b) => (b.isDir - a.isDir) || a.name.localeCompare(b.name));
      return entries;
    }
  }

  // Zero-dependency WebAssembly Basic-Block / Superblock JIT Compiler
  // Shares linear memory directly with TabCompCPU (0x000000..0x0FFFFF = RAM, 0x100000..0x10003F = R0..R15, 0x100040 = pc, 0x100044 = flags, 0x100048 = codeDirty)
  function encodeULEB128(val, out) {
    let v = val >>> 0;
    do {
      let b = v & 0x7F;
      v >>>= 7;
      if (v !== 0) b |= 0x80;
      out.push(b);
    } while (v !== 0);
  }

  function encodeSLEB128(val, out) {
    let v = val | 0;
    let more = true;
    while (more) {
      let b = v & 0x7F;
      v >>= 7;
      if ((v === 0 && (b & 0x40) === 0) || (v === -1 && (b & 0x40) !== 0)) {
        more = false;
      } else {
        b |= 0x80;
      }
      out.push(b);
    }
  }

  function emitSection(id, payload, out) {
    out.push(id);
    encodeULEB128(payload.length, out);
    for (let i = 0; i < payload.length; i++) out.push(payload[i]);
  }

  const L_FLAGS = 16;
  const L_EXIT_PC = 17;
  const L_STEPS = 18;
  const L_ITERS = 19;
  const L_A = 20;
  const L_B = 21;
  const L_DIRTY = 22;

  class TabCompWasmJIT {
    constructor(cpu) {

      this.wasmMem = cpu.wasmMem;

      this.blockTable = new Array(65536);

      this.blockTable.fill(undefined);

    compileBasicBlock(startPc) {

      let writtenRegs = 0;

      let hasStore = false;

      let count = 0;
      let ended = false;
      let terminated = false;

      let sigB = startPc;

      function markWrite(r) { writtenRegs |= (1 << r); }

        out.push(0x20, L_STEPS);
        pushConst(stepCount, out);
        out.push(0x6A, 0x21, L_STEPS);
        out.push(0x0C, brDepth);

          case 0x28: pushConst(1, out); out.push(0x71, 0x45); break;
          case 0x29: pushConst(2, out); out.push(0x71); break;
          case 0x2A: pushConst(2, out); out.push(0x71, 0x45); break;
          case 0x2B: pushConst(3, out); out.push(0x71); break;
          case 0x2C: pushConst(3, out); out.push(0x71, 0x45); break;

          case 0x31: pushConst(4, out); out.push(0x71, 0x45); break;

          case 0x06:
          case 0x07:

          case 0x11: {

            getReg(rb, trace);

            }

              0x05: 0x6A, 0x06: 0x6B, 0x07: 0x6C,
              0x0C: 0x71, 0x0D: 0x72, 0x0E: 0x73,
              0x0F: 0x74, 0x10: 0x76, 0x11: 0x75

            setReg(rd, trace);
            break;
          }
          case 0x12:
          case 0x13:
            getReg(ra, trace);
            pushConst(imm16, trace);
            trace.push(op === 0x12 ? 0x6A : 0x6B);
            setReg(rd, trace);
            break;

          case 0x15:
          case 0x16:

            trace.push(0x20, L_A, 0x20, L_B, 0x48);
            pushConst(1, trace); trace.push(0x74, 0x72);
            trace.push(0x20, L_A, 0x20, L_B, 0x49);

          case 0x22:
          case 0x23:

            trace.push(0x6B);

            pushConst(0xFFFFF, trace);
            trace.push(0x71);
            getReg(rd, trace);
            trace.push(0x36, 0x00, 0x00);
            break;
          case 0x25:
            getReg(14, trace);
            trace.push(0x22, L_A);
            pushConst(0xFFFFF, trace);
            trace.push(0x71);
            trace.push(0x28, 0x00, 0x00);
            trace.push(0x21, L_B);
            trace.push(0x20, L_A);
            pushConst(4, trace);
            trace.push(0x6A);
            setReg(14, trace);
            trace.push(0x20, L_B);
            setReg(rd, trace);
            break;
          case 0x36:
            markRead(L_FLAGS);
            trace.push(0x20, L_FLAGS);
            switch (uimm16) {
              case 0: pushConst(1, trace); trace.push(0x71, 0x45, 0x45); break;
              case 1: pushConst(1, trace); trace.push(0x71, 0x45); break;
              case 2: pushConst(2, trace); trace.push(0x71, 0x45, 0x45); break;
              case 3: pushConst(2, trace); trace.push(0x71, 0x45); break;
              case 4: pushConst(3, trace); trace.push(0x71, 0x45, 0x45); break;
              case 5: pushConst(3, trace); trace.push(0x71, 0x45); break;
              case 6: pushConst(4, trace); trace.push(0x71, 0x45, 0x45); break;
              case 7: pushConst(4, trace); trace.push(0x71, 0x45); break;
              case 8: pushConst(5, trace); trace.push(0x71, 0x45, 0x45); break;
              case 9: pushConst(5, trace); trace.push(0x71, 0x45); break;

          case 0x28:
          case 0x29:
          case 0x2A:
          case 0x2B:
          case 0x2C:
          case 0x30:
          case 0x31:
          case 0x32:
          case 0x33: {
            const target = inst & 0x00FFFFFF;
            count++;
            pushBranchCond(op, trace);
            trace.push(0x04, 0x40);
            if (target === startPc) {
              hasSelfLoop = true;
              trace.push(0x20, L_STEPS); pushConst(count, trace); trace.push(0x6A, 0x21, L_STEPS);
              trace.push(0x20, L_ITERS); pushConst(1, trace); trace.push(0x6B, 0x22, L_ITERS);
              trace.push(0x0D, 1);
            }

            trace.push(0x0B);

            continue;
          }
          case 0x26: {
            const target = inst & 0x00FFFFFF;
            count++;

              hasSelfLoop = true;
              trace.push(0x20, L_STEPS); pushConst(count, trace); trace.push(0x6A, 0x21, L_STEPS);
              trace.push(0x20, L_ITERS); pushConst(1, trace); trace.push(0x6B, 0x22, L_ITERS);
              trace.push(0x0D, 0);
            } else if (target > pc && count < 56) {
              pc = target;
              continue;
            }
            emitExit(target, count, 1, trace);
            ended = true;
            terminated = true;
            continue;
          }
          case 0x2D: {
            const target = inst & 0x00FFFFFF;
            count++;
            pushConst(nextPc, trace);
            setReg(15, trace);
            emitExit(target, count, 1, trace);
            ended = true;
            terminated = true;
            continue;
          }
          case 0x2E:
            count++;
            getReg(15, trace);
            trace.push(0x21, L_EXIT_PC);
            trace.push(0x20, L_STEPS);
            pushConst(count, trace);
            trace.push(0x6A, 0x21, L_STEPS);
            trace.push(0x0C, 1);
            ended = true;
            terminated = true;
            continue;
          case 0x34:
            count++;
            getReg(rd, trace);
            trace.push(0x21, L_EXIT_PC);
            pushConst(nextPc, trace);
            setReg(15, trace);
            trace.push(0x20, L_STEPS);
            pushConst(count, trace);
            trace.push(0x6A, 0x21, L_STEPS);
            trace.push(0x0C, 1);
            ended = true;
            terminated = true;
            continue;
          case 0x35:
            count++;
            getReg(rd, trace);
            trace.push(0x21, L_EXIT_PC);
            trace.push(0x20, L_STEPS);
            pushConst(count, trace);
            trace.push(0x6A, 0x21, L_STEPS);
            trace.push(0x0C, 1);
            ended = true;
            terminated = true;
            continue;
          default:
            ended = true;
            continue;
        }
        pc = nextPc;
        count++;
      }

      if (count === 0) return null;

      const cacheKey = startPc + ":" + sigA + ":" + sigB + ":" + count;
      let cached = this.wasmCache.get(cacheKey);
      if (cached) {
        this.blockTable[startPc >>> 2] = cached;
        this.compiledCount++;
        return cached;
      }

      if (!terminated) {
        emitExit(pc, count, 1, trace);
      }

      const loadMask = readRegs | writtenRegs;
      const body = [];
      body.push(1, 23, 0x7F);

      for (let r = 0; r < 16; r++) {
        if (loadMask & (1 << r)) {
          pushConst(0x100000 + (r << 2), body);
          body.push(0x28, 0x02, 0x00, 0x21, r);
        }
      }
      if (loadMask & (1 << L_FLAGS)) {
        pushConst(0x100044, body);
        body.push(0x28, 0x02, 0x00, 0x21, L_FLAGS);
      }
      if (hasSelfLoop) {
        pushConst(512, body);
        body.push(0x21, L_ITERS);
      }

      body.push(0x02, 0x40, 0x03, 0x40);
      for (let i = 0; i < trace.length; i++) body.push(trace[i]);
      body.push(0x0B, 0x0B);

      for (let r = 0; r < 16; r++) {
        if (writtenRegs & (1 << r)) {
          pushConst(0x100000 + (r << 2), body);
          body.push(0x20, r, 0x36, 0x02, 0x00);
        }
      }
      if (writtenRegs & (1 << L_FLAGS)) {
        pushConst(0x100044, body);
        body.push(0x20, L_FLAGS, 0x36, 0x02, 0x00);
      }
      if (hasStore) {
        pushConst(0x100048, body);
        body.push(0x20, L_DIRTY, 0x36, 0x02, 0x00);
      }
      pushConst(0x100040, body);
      body.push(0x20, L_EXIT_PC, 0x36, 0x02, 0x00);
      body.push(0x20, L_STEPS, 0x0B);

      const wasm = [0x00, 0x61, 0x73, 0x6D, 0x01, 0x00, 0x00, 0x00];
      emitSection(1, [1, 0x60, 0, 1, 0x7F], wasm);
      emitSection(2, [1, 1, 101, 1, 109, 0x02, 0x00, 17], wasm);
      emitSection(3, [1, 0], wasm);
      emitSection(7, [1, 1, 114, 0x00, 0], wasm);
      const codeSec = [1];
      encodeULEB128(body.length, codeSec);
      for (let i = 0; i < body.length; i++) codeSec.push(body[i]);
      emitSection(10, codeSec, wasm);

      const mod = new WebAssembly.Module(new Uint8Array(wasm));
      const inst = new WebAssembly.Instance(mod, { e: { m: this.wasmMem } });
      const block = { fn: inst.exports.r };
      this.wasmCache.set(cacheKey, block);
      this.blockTable[startPc >>> 2] = block;
      this.compiledCount++;
      return block;
    }
  }

  class TabCompCPU {
    constructor(fsController) {
      this.wasmMem = (typeof WebAssembly !== "undefined" && WebAssembly.Memory)
        ? new WebAssembly.Memory({ initial: 17 })
        : null;
      const memBuf = this.wasmMem ? this.wasmMem.buffer : new ArrayBuffer(1114112);
      this.ram = new Uint8Array(memBuf, 0, 1048576);
      this.ramDV = new DataView(memBuf, 0, 1048576);
      this.ram32 = new Int32Array(memBuf, 0, 262144);
      this.reg = new Int32Array(memBuf, 0x100000, 16);
      this.state32 = new Int32Array(memBuf, 0x100040, 4);
      this.presentBuf = new Uint8Array(64000);
      this.frameReady = false;
      this.presentCount = 0;
      this.lastYieldTime = (typeof performance !== "undefined" ? performance.now() : Date.now());
      this.pc = 0;
      this.flags = 0;
      this.halted = false;
      this.yielded = false;
      this.exitCode = 0;
      this.fs = fsController;
      this.cwd = '/home';
      this.bootTime = Date.now();
      this.vsyncCount = 0;
      this.keyQueue = [];
      this.procStack = [];
      this.lastMips = 35.0;
      this.peakMips = 200.0;
      this.runMips = 180.0;
      this.jitEnabled = 0;
      this.jitInstCount = 0;
      this.interpInstCount = 0;
      this.hwAssertOk = true;
      this.hwAssertMsg = "";
      this.hooks = {};
      this.jit = this.wasmMem ? new TabCompWasmJIT(this) : null;
    }

    presentNow() {
      this.presentBuf.set(this.ram.subarray(0x0F0000, 0x0F0000 + 64000));
      this.frameReady = true;
      this.presentCount = (this.presentCount + 1) | 0;
      this.lastYieldTime = (typeof performance !== "undefined" ? performance.now() : Date.now());
    }

    presentFallbackIfStale(now) {
      if ((now - this.lastYieldTime) > 100) {
        this.presentNow();
      }
    }

    readStr(addr) {
      let s = '';
      while (addr >= 0 && addr < 1048576) {
        const b = this.ram[addr++];
        if (b === 0) break;
        s += String.fromCharCode(b);
      }
      return s;
    }

    writeStr(addr, str, maxLen = 256) {
      const n = Math.min(str.length, maxLen - 1);
      for (let i = 0; i < n; i++) {
        this.ram[addr + i] = str.charCodeAt(i) & 0xFF;
      }
      this.ram[addr + n] = 0;
      return n;
    }

    loadBinary(bytes, argStr = '') {
      if (this.jit) this.jit.invalidateAll();
      this.ram.fill(0, 0, 0x0E0000);
      this.ram.set(bytes, 0);
      this.writeStr(0x0DF000, argStr, 1024);
      this.reg.fill(0);
      this.reg[13] = 0x0DF000;
      this.reg[14] = 0x0DF000;
      this.ramDV.setUint32(0x0DF800, 0x2F000000, true);
      this.reg[15] = 0x0DF800;
      this.pc = 0;
      this.flags = 0;
      this.halted = false;
      this.yielded = false;
    }

    stepInterp(maxSteps) {
      const reg = this.reg;
      const ram = this.ram;
      const dv = this.ramDV;
      let pc = this.pc;
      let flags = this.flags;
      let steps = 0;

      while (steps < maxSteps && !this.halted) {
        const inst = dv.getUint32(pc, true);
        pc = (pc + 4) | 0;
        steps++;

        const op = (inst >>> 24) & 0x3F;
        const rd = (inst >>> 20) & 0x0F;
        const ra = (inst >>> 16) & 0x0F;
        const rb = (inst >>> 12) & 0x0F;
        const imm16 = (inst << 16) >> 16;
        const uimm16 = inst & 0xFFFF;

        switch (op) {
          case 0x00:
            break;
          case 0x01:
            reg[rd] = reg[ra];
            break;
          case 0x02:
            reg[rd] = imm16;
            break;
          case 0x03:
            reg[rd] = uimm16;
            break;
          case 0x04:
            reg[rd] = (reg[rd] & 0xFFFF) | (uimm16 << 16);
            break;
          case 0x05:
            reg[rd] = (reg[ra] + reg[rb]) | 0;
            break;
          case 0x06:
            reg[rd] = (reg[ra] - reg[rb]) | 0;
            break;
          case 0x07:
            reg[rd] = Math.imul(reg[ra], reg[rb]);
            break;
          case 0x08:
            reg[rd] = reg[rb] === 0 ? 0 : (reg[ra] / reg[rb]) | 0;
            break;
          case 0x09:
            reg[rd] = reg[rb] === 0 ? 0 : (reg[ra] % reg[rb]) | 0;
            break;
          case 0x0A:
            reg[rd] = reg[rb] === 0 ? 0 : ((reg[ra] >>> 0) / (reg[rb] >>> 0)) | 0;
            break;
          case 0x0B:
            reg[rd] = reg[rb] === 0 ? 0 : ((reg[ra] >>> 0) % (reg[rb] >>> 0)) | 0;
            break;
          case 0x0C:
            reg[rd] = reg[ra] & reg[rb];
            break;
          case 0x0D:
            reg[rd] = reg[ra] | reg[rb];
            break;
          case 0x0E:
            reg[rd] = reg[ra] ^ reg[rb];
            break;
          case 0x0F:
            reg[rd] = reg[ra] << (reg[rb] & 31);
            break;
          case 0x10:
            reg[rd] = reg[ra] >>> (reg[rb] & 31);
            break;
          case 0x11:
            reg[rd] = reg[ra] >> (reg[rb] & 31);
            break;
          case 0x12:
            reg[rd] = (reg[ra] + imm16) | 0;
            break;
          case 0x13:
            reg[rd] = (reg[ra] - imm16) | 0;
            break;
          case 0x14:
            reg[rd] = reg[ra] & uimm16;
            break;
          case 0x15:
            reg[rd] = reg[ra] | uimm16;
            break;
          case 0x16:
            reg[rd] = reg[ra] ^ uimm16;
            break;
          case 0x17:
            reg[rd] = reg[ra] << (uimm16 & 31);
            break;
          case 0x18:
            reg[rd] = reg[ra] >>> (uimm16 & 31);
            break;
          case 0x19:
            reg[rd] = reg[ra] >> (uimm16 & 31);
            break;
          case 0x1A: {
            const a = reg[ra], b = reg[rb];
            const ua = a >>> 0, ub = b >>> 0;
            let f = 0;
            if (a === b) f |= 1;
            if (a < b) f |= 2;
            if (ua < ub) f |= 4;
            flags = f;
            break;
          }
          case 0x1B: {
            const a = reg[ra], b = imm16;
            const ua = a >>> 0, ub = b >>> 0;
            let f = 0;
            if (a === b) f |= 1;
            if (a < b) f |= 2;
            if (ua < ub) f |= 4;
            flags = f;
            break;
          }
          case 0x1C:
            reg[rd] = ram[(reg[ra] + imm16) & 0xFFFFF];
            break;
          case 0x1D:
            reg[rd] = (ram[(reg[ra] + imm16) & 0xFFFFF] << 24) >> 24;
            break;
          case 0x1E:
            reg[rd] = dv.getUint16((reg[ra] + imm16) & 0xFFFFF, true);
            break;
          case 0x1F:
            reg[rd] = dv.getInt16((reg[ra] + imm16) & 0xFFFFF, true);
            break;
          case 0x20:
            reg[rd] = dv.getInt32((reg[ra] + imm16) & 0xFFFFF, true);
            break;
          case 0x21: {
            const addr = (reg[ra] + imm16) & 0xFFFFF;
            ram[addr] = reg[rd] & 0xFF;
            if (this.jitEnabled && addr < 0x050000 && this.jit) this.jit.invalidateAll();
            break;
          }
          case 0x22: {
            const addr = (reg[ra] + imm16) & 0xFFFFF;
            dv.setUint16(addr, reg[rd] & 0xFFFF, true);
            if (this.jitEnabled && addr < 0x050000 && this.jit) this.jit.invalidateAll();
            break;
          }
          case 0x23: {
            const addr = (reg[ra] + imm16) & 0xFFFFF;
            dv.setInt32(addr, reg[rd], true);
            if (this.jitEnabled && addr < 0x050000 && this.jit) this.jit.invalidateAll();
            break;
          }
          case 0x24:
            reg[14] = (reg[14] - 4) | 0;
            dv.setInt32(reg[14] & 0xFFFFF, reg[rd], true);
            break;
          case 0x25:
            reg[rd] = dv.getInt32(reg[14] & 0xFFFFF, true);
            reg[14] = (reg[14] + 4) | 0;
            break;
          case 0x26:
            pc = inst & 0x00FFFFFF;
            break;
          case 0x27:
            if (flags & 1) pc = inst & 0x00FFFFFF;
            break;
          case 0x28:
            if (!(flags & 1)) pc = inst & 0x00FFFFFF;
            break;
          case 0x29:
            if (flags & 2) pc = inst & 0x00FFFFFF;
            break;
          case 0x2A:
            if (!(flags & 2)) pc = inst & 0x00FFFFFF;
            break;
          case 0x2B:
            if (flags & 3) pc = inst & 0x00FFFFFF;
            break;
          case 0x2C:
            if (!(flags & 3)) pc = inst & 0x00FFFFFF;
            break;
          case 0x2D:
            reg[15] = pc;
            pc = inst & 0x00FFFFFF;
            break;
          case 0x2E:
            pc = reg[15];
            break;
          case 0x2F:
            this.pc = pc;
            this.flags = flags;
            this.handleSys(uimm16);
            pc = this.pc;
            flags = this.flags;
            if (this.halted || this.yielded) return steps;
            break;
          case 0x30:
            if (flags & 4) pc = inst & 0x00FFFFFF;
            break;
          case 0x31:
            if (!(flags & 4)) pc = inst & 0x00FFFFFF;
            break;
          case 0x32:
            if (flags & 5) pc = inst & 0x00FFFFFF;
            break;
          case 0x33:
            if (!(flags & 5)) pc = inst & 0x00FFFFFF;
            break;
          case 0x34:
            reg[15] = pc;
            pc = reg[rd];
            break;
          case 0x35:
            pc = reg[rd];
            break;
          case 0x36:
            switch (uimm16) {
              case 0: reg[rd] = (flags & 1) ? 1 : 0; break;
              case 1: reg[rd] = !(flags & 1) ? 1 : 0; break;
              case 2: reg[rd] = (flags & 2) ? 1 : 0; break;
              case 3: reg[rd] = !(flags & 2) ? 1 : 0; break;
              case 4: reg[rd] = (flags & 3) ? 1 : 0; break;
              case 5: reg[rd] = !(flags & 3) ? 1 : 0; break;
              case 6: reg[rd] = (flags & 4) ? 1 : 0; break;
              case 7: reg[rd] = !(flags & 4) ? 1 : 0; break;
              case 8: reg[rd] = (flags & 5) ? 1 : 0; break;
              case 9: reg[rd] = !(flags & 5) ? 1 : 0; break;
            }
            break;
          default:
            this.halted = true;
            break;
        }
      }

      this.pc = pc;
      this.flags = flags;
      return steps;
    }

    stepBatch(maxSteps) {
      if (!this.jitEnabled || !this.jit) {
        const n = this.stepInterp(maxSteps);
        this.interpInstCount += n;
        return n;
      }
      let steps = 0;
      const jit = this.jit;
      const hotCounts = jit.hotCounts;
      const blockTable = jit.blockTable;
      const state32 = this.state32;

      while (steps < maxSteps && !this.halted && !this.yielded) {
        const pc = this.pc;
        const idx = (pc >>> 2) & 0xFFFF;
        let blk = blockTable[idx];
        if (blk === undefined) {
          const c = (hotCounts[idx] + 1) & 0xFFFF;
          hotCounts[idx] = c;
          if (c >= 50) {
            blk = jit.compileBasicBlock(pc);
            if (!blk) blockTable[idx] = null;
          }
        }
        if (blk) {
          state32[0] = pc;
          state32[1] = this.flags;
          state32[2] = 0;
          const ran = blk.fn();
          this.pc = state32[0];
          this.flags = state32[1];
          if (state32[2]) jit.invalidateAll();
          steps += ran;
          this.jitInstCount += ran;
        } else {
          const ran = this.stepInterp(1);
          steps += ran;
          this.interpInstCount += ran;
        }
      }
      return steps;
    }

    handleSys(num) {
      const r = this.reg;
      switch (num) {
        case 0: { // EXIT(code)
          const code = r[0];
          if (this.procStack.length > 0) {
            const saved = this.procStack.pop();
            if (this.jit) this.jit.invalidateAll();
            this.ram.set(saved.ram, 0);
            this.reg.set(saved.reg);
            this.pc = saved.pc;
            this.flags = saved.flags;
            this.reg[0] = code;
          } else {
            this.exitCode = code;
            this.halted = true;
          }
          break;
        }
        case 1: { // OPEN(path_ptr, mode) -> fd
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const mode = r[1];
          if (mode === 0) {
            const data = this.fs.readFile(path);
            if (!data) { r[0] = -1; break; }
            const fd = this.fs.nextFd++;
            this.fs.fds.set(fd, { path, mode: 0, pos: 0, data: new Uint8Array(data) });
            r[0] = fd;
          } else {
            const fd = this.fs.nextFd++;
            this.fs.fds.set(fd, { path, mode: 1, pos: 0, chunks: [], len: 0 });
            r[0] = fd;
          }
          break;
        }
        case 2: { // READ(fd, buf_ptr, len) -> bytes_read
          const desc = this.fs.fds.get(r[0]);
          if (!desc || desc.mode !== 0) { r[0] = -1; break; }
          const buf = r[1];
          const len = r[2];
          const avail = Math.max(0, Math.min(len, desc.data.length - desc.pos));
          for (let i = 0; i < avail; i++) {
            this.ram[(buf + i) & 0xFFFFF] = desc.data[desc.pos + i];
          }
          desc.pos += avail;
          r[0] = avail;
          break;
        }
        case 3: { // WRITE(fd, buf_ptr, len) -> bytes_written
          const fd = r[0];
          const buf = r[1];
          const len = r[2];
          if (fd === 1 || fd === 2) {
            if (this.hooks.onStdout) {
              let s = '';
              for (let i = 0; i < len; i++) s += String.fromCharCode(this.ram[(buf + i) & 0xFFFFF]);
              this.hooks.onStdout(s);
            }
            r[0] = len;
            break;
          }
          const desc = this.fs.fds.get(fd);
          if (!desc || desc.mode !== 1) { r[0] = -1; break; }
          const chunk = new Uint8Array(len);
          for (let i = 0; i < len; i++) chunk[i] = this.ram[(buf + i) & 0xFFFFF];
          desc.chunks.push(chunk);
          desc.len += len;
          r[0] = len;
          break;
        }
        case 4: { // CLOSE(fd) -> 0
          const fd = r[0];
          const desc = this.fs.fds.get(fd);
          if (!desc) { r[0] = -1; break; }
          if (desc.mode === 1) {
            const merged = new Uint8Array(desc.len);
            let off = 0;
            for (const c of desc.chunks) { merged.set(c, off); off += c.length; }
            this.fs.writeFile(desc.path, merged);
          }
          this.fs.fds.delete(fd);
          r[0] = 0;
          break;
        }
        case 5: { // LIST(dir_ptr, idx, name_out_ptr, is_dir_ptr, size_ptr) -> 1 or 0
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const idx = r[1];
          const entries = this.fs.list(path);
          if (!entries || idx < 0 || idx >= entries.length) {
            r[0] = 0;
            break;
          }
          const e = entries[idx];
          if (r[2]) this.writeStr(r[2], e.name, 32);
          if (r[3]) this.ramDV.setInt32(r[3] & 0xFFFFF, e.isDir, true);
          if (r[4]) this.ramDV.setInt32(r[4] & 0xFFFFF, e.size, true);
          r[0] = 1;
          break;
        }
        case 6: { // MKDIR(path_ptr)
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          r[0] = this.fs.mkdir(path);
          break;
        }
        case 7: { // DELETE(path_ptr)
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          r[0] = this.fs.unlink(path);
          break;
        }
        case 8: { // STAT(path_ptr, size_ptr, is_dir_ptr) -> 0 if exists, -1 if not
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const st = this.fs.stat(path);
          if (!st) { r[0] = -1; break; }
          if (r[1]) this.ramDV.setInt32(r[1] & 0xFFFFF, st.size, true);
          if (r[2]) this.ramDV.setInt32(r[2] & 0xFFFFF, st.isDir, true);
          r[0] = 0;
          break;
        }
        case 9: { // EXEC(bin_path_ptr, arg_str_ptr) -> exit_code
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const argStr = r[1] ? this.readStr(r[1]) : '';
          const bin = this.fs.readFile(path);
          if (!bin) { r[0] = -1; break; }
          this.procStack.push({
            ram: this.ram.slice(0, 0x0E0000),
            reg: new Int32Array(this.reg),
            pc: this.pc,
            flags: this.flags
          });
          this.loadBinary(bin, argStr);
          break;
        }
        case 10: // YIELD() -> copies live VRAM to tear-free presentBuf
          this.yielded = true;
          this.presentNow();
          if (this.hooks.onYield) this.hooks.onYield();
          break;
        case 11: { // KEY() -> next key or 0
          if (this.keyQueue.length > 0) {
            r[0] = this.keyQueue.shift();
          } else {
            r[0] = 0;
          }
          break;
        }
        case 12: // TIME() -> ms since boot
          r[0] = (Date.now() - this.bootTime) | 0;
          break;
        case 13: // SAVE()
          if (this.hooks.onSave) this.hooks.onSave();
          r[0] = 0;
          break;
        case 14: { // EXPORT(bin_path_ptr, title_ptr)
          const binPath = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const title = this.readStr(r[1]);
          if (this.hooks.onExport) r[0] = this.hooks.onExport(binPath, title);
          else r[0] = 0;
          break;
        }
        case 15: { // REBOOTSTRAP() -> 0 if stage1==stage2==stage3, 2 if stage2==stage3
          if (this.hooks.onRebootstrap) r[0] = this.hooks.onRebootstrap();
          else r[0] = 0;
          break;
        }
        case 16: { // SELFTEST(report_buf_ptr) -> failed_count
          if (this.hooks.onSelftest) r[0] = this.hooks.onSelftest(r[0]);
          else r[0] = 0;
          break;
        }
        case 17: { // MIPS([report_buf_ptr]) -> MIPS * 10
          if (this.hooks.onMips) r[0] = this.hooks.onMips(r[0]);
          else r[0] = (this.lastMips * 10) | 0;
          break;
        }
        case 18: { // CHDIR(path_ptr) -> 0 or -1
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const st = this.fs.stat(path);
          if (st && st.isDir) {
            this.cwd = path;
            r[0] = 0;
          } else {
            r[0] = -1;
          }
          break;
        }
        case 19: { // GETCWD(buf_ptr) -> 0
          this.writeStr(r[0], this.cwd, 128);
          r[0] = 0;
          break;
        }
        case 20: { // GETARGS(buf_ptr) -> 0
          const args = this.readStr(0x0DF000);
          this.writeStr(r[0], args, 512);
          r[0] = 0;
          break;
        }
        case 21: { // JIT(mode) -> 0:off, 1:on, -1:query
          if (r[0] === 0 || r[0] === 1) {
            this.jitEnabled = r[0];
            if (this.hooks.onJitToggle) this.hooks.onJitToggle(r[0]);
          }
          r[0] = this.jitEnabled;
          break;
        }
        default:
          r[0] = -1;
          break;
      }
    }
  }
  
  const vfs = new TabCompFS();
  deserializeDiskB64(document.getElementById("tc-cart-disk").textContent, vfs);
  const cpu = new TabCompCPU(vfs);
  initHardwareMemory(cpu);
  const sound = new TabCompSound(cpu);
  const canvas = document.getElementById("tc-screen");
  const ctx2d = canvas.getContext("2d");
  const imgData = ctx2d.createImageData(320, 200);
  const gameBin = vfs.readFile("/bin/game");
  cpu.loadBinary(gameBin, "");
  let titleFrames = 45;
  window.addEventListener("keydown", function(e) {
    sound.unlock();
    let ascii = e.key.length === 1 ? e.key.charCodeAt(0) : 0;
    if (e.key === "Enter") ascii = 13;
    else if (e.key === "Backspace") ascii = 8;
    else if (e.key === "Escape") ascii = 27;
    const mods = (e.shiftKey ? 1 : 0) | (e.ctrlKey ? 2 : 0) | (e.altKey ? 4 : 0);
    cpu.keyQueue.push((mods << 16) | ((e.keyCode & 255) << 8) | (ascii & 255));
  });
  function frame() {
    if (titleFrames > 0) {
      titleFrames--;
      ctx2d.fillStyle = "#080b18";
      ctx2d.fillRect(0, 0, 320, 200);
      ctx2d.fillStyle = "#00f0ff";
      ctx2d.font = "bold 14px Courier New";
      ctx2d.fillText("TabBreakout", 60, 90);
      ctx2d.fillStyle = "#ffe63c";
      ctx2d.font = "11px Courier New";
      ctx2d.fillText("A TabComp(TM) Production", 72, 115);
      requestAnimationFrame(frame);
      return;
    }
    cpu.yielded = false;
    const t0 = performance.now();
    while (!cpu.halted && !cpu.yielded && (performance.now() - t0) < 8) {
      cpu.stepBatch(15000);
    }
    cpu.presentFallbackIfStale(performance.now());
    sound.syncFromRAM();
    renderFramebufferToCanvas(cpu, ctx2d, imgData);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
