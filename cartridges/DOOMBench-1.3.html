  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0d14;

    font-family: "Courier New", Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 12px;
    user-select: none;
  }
  .tc-chassis {
    background: #1a1e29;
    border: 3px solid #3c465c;
    border-radius: 10px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.12);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 100%;
  }
  .tc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 2px solid #2b3244;
    padding-bottom: 8px;
    flex-wrap: wrap;
  }
  .tc-brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .tc-logo {
    font-size: 18px;
    font-weight: 900;
    color: #00f0ff;
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(0,240,255,0.45);
  }
  .tc-sub {
    font-size: 11px;
    color: #9ba6bf;
  }
  .tc-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tc-badge {
    background: #0d1018;
    border: 1px solid #2f384d;
    color: #48ff7a;
    padding: 4px 8px;
    font-size: 12px;
    font-weight: bold;
    border-radius: 4px;
  }
  .tc-btn {
    background: #263044;
    border: 1px solid #4d5d80;
    color: #ffffff;
    font-family: inherit;
    font-size: 12px;
    font-weight: bold;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  .tc-btn:hover { background: #33415c; border-color: #00f0ff; }
  .tc-btn:active { transform: translateY(1px); }
  .tc-bezel {
    background: #050608;
    border: 4px solid #0f131c;
    border-radius: 6px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #tc-screen {
    width: 640px;
    height: 400px;
    max-width: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000000;
    display: block;
    outline: none;
  }
  .tc-footer {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #7d89a3;
  }
  .tc-turbo {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(#d8cfba, #b8af96);
    border: 1px solid #7c745e;
    border-bottom-width: 3px;
    color: #231f1a;
    font-weight: 900;
    letter-spacing: 0.5px;
  }
  .tc-turbo:hover { background: linear-gradient(#e4dcc7, #c4bb9f); border-color: #ffe63c; }
  .tc-led {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2b3024;
    border: 1px solid #161912;
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.6);
    display: inline-block;
  }
  .tc-led.tc-led-on {
    background: #38ff64;
    border-color: #1a8c35;
    box-shadow: 0 0 6px #38ff64, inset 0 1px 1px #b8ffc8;
  }
  /* TabPad(TM) Game Controller for Cartridges & Arcade Apps */
  .tp-pad {
    display: none;
    flex-direction: column;
    gap: 6px;
    padding: 8px 10px;
    margin-top: 2px;
    background: linear-gradient(#cfc6ab, #b9b095);
    border: 2px solid #8f8670;
    border-radius: 8px;
    box-shadow: inset 0 1px 0 #efe7cf, 0 4px 10px rgba(0,0,0,0.6);
    touch-action: manipulation;
  }
  .tp-pad.tp-on { display: flex; }
  .tp-label {
    font: 700 10px "Courier New", monospace;
    color: #5c5444;
    letter-spacing: 1px;
    display: flex;
    justify-content: space-between;
    padding: 0 2px;
  }
  .tp-body {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .tp-dpad {
    display: grid;
    grid-template-columns: repeat(3, 40px);
    grid-template-rows: repeat(3, 34px);
    gap: 3px;
  }
  .tp-center {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .tp-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .tp-btn {
    border-radius: 5px;
    background: linear-gradient(#f4eedb, #ddd4b8);
    border: 1px solid #8b8269;
    border-bottom-width: 4px;
    color: #2a2620;
    font: 700 13px "Courier New", Courier, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 40px;
    height: 36px;
    padding: 0 10px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    cursor: pointer;
  }
  .tp-btn.tp-meta {
    background: linear-gradient(#bdb6a0, #a39b82);
    color: #1d1a15;
    font-size: 11px;
    height: 32px;
  }
  .tp-btn.tp-act {
    background: linear-gradient(#e86850, #c4432b);
    border-color: #7a2617;
    color: #fff8ee;
    min-width: 58px;
    height: 42px;
  }
  .tp-btn.tp-down {
    border-bottom-width: 1px;
    transform: translateY(3px);
    filter: brightness(0.92);
  }
  </style>

    for (let i = 0; i < 768; i++) {
      cpu.ram[0x0EF000 + i] = parseInt(FONT_8X8_HEX.substr(i * 2, 2), 16);
    }
    // 3. Load 256-colour VGA Mode 13h style palette at 0x0FFA00..0x0FFCFF
    const ega16 = [
      [0,0,0],       [0,18,110],    [0,150,40],    [0,160,160],
      [170,20,20],   [150,0,150],   [170,95,0],    [180,185,195],
      [85,90,105],   [65,125,255],  [72,255,122],  [0,240,255],
      [255,80,80],   [255,85,255],  [255,230,60],  [255,255,255]
    ];
    for (let i = 0; i < 16; i++) {
      cpu.ram[0x0FFA00 + i * 3 + 0] = ega16[i][0];
      cpu.ram[0x0FFA00 + i * 3 + 1] = ega16[i][1];
      cpu.ram[0x0FFA00 + i * 3 + 2] = ega16[i][2];
    }
    for (let i = 16; i < 256; i++) {
      cpu.ram[0x0FFA00 + i * 3 + 0] = (i * 37) & 255;
      cpu.ram[0x0FFA00 + i * 3 + 1] = (i * 73) & 255;
      cpu.ram[0x0FFA00 + i * 3 + 2] = (i * 139) & 255;
    }
  }

  // 4-Channel Web Audio Synthesizer
  class TabCompSound {
    constructor(cpu) {
      this.cpu = cpu;
      this.ctx = null;
      this.channels = [];
    }
    unlock() {
      if (this.ctx) {
        if (this.ctx.state === "suspended") this.ctx.resume();
        return;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      const types = ["square", "triangle", "sawtooth", "square"];
      for (let i = 0; i < 4; i++) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = types[i];
        osc.frequency.value = 0;
        gain.gain.value = 0;
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        this.channels.push({ osc, gain });
      }
    }
    syncFromRAM() {
      if (!this.ctx) return;
      const ram = this.cpu.ram;
      for (let i = 0; i < 4; i++) {
        const base = 0x0FFD20 + i * 8;
        const freq = ram[base] | (ram[base + 1] << 8);
        const vol = ram[base + 2];
        const ch = this.channels[i];
        if (freq > 20 && vol > 0) {
          const f = i === 3 ? (freq * ((Math.random() * 0.5) + 0.75)) : freq;
          ch.osc.frequency.setTargetAtTime(f, this.ctx.currentTime, 0.005);
          ch.gain.gain.setTargetAtTime((vol / 255) * 0.08, this.ctx.currentTime, 0.005);
        } else {
          ch.gain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.005);
        }
      }
    }
    playPCM(samplesU8, sampleRate) {
      this.unlock();
      if (!this.ctx || !samplesU8 || samplesU8.length === 0) return -1;
      const rate = Math.max(4000, Math.min(48000, sampleRate || 11025));
      const len = samplesU8.length;
      const buf = this.ctx.createBuffer(1, len, rate);
      const ch0 = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        ch0[i] = ((samplesU8[i] - 128) / 128.0) * 0.25;
      }
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      src.connect(this.ctx.destination);
      src.start();
      return 0;
    }
  }

  // Display Renderer: draws ONLY the tear-free present buffer (cpu.presentBuf), NEVER live VRAM!
  function renderFramebufferToCanvas(cpu, ctx2d, imgData) {
    const ram = cpu.ram;
    const pbuf = cpu.presentBuf;
    const data32 = new Uint32Array(imgData.data.buffer);
    const palBase = 0x0FFA00;
    const pal32 = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      const r = ram[palBase + i * 3];
      const g = ram[palBase + i * 3 + 1];
      const b = ram[palBase + i * 3 + 2];
      pal32[i] = (255 << 24) | (b << 16) | (g << 8) | r;
    }
    for (let i = 0; i < 64000; i++) {
      data32[i] = pal32[pbuf[i]];
    }
    ctx2d.putImageData(imgData, 0, 0);
  }

  class TabCompFS {
    constructor() {
      this.files = new Map();
      this.dirs = new Set(['/', '/src', '/bin', '/home', '/include', '/lib', '/test', '/test/c', '/src/doom']);
      this.fds = new Map();
      this.nextFd = 3;
    }

    normPath(p, cwd = '/home') {
      if (!p) return cwd;
      p = p.replace(/\\/g, '/').trim();
      if (!p.startsWith('/')) {
        p = (cwd === '/' ? '/' : cwd + '/') + p;
      }
      const parts = p.split('/');
      const out = [];
      for (const part of parts) {
        if (!part || part === '.') continue;
        if (part === '..') { out.pop(); continue; }
        out.push(part.slice(0, 63));
      }
      return '/' + out.join('/');
    }

    rename(oldPath, newPath, cwd = '/') {
      const pOld = this.normPath(oldPath, cwd);
      const pNew = this.normPath(newPath, cwd);
      if (!this.files.has(pOld)) return -1;
      const data = this.files.get(pOld);
      this.writeFile(pNew, data);
      if (pOld !== pNew) this.files.delete(pOld);
      return 0;
    }

    writeFile(path, content) {
      const p = this.normPath(path, '/');
      const lastSlash = p.lastIndexOf('/');
      if (lastSlash > 0) {
        const dir = p.slice(0, lastSlash);
        this.mkdir(dir);
      }
      if (typeof content === 'string') {
        this.files.set(p, new TextEncoder().encode(content));
      } else if (content instanceof Uint8Array) {
        this.files.set(p, new Uint8Array(content));
      } else {
        this.files.set(p, new Uint8Array(content));
      }
    }

    readFile(path) {
      const p = this.normPath(path, '/');
      return this.files.get(p) || null;
    }

    readText(path) {
      const d = this.readFile(path);
      return d ? new TextDecoder().decode(d) : null;
    }

    mkdir(path) {
      const p = this.normPath(path, '/');
      const parts = p.split('/').filter(Boolean);
      let cur = '';
      this.dirs.add('/');
      for (const part of parts) {
        cur += '/' + part;
        this.dirs.add(cur);
      }
      return 0;
    }

    unlink(path) {
      const p = this.normPath(path, '/');
      if (this.files.has(p)) {
        this.files.delete(p);
        return 0;
      }
      if (this.dirs.has(p) && p !== '/') {
        this.dirs.delete(p);
        return 0;
      }
      return -1;
    }

    stat(path) {
      const p = this.normPath(path, '/');
      if (this.dirs.has(p)) return { exists: 1, isDir: 1, size: 0 };
      if (this.files.has(p)) return { exists: 1, isDir: 0, size: this.files.get(p).length };
      return null;
    }

    list(dirPath) {
      const p = this.normPath(dirPath, '/');
      if (!this.dirs.has(p)) return null;
      const prefix = p === '/' ? '/' : p + '/';
      const entries = [];
      for (const d of this.dirs) {
        if (d !== p && d.startsWith(prefix)) {
          const rest = d.slice(prefix.length);
          if (!rest.includes('/')) {
            entries.push({ name: rest, isDir: 1, size: 0 });
          }
        }
      }
      for (const [f, data] of this.files.entries()) {
        if (f.startsWith(prefix)) {
          const rest = f.slice(prefix.length);
          if (!rest.includes('/')) {
            entries.push({ name: rest, isDir: 0, size: data.length });
          }
        }
      }
      entries.sort((a, b) => (b.isDir - a.isDir) || a.name.localeCompare(b.name));
      return entries;
    }
  }

  // Zero-dependency WebAssembly Basic-Block / Superblock JIT Compiler
  // Shares linear memory directly with TabCompCPU (0x000000..0x0FFFFF = RAM, 0x100000..0x10003F = R0..R15, 0x100040 = pc, 0x100044 = flags, 0x100048 = codeDirty)
  function encodeULEB128(val, out) {
    let v = val >>> 0;
    do {
      let b = v & 0x7F;
      v >>>= 7;
      if (v !== 0) b |= 0x80;
      out.push(b);
    } while (v !== 0);
  }

  function encodeSLEB128(val, out) {
    let v = val | 0;
    let more = true;
    while (more) {
      let b = v & 0x7F;
      v >>= 7;
      if ((v === 0 && (b & 0x40) === 0) || (v === -1 && (b & 0x40) !== 0)) {
        more = false;
      } else {
        b |= 0x80;
      }
      out.push(b);
    }
  }

  function emitSection(id, payload, out) {
    out.push(id);
    encodeULEB128(payload.length, out);
    for (let i = 0; i < payload.length; i++) out.push(payload[i]);
  }

  const L_FLAGS = 16;
  const L_EXIT_PC = 17;
  const L_STEPS = 18;
  const L_ITERS = 19;
  const L_A = 20;
  const L_B = 21;
  const L_DIRTY = 22;
  const L_Q64 = 23;

  class TabCompWasmJIT {
    constructor(cpu) {
      this.cpu = cpu;
      this.wasmMem = cpu.wasmMem;
      this.hotCounts = new Uint16Array(131072);
      this.blockTable = new Array(131072);
      this.wasmCache = new Map();
      this.compiledCount = 0;

    invalidateAll() {
      this.prevTable = this.blockTable.slice();
      this.hotCounts.fill(0);
      this.blockTable.fill(undefined);
      this.compiledCount = 0;

    compileBasicBlock(startPc) {
      if (!this.wasmMem) return null;

      const prev = this.prevTable && this.prevTable[(startPc >>> 2) & 0x1FFFF];
      if (prev && prev.fn && prev.startPc === startPc) {

          sB = Math.imul(sB ^ (w >>> 11), 16777619);

      let writtenRegs = 0;

          case 0x2B: pushConst(3, out); out.push(0x71); break;
          case 0x2C: pushConst(3, out); out.push(0x71, 0x45); break;
          case 0x30: pushConst(4, out); out.push(0x71); break;
          case 0x31: pushConst(4, out); out.push(0x71, 0x45); break;
          case 0x32: pushConst(5, out); out.push(0x71); break;
          case 0x33: pushConst(5, out); out.push(0x71, 0x45); break;

          case 0x32:

            count++;

      while (steps < maxSteps && !this.halted && !this.yielded) {
        const pc = this.pc;
        const idx = (pc >>> 2) & 0x1FFFF;
        let blk = blockTable[idx];
        if (blk !== undefined && blk.startPc !== pc) {
          blk = undefined;
        }
        if (blk === undefined) {
          const c = (hotCounts[idx] + 1) & 0xFFFF;
          hotCounts[idx] = c;
          if (c >= (jit.prevTable && jit.prevTable[idx] ? 3 : 50)) {
            blk = jit.compileBasicBlock(pc) || { fn: null, startPc: pc };
            blockTable[idx] = blk;
          }
        }
        if (blk && blk.fn) {
          state32[0] = pc;
          state32[1] = this.flags;
          state32[2] = 0;
          const ran = blk.fn();
          this.pc = state32[0];
          this.flags = state32[1];
          if (state32[2]) jit.invalidateAll();
          steps += ran;
          this.jitInstCount += ran;
        } else {
          const ran = this.stepInterp(1);
          steps += ran;
          this.interpInstCount += ran;
        }
      }
      if (this.clockRate > 0) this.machineTimeMs += steps / (this.clockRate * 1000.0);
      return steps;
    }

    handleSys(num) {
      const r = this.reg;
      switch (num) {
        case 0: { // EXIT(code)
          const code = r[0];
          if (this.procStack.length > 0) {
            const saved = this.procStack.pop();
            if (this.jit) this.jit.invalidateAll();
            this.ram.set(saved.ram, 0);
            this.reg.set(saved.reg);
            this.pc = saved.pc;
            this.flags = saved.flags;
            this.rawKeyMode = saved.rawKeyMode || false;
            this.reg[0] = code;
          } else {
            this.exitCode = code;
            this.halted = true;
          }
          break;
        }
        case 1: { // OPEN(path_ptr, mode) -> fd (0=r, 1=w, 2=a, 3=r+, 4=w+, 5=a+)
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const mode = r[1] | 0;
          const existing = this.fs.readFile(path);
          if (mode === 0) {
            if (!existing) { r[0] = -1; break; }
            const fd = this.fs.nextFd++;
            this.fs.fds.set(fd, {
              path, mode: 0, pos: 0, len: existing.length, cap: existing.length,
              buf: existing, writable: false, dirty: false
            });
            r[0] = fd;
          } else if (mode === 3) {
            if (!existing) { r[0] = -1; break; }
            const cap = Math.max(64, existing.length);
            const buf = new Uint8Array(cap);
            buf.set(existing);
            const fd = this.fs.nextFd++;
            this.fs.fds.set(fd, {
              path, mode: 3, pos: 0, len: existing.length, cap, buf, writable: true, dirty: false
            });
            r[0] = fd;
          } else if (mode === 2 || mode === 5) {
            const initLen = existing ? existing.length : 0;
            const cap = Math.max(256, initLen + 256);
            const buf = new Uint8Array(cap);
            if (existing) buf.set(existing);
            const fd = this.fs.nextFd++;
            this.fs.fds.set(fd, {
              path, mode, pos: initLen, len: initLen, cap, buf, writable: true, dirty: !existing
            });
            r[0] = fd;
          } else {
            // mode 1 ("w") or mode 4 ("w+")
            const cap = 4096;
            const buf = new Uint8Array(cap);
            const fd = this.fs.nextFd++;
            this.fs.fds.set(fd, {
              path, mode, pos: 0, len: 0, cap, buf, writable: true, dirty: true
            });
            r[0] = fd;
          }
          break;
        }
        case 2: { // READ(fd, buf_ptr, len) -> bytes_read
          const desc = this.fs.fds.get(r[0]);
          if (!desc) { r[0] = -1; break; }
          const dst = r[1] & 0xFFFFFF;
          const len = Math.max(0, r[2] | 0);
          const avail = Math.max(0, Math.min(len, desc.len - desc.pos));
          if (avail > 0) {
            this.ram.set(desc.buf.subarray(desc.pos, desc.pos + avail), dst);
            desc.pos += avail;
          }
          r[0] = avail;
          break;
        }
        case 3: { // WRITE(fd, buf_ptr, len) -> bytes_written
          const fd = r[0];
          const src = r[1] & 0xFFFFFF;
          const len = Math.max(0, r[2] | 0);
          if (fd === 1 || fd === 2) {
            if (this.hooks.onStdout) {
              let s = '';
              for (let i = 0; i < len; i++) s += String.fromCharCode(this.ram[(src + i) & 0xFFFFFF]);
              this.hooks.onStdout(s);
            }
            r[0] = len;
            break;
          }
          const desc = this.fs.fds.get(fd);
          if (!desc || !desc.writable) { r[0] = -1; break; }
          if (desc.mode === 2 || desc.mode === 5) desc.pos = desc.len;
          const need = desc.pos + len;
          if (need > desc.cap) {
            let newCap = Math.max(desc.cap * 2, need + 4096);
            const nextBuf = new Uint8Array(newCap);
            nextBuf.set(desc.buf.subarray(0, desc.len));
            desc.buf = nextBuf;
            desc.cap = newCap;
          }
          if (len > 0) {
            desc.buf.set(this.ram.subarray(src, src + len), desc.pos);
            desc.pos += len;
            if (desc.pos > desc.len) desc.len = desc.pos;
            desc.dirty = true;
          }
          r[0] = len;
          break;
        }
        case 4: { // CLOSE(fd) -> 0
          const fd = r[0];
          const desc = this.fs.fds.get(fd);
          if (!desc) { r[0] = -1; break; }
          if (desc.writable && desc.dirty) {
            this.fs.writeFile(desc.path, desc.buf.subarray(0, desc.len));
          }
          this.fs.fds.delete(fd);
          r[0] = 0;
          break;
        }
        case 5: { // LIST(dir_ptr, idx, name_out_ptr, is_dir_ptr, size_ptr) -> 1 or 0
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const idx = r[1];
          const entries = this.fs.list(path);
          if (!entries || idx < 0 || idx >= entries.length) {
            r[0] = 0;
            break;
          }
          const e = entries[idx];
          if (r[2]) this.writeStr(r[2], e.name, 64);
          if (r[3]) this.ramDV.setInt32(r[3] & 0xFFFFFF, e.isDir, true);
          if (r[4]) this.ramDV.setInt32(r[4] & 0xFFFFFF, e.size, true);
          r[0] = 1;
          break;
        }
        case 6: { // MKDIR(path_ptr)
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          r[0] = this.fs.mkdir(path);
          break;
        }
        case 7: { // DELETE(path_ptr)
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          r[0] = this.fs.unlink(path);
          break;
        }
        case 8: { // STAT(path_ptr, size_ptr, is_dir_ptr) -> 0 if exists, -1 if not
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const st = this.fs.stat(path);
          if (!st) { r[0] = -1; break; }
          if (r[1]) this.ramDV.setInt32(r[1] & 0xFFFFFF, st.size, true);
          if (r[2]) this.ramDV.setInt32(r[2] & 0xFFFFFF, st.isDir, true);
          r[0] = 0;
          break;
        }
        case 9: { // EXEC(bin_path_ptr, arg_str_ptr) -> exit_code
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const argStr = r[1] ? this.readStr(r[1]) : '';
          const bin = this.fs.readFile(path);
          if (!bin) { r[0] = -1; break; }
          this.procStack.push({
            ram: this.ram.slice(0, 0x0E0000),
            reg: new Int32Array(this.reg),
            pc: this.pc,
            flags: this.flags,
            rawKeyMode: this.rawKeyMode
          });
          this.rawKeyMode = false;
          this.loadBinary(bin, argStr);
          break;
        }
        case 10: // YIELD() -> copies live VRAM to tear-free presentBuf
          this.yielded = true;
          this.presentNow();
          if (this.hooks.onYield) this.hooks.onYield();
          break;
        case 11: { // KEY() -> next key or 0
          if (this.keyQueue.length > 0) {
            r[0] = this.keyQueue.shift();
          } else {
            r[0] = 0;
          }
          break;
        }
        case 12: { // TIME() -> ms since boot
          const elapsedMs = ((typeof performance !== "undefined" ? performance.now() : Date.now()) - this.bootPerf) | 0;
          this.ramDV.setInt32(0x0FFD00, elapsedMs, true);
          r[0] = elapsedMs;
          break;
        }
        case 13: // SAVE()
          if (this.hooks.onSave) this.hooks.onSave();
          r[0] = 0;
          break;
        case 14: { // EXPORT(bin_path_ptr, title_ptr)
          const binPath = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const title = this.readStr(r[1]);
          if (this.hooks.onExport) r[0] = this.hooks.onExport(binPath, title);
          else r[0] = 0;
          break;
        }
        case 15: { // REBOOTSTRAP() -> 0 if stage1==stage2==stage3, 2 if stage2==stage3
          if (this.hooks.onRebootstrap) r[0] = this.hooks.onRebootstrap();
          else r[0] = 0;
          break;
        }
        case 16: { // SELFTEST(report_buf_ptr) -> failed_count
          if (this.hooks.onSelftest) r[0] = this.hooks.onSelftest(r[0]);
          else r[0] = 0;
          break;
        }
        case 17: { // MIPS([report_buf_ptr]) -> MIPS * 10
          if (this.hooks.onMips) r[0] = this.hooks.onMips(r[0]);
          else r[0] = (this.lastMips * 10) | 0;
          break;
        }
        case 18: { // CHDIR(path_ptr) -> 0 or -1
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const st = this.fs.stat(path);
          if (st && st.isDir) {
            this.cwd = path;
            r[0] = 0;
          } else {
            r[0] = -1;
          }
          break;
        }
        case 19: { // GETCWD(buf_ptr) -> 0
          this.writeStr(r[0], this.cwd, 128);
          r[0] = 0;
          break;
        }
        case 20: { // GETARGS(buf_ptr, [max_len]) -> 0
          const args = this.readStr(0x0DF000);
          const maxL = (r[1] > 512 && r[1] <= 4096) ? r[1] : 512;
          this.writeStr(r[0], args, maxL);
          r[0] = 0;
          break;
        }
        case 21: { // JIT(mode) -> 0:off, 1:on, -1:query
          if (r[0] === 0 || r[0] === 1) {
            this.jitEnabled = (r[0] && this.wasmMem) ? 1 : 0;
            if (this.hooks.onJitToggle) this.hooks.onJitToggle(this.jitEnabled);
          }
          r[0] = this.jitEnabled;
          break;
        }
        case 22: { // CLOCK(rate) -> 0:max, 1..1000:MIPS, -1:query
          const arg = r[0] | 0;
          if (arg === 0) {
            this.setClock(0);
          } else if (arg >= 1 && arg <= 1000) {
            this.setClock(arg);
          }
          r[0] = this.clockRate;
          break;
        }
        case 23: { // FSEEK(fd, offset, whence) -> 0 or -1
          const desc = this.fs.fds.get(r[0]);
          if (!desc) { r[0] = -1; break; }
          const offset = r[1] | 0;
          const whence = r[2] | 0;
          let newPos = offset;
          if (whence === 1) newPos = desc.pos + offset;
          else if (whence === 2) newPos = desc.len + offset;
          else if (whence !== 0) { r[0] = -1; break; }
          if (newPos < 0) { r[0] = -1; break; }
          desc.pos = newPos;
          r[0] = 0;
          break;
        }
        case 24: { // FTELL(fd) -> pos or -1
          const desc = this.fs.fds.get(r[0]);
          if (!desc) { r[0] = -1; break; }
          r[0] = desc.pos | 0;
          break;
        }
        case 25: { // FSIZE(fd) -> len or -1
          const desc = this.fs.fds.get(r[0]);
          if (!desc) { r[0] = -1; break; }
          r[0] = desc.len | 0;
          break;
        }
        case 26: { // RENAME(old_ptr, new_ptr) -> 0 or -1
          const oldP = this.readStr(r[0]);
          const newP = this.readStr(r[1]);
          r[0] = this.fs.rename(oldP, newP, this.cwd);
          break;
        }
        case 27: { // KEYEVENT(pressed_ptr, keycode_ptr) -> packed event or 0
          this.rawKeyMode = true;
          if (this.keyEventQueue.length === 0) {
            r[0] = 0;
            break;
          }
          const ev = this.keyEventQueue.shift();
          const packedKey = (ev.mods << 16) | ((ev.keyCode & 0xFF) << 8) | (ev.ascii & 0xFF);
          if (r[0]) this.ramDV.setInt32(r[0] & 0xFFFFFF, ev.pressed, true);
          if (r[1]) this.ramDV.setInt32(r[1] & 0xFFFFFF, packedKey, true);
          r[0] = (1 << 24) | (ev.pressed << 16) | ((ev.keyCode & 0xFF) << 8) | (ev.ascii & 0xFF);
          break;
        }
        case 28: { // TICKS_MS() -> machine-governed milliseconds
          const now = (typeof performance !== "undefined" ? performance.now() : Date.now());
          if (this.clockRate <= 0) {
            this.machineTimeMs += Math.max(0, now - this.lastMachineWall);
          }
          this.lastMachineWall = now;
          const t = Math.floor(this.machineTimeMs) | 0;
          this.ramDV.setInt32(0x0FFD00, t, true);
          r[0] = t;
          break;
        }
        case 29: { // SLEEP_MS(ms) -> 0
          const ms = Math.max(0, Math.min(100, r[0] | 0));
          if (this.clockRate > 0 && ms > 0) {
            const cost = ms * this.clockRate * 1000.0;
            if (this.clockBudget >= cost) {
              this.clockBudget -= cost;
              this.machineTimeMs += ms;
            } else {
              if (this.clockBudget > 0) {
                this.machineTimeMs += this.clockBudget / (this.clockRate * 1000.0);
                this.clockBudget = 0.0;
              }
              this.yielded = true;
            }
          } else if (ms > 0) {
            this.yielded = true;
          }
          r[0] = 0;
          break;
        }
        case 30: { // PCM_PLAY(samples_ptr, len, rate) -> 0
          const ptr = r[0] & 0xFFFFFF;
          const len = Math.max(0, Math.min(262144, r[1] | 0));
          const rate = r[2] | 0;
          if (this.hooks.onPlayPCM && len > 0) {
            r[0] = this.hooks.onPlayPCM(this.ram.subarray(ptr, ptr + len), rate);
          } else {
            r[0] = 0;
          }
          break;
        }
        default:
          r[0] = -1;
          break;
      }
    }
  }

  // TabPad(TM) Compact On-Screen Game Controller (shared by Cartridges & Main System)
  function buildTabPad(chassisEl, controlsEl, keyHandlerFn, autoShowOnCoarse, keyUpHandlerFn) {
    if (!chassisEl || typeof document === "undefined") return null;
    const pad = document.createElement("div");
    pad.className = "tp-pad";
    const label = document.createElement("div");
    label.className = "tp-label";
    label.innerHTML = "<span>TabPad™ Game Controller</span><span>ConsciousNode SoftWorks</span>";
    pad.appendChild(label);

    const body = document.createElement("div");
    body.className = "tp-body";

    function sendKey(key, code) {
      keyHandlerFn({
        key: key,
        keyCode: code,
        shiftKey: false,
        ctrlKey: code === 17,
        altKey: false,
        preventDefault: function() {}
      });
    }

    function sendKeyUp(key, code) {
      if (!keyUpHandlerFn) return;
      keyUpHandlerFn({
        key: key,
        keyCode: code,
        shiftKey: false,
        ctrlKey: false,
        altKey: false,
        preventDefault: function() {}
      });
    }

    function makeBtn(text, key, code, cls, repeatable) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "tp-btn" + (cls ? " " + cls : "");
      b.textContent = text;
      let repTimer = null;
      const stop = function() {
        const wasDown = b.classList.contains("tp-down");
        b.classList.remove("tp-down");
        if (repTimer) {
          clearTimeout(repTimer);
          repTimer = null;
        }
        if (wasDown) sendKeyUp(key, code);
      };
      b.addEventListener("pointerdown", function(ev) {
        ev.preventDefault();
        b.classList.add("tp-down");
        sendKey(key, code);
        if (repeatable) {
          const tick = function() {
            sendKey(key, code);
            repTimer = setTimeout(tick, 55);
          };
          repTimer = setTimeout(tick, 180);
        }
      });
      b.addEventListener("pointerup", stop);
      b.addEventListener("pointerleave", stop);
      b.addEventListener("pointercancel", stop);
      b.addEventListener("contextmenu", function(ev) { ev.preventDefault(); });
      return b;
    }

    const dpad = document.createElement("div");
    dpad.className = "tp-dpad";
    const cells = [
      null, ["▲", "ArrowUp", 38], null,
      ["◀", "ArrowLeft", 37], null, ["▶", "ArrowRight", 39],
      null, ["▼", "ArrowDown", 40], null
    ];
    for (let i = 0; i < cells.length; i++) {
      const c = cells[i];
      if (!c) {
        dpad.appendChild(document.createElement("div"));
      } else {
        dpad.appendChild(makeBtn(c[0], c[1], c[2], "", true));
      }
    }
    body.appendChild(dpad);

    const center = document.createElement("div");
    center.className = "tp-center";
    center.appendChild(makeBtn("Esc", "Escape", 27, "tp-meta", false));
    center.appendChild(makeBtn("R", "r", 82, "tp-meta", false));
    center.appendChild(makeBtn("Q", "q", 81, "tp-meta", false));
    body.appendChild(center);

    const actions = document.createElement("div");
    actions.className = "tp-actions";
    actions.appendChild(makeBtn("Fire", "Control", 17, "tp-act", false));
    actions.appendChild(makeBtn("Space", " ", 32, "tp-act", true));
    actions.appendChild(makeBtn("Enter", "Enter", 13, "tp-act", false));
    body.appendChild(actions);

    pad.appendChild(body);
    chassisEl.appendChild(pad);

    if (controlsEl) {
      const t = document.createElement("button");
      t.type = "button";
      t.className = "tc-btn";
      t.title = "On-screen game controller (TabPad)";
      t.textContent = "🎮 Pad";
      t.addEventListener("click", function() { pad.classList.toggle("tp-on"); });
      controlsEl.appendChild(t);
    }

    const coarse = (typeof window !== "undefined") && window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    if (coarse && autoShowOnCoarse) {
      pad.classList.add("tp-on");
    }
    return pad;
  }
  
  const INITIAL_CLOCK = 0;
  const INITIAL_COMPAT = 25;
  const vfs = new TabCompFS();
  deserializeDiskB64(document.getElementById("tc-cart-disk").textContent, vfs);
  const cpu = new TabCompCPU(vfs);
  initHardwareMemory(cpu);
  cpu.compatRate = INITIAL_COMPAT;
  const sound = new TabCompSound(cpu);
  const canvas = document.getElementById("tc-screen");
  const ctx2d = canvas.getContext("2d");
  const imgData = ctx2d.createImageData(320, 200);
  const clockBadge = document.getElementById("tc-cart-clock");
  const turboBtn = document.getElementById("tc-btn-turbo");
  const turboLed = document.getElementById("tc-turbo-led");
  function syncCartClockUI() {
    if (turboLed) {
      if (cpu.clockRate === 0) turboLed.classList.add("tc-led-on");
      else turboLed.classList.remove("tc-led-on");
    }
    if (clockBadge) {
      if (cpu.clockRate === 0) clockBadge.textContent = "CLOCK: MAX" + (cpu.jitEnabled ? " (JIT)" : "");
      else if (cpu.deviceLagMips > 0) clockBadge.textContent = "CLOCK: " + cpu.clockRate + " MIPS (device: " + cpu.deviceLagMips + ")";
      else clockBadge.textContent = "CLOCK: " + cpu.clockRate + " MIPS (turbo off)";
    }
  }
  cpu.hooks.onClockChange = syncCartClockUI;
  cpu.setClock(INITIAL_CLOCK);
  syncCartClockUI();
  if (turboBtn) {
    turboBtn.addEventListener("click", function() {
      if (cpu.clockRate === 0) cpu.setClock(cpu.compatRate || 25);
      else cpu.setClock(0);
      canvas.focus();
    });
  }
  const gameBin = vfs.readFile("/bin/game");
  cpu.loadBinary(gameBin, "");
  let titleFrames = 45;
  function playerHandleKey(e) {
    if (e && e.preventDefault && (e.key === "Tab" || e.key === "Backspace" || (e.key && e.key.indexOf("Arrow") === 0) || e.key === " ")) {
      e.preventDefault();
    }
    sound.unlock();
    let ascii = (e.key && e.key.length === 1) ? e.key.charCodeAt(0) : 0;
    if (e.key === "Enter") ascii = 13;
    else if (e.key === "Backspace") ascii = 8;
    else if (e.key === "Tab") ascii = 9;
    else if (e.key === "Escape") ascii = 27;
    const mods = (e.shiftKey ? 1 : 0) | (e.ctrlKey ? 2 : 0) | (e.altKey ? 4 : 0);
    const kcode = e.keyCode & 255;
    cpu.keyQueue.push((mods << 16) | (kcode << 8) | (ascii & 255));
    cpu.pushKeyEvent(1, kcode, ascii, mods);
  }
  function playerHandleKeyUp(e) {
    let ascii = (e.key && e.key.length === 1) ? e.key.charCodeAt(0) : 0;
    if (e.key === "Enter") ascii = 13;
    else if (e.key === "Backspace") ascii = 8;
    else if (e.key === "Tab") ascii = 9;
    else if (e.key === "Escape") ascii = 27;
    const mods = (e.shiftKey ? 1 : 0) | (e.ctrlKey ? 2 : 0) | (e.altKey ? 4 : 0);
    cpu.pushKeyEvent(0, e.keyCode & 255, ascii, mods);
  }
  cpu.hooks.onPlayPCM = function(samples, rate) { return sound.playPCM(samples, rate); };
  window.addEventListener("keydown", playerHandleKey);
  window.addEventListener("keyup", playerHandleKeyUp);
  buildTabPad(document.querySelector(".tc-chassis"), document.querySelector(".tc-controls"), playerHandleKey, true, playerHandleKeyUp);
  function frame() {
    cpu.vsyncCount = (cpu.vsyncCount + 1) | 0;
    cpu.ramDV.setInt32(0x0FFD00, (performance.now() - cpu.bootPerf) | 0, true);
    cpu.ramDV.setInt32(0x0FFD04, cpu.vsyncCount, true);
    if (titleFrames > 0) {
      titleFrames--;
      ctx2d.fillStyle = "#080b18";
      ctx2d.fillRect(0, 0, 320, 200);
      ctx2d.fillStyle = "#00f0ff";
      ctx2d.font = "bold 14px Courier New";
      ctx2d.fillText("DOOM", 60, 90);
      ctx2d.fillStyle = "#ffe63c";
      ctx2d.font = "11px Courier New";
      ctx2d.fillText("A TabComp(TM) Production", 72, 115);
      cpu.clockLastTime = performance.now();
      requestAnimationFrame(frame);
      return;
    }
    const now = performance.now();
    cpu.runGovernedSlice(now, 8.0, true);
    cpu.presentFallbackIfStale(now);
    sound.syncFromRAM();
    renderFramebufferToCanvas(cpu, ctx2d, imgData);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
