<style id="tc-style">
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0d14;
    color: #e4e8f0;
    font-family: "Courier New", Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 12px;
    user-select: none;
  }
  .tc-chassis {
    background: #1a1e29;
    border: 3px solid #3c465c;
    border-radius: 10px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.12);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 100%;
  }
  .tc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 2px solid #2b3244;
    padding-bottom: 8px;
    flex-wrap: wrap;
  }
  .tc-brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .tc-logo {
    font-size: 18px;
    font-weight: 900;
    color: #00f0ff;
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(0,240,255,0.45);
  }
  .tc-sub {
    font-size: 11px;
    color: #9ba6bf;
  }
  .tc-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tc-badge {
    background: #0d1018;
    border: 1px solid #2f384d;
    color: #48ff7a;
    padding: 4px 8px;
    font-size: 12px;
    font-weight: bold;
    border-radius: 4px;
  }
  .tc-btn {
    background: #263044;
    border: 1px solid #4d5d80;
    color: #ffffff;
    font-family: inherit;
    font-size: 12px;
    font-weight: bold;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  .tc-btn:hover { background: #33415c; border-color: #00f0ff; }
  .tc-btn:active { transform: translateY(1px); }
  .tc-bezel {
    background: #050608;
    border: 4px solid #0f131c;
    border-radius: 6px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #tc-screen {
    width: 640px;
    height: 400px;
    max-width: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000000;
    display: block;
    outline: none;
  }
  .tc-footer {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #7d89a3;
  }
</style>
</head>

  // Base64 helpers (browser + Node compatible)
  function u8ToB64(u8) {
    let bin = "";
    const len = u8.length;
    for (let i = 0; i < len; i++) bin += String.fromCharCode(u8[i]);

  function b64ToU8(b64) {
    const bin = atob(b64.trim());
    const len = bin.length;
    const u8 = new Uint8Array(len);

    const fileKeys = Array.from(fsObj.files.keys()).sort();
    const files = {};
    for (let i = 0; i < fileKeys.length; i++) {
      const k = fileKeys[i];
      files[k] = u8ToB64(fsObj.files.get(k));
    }
    const json = JSON.stringify({ dirs: dirs, files: files });
    const utf8 = new TextEncoder().encode(json);
    return u8ToB64(utf8);
  }

  function deserializeDiskB64(b64Str, fsObj) {
    fsObj.dirs.clear();
    fsObj.files.clear();
    const rawJson = new TextDecoder().decode(b64ToU8(b64Str));
    const parsed = JSON.parse(rawJson);
    for (let i = 0; i < parsed.dirs.length; i++) {
      fsObj.dirs.add(parsed.dirs[i]);
    }
    const keys = Object.keys(parsed.files);
    for (let i = 0; i < keys.length; i++) {
      const k = keys[i];
      fsObj.files.set(k, b64ToU8(parsed.files[k]));
    }
  }

  // 4-Channel Web Audio Synthesizer
  class TabCompSound {
    constructor(cpu) {
      this.cpu = cpu;
      this.ctx = null;
      this.channels = [];
    }
    unlock() {
      if (this.ctx) {
        if (this.ctx.state === "suspended") this.ctx.resume();
        return;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      const types = ["square", "triangle", "sawtooth", "square"];
      for (let i = 0; i < 4; i++) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = types[i];
        osc.frequency.value = 0;
        gain.gain.value = 0;
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        this.channels.push({ osc, gain });
      }
    }
    syncFromRAM() {
      if (!this.ctx) return;
      const ram = this.cpu.ram;
      for (let i = 0; i < 4; i++) {
        const base = 0x0FFD20 + i * 8;
        const freq = ram[base] | (ram[base + 1] << 8);
        const vol = ram[base + 2];
        const ch = this.channels[i];
        if (freq > 20 && vol > 0) {
          const f = i === 3 ? (freq * ((Math.random() * 0.5) + 0.75)) : freq;
          ch.osc.frequency.setTargetAtTime(f, this.ctx.currentTime, 0.005);
          ch.gain.gain.setTargetAtTime((vol / 255) * 0.08, this.ctx.currentTime, 0.005);
        } else {
          ch.gain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.005);
        }
      }
    }
  }

  // Display Renderer (320x200 indexed framebuffer -> RGBA ImageData)
  function renderFramebufferToCanvas(cpu, ctx2d, imgData) {
    const ram = cpu.ram;
    const data32 = new Uint32Array(imgData.data.buffer);
    const palBase = 0x0FFA00;
    const pal32 = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      const r = ram[palBase + i * 3];
      const g = ram[palBase + i * 3 + 1];
      const b = ram[palBase + i * 3 + 2];
      pal32[i] = (255 << 24) | (b << 16) | (g << 8) | r;
    }
    const fbBase = 0x0F0000;
    for (let i = 0; i < 64000; i++) {
      data32[i] = pal32[ram[fbBase + i]];
    }
    ctx2d.putImageData(imgData, 0, 0);
  }

class TabCompFS {
  constructor() {
    this.files = new Map(); // normalized path -> Uint8Array
    this.dirs = new Set(['/', '/src', '/bin', '/home']);
    this.fds = new Map(); // fd -> { path, mode, pos, data }
    this.nextFd = 3;
  }

  normPath(p, cwd = '/home') {
    if (!p) return cwd;
    p = p.replace(/\\/g, '/').trim();
    if (!p.startsWith('/')) {
      p = (cwd === '/' ? '/' : cwd + '/') + p;
    }
    const parts = p.split('/');
    const out = [];
    for (const part of parts) {
      if (!part || part === '.') continue;
      if (part === '..') { out.pop(); continue; }
      out.push(part.slice(0, 31));
    }
    return '/' + out.join('/');
  }

  writeFile(path, content) {
    const p = this.normPath(path, '/');
    const lastSlash = p.lastIndexOf('/');
    if (lastSlash > 0) {
      const dir = p.slice(0, lastSlash);
      this.mkdir(dir);
    }
    if (typeof content === 'string') {
      this.files.set(p, new TextEncoder().encode(content));
    } else if (content instanceof Uint8Array) {
      this.files.set(p, new Uint8Array(content));
    } else {
      this.files.set(p, new Uint8Array(content));
    }
  }

  readFile(path) {
    const p = this.normPath(path, '/');
    return this.files.get(p) || null;
  }

  readText(path) {
    const d = this.readFile(path);
    return d ? new TextDecoder().decode(d) : null;
  }

  mkdir(path) {
    const p = this.normPath(path, '/');
    const parts = p.split('/').filter(Boolean);
    let cur = '';
    this.dirs.add('/');
    for (const part of parts) {
      cur += '/' + part;
      this.dirs.add(cur);
    }
    return 0;
  }

  unlink(path) {
    const p = this.normPath(path, '/');
    if (this.files.has(p)) {
      this.files.delete(p);
      return 0;
    }
    if (this.dirs.has(p) && p !== '/') {
      this.dirs.delete(p);
      return 0;
    }
    return -1;
  }

  stat(path) {
    const p = this.normPath(path, '/');
    if (this.dirs.has(p)) return { exists: 1, isDir: 1, size: 0 };
    if (this.files.has(p)) return { exists: 1, isDir: 0, size: this.files.get(p).length };
    return null;
  }

  list(dirPath) {
    const p = this.normPath(dirPath, '/');
    if (!this.dirs.has(p)) return null;
    const prefix = p === '/' ? '/' : p + '/';
    const entries = [];
    for (const d of this.dirs) {
      if (d !== p && d.startsWith(prefix)) {
        const rest = d.slice(prefix.length);
        if (!rest.includes('/')) {
          entries.push({ name: rest, isDir: 1, size: 0 });
        }
      }
    }
    for (const [f, data] of this.files.entries()) {
      if (f.startsWith(prefix)) {
        const rest = f.slice(prefix.length);
        if (!rest.includes('/')) {
          entries.push({ name: rest, isDir: 0, size: data.length });
        }
      }
    }
    entries.sort((a, b) => (b.isDir - a.isDir) || a.name.localeCompare(b.name));
    return entries;
  }
}

class TabCompCPU {
  constructor(fsController) {
    this.ram = new Uint8Array(1048576);
    this.ramDV = new DataView(this.ram.buffer);
    this.ram32 = new Int32Array(this.ram.buffer);
    this.reg = new Int32Array(16);
    this.pc = 0;
    this.flags = 0; // bit0=Z, bit1=N, bit2=C, bit3=V
    this.halted = false;
    this.exitCode = 0;
    this.fs = fsController;
    this.cwd = '/home';
    this.bootTime = Date.now();
    this.vsyncCount = 0;
    this.keyQueue = [];
    this.procStack = [];
    this.lastMips = 35.0;
    this.jitEnabled = 0;
    this.hooks = {};
  }

  readStr(addr) {
    let s = '';
    while (addr >= 0 && addr < 1048576) {
      const b = this.ram[addr++];
      if (b === 0) break;
      s += String.fromCharCode(b);
    }
    return s;
  }

  writeStr(addr, str, maxLen = 256) {
    const n = Math.min(str.length, maxLen - 1);
    for (let i = 0; i < n; i++) {
      this.ram[addr + i] = str.charCodeAt(i) & 0xFF;
    }
    this.ram[addr + n] = 0;
    return n;
  }

  loadBinary(bytes, argStr = '') {
    // Load binary at 0x000000..bytes.length
    // Wait: make sure we don't clobber display at 0x0F0000
    this.ram.fill(0, 0, 0x0E0000);
    this.ram.set(bytes, 0);
    // Write argStr at 0x0DF000
    this.writeStr(0x0DF000, argStr, 1024);
    this.reg.fill(0);
    this.reg[13] = 0x0DF000; // FP
    this.reg[14] = 0x0DF000; // SP
    this.reg[15] = 0x0FFFFC; // LR (trap/exit if main returns)
    // Put a SYS 0 (exit) instruction at 0x0DF800 and set LR = 0x0DF800
    this.ramDV.setUint32(0x0DF800, 0x2F000000, true); // SYS 0
    this.reg[15] = 0x0DF800;
    this.pc = 0;
    this.flags = 0;
    this.halted = false;
  }

  stepBatch(maxSteps) {
    const reg = this.reg;
    const ram = this.ram;
    const dv = this.ramDV;
    let pc = this.pc;
    let flags = this.flags;
    let steps = 0;

    while (steps < maxSteps && !this.halted) {
      const inst = dv.getUint32(pc, true);
      pc = (pc + 4) | 0;
      steps++;

      const op = (inst >>> 24) & 0x3F;
      const rd = (inst >>> 20) & 0x0F;
      const ra = (inst >>> 16) & 0x0F;
      const rb = (inst >>> 12) & 0x0F;
      const imm16 = (inst << 16) >> 16; // sign-extended
      const uimm16 = inst & 0xFFFF;

      switch (op) {
        case 0x00: // NOP
          break;
        case 0x01: // MOV rd, ra
          reg[rd] = reg[ra];
          break;
        case 0x02: // LDI rd, imm16 (sign-extended)
          reg[rd] = imm16;
          break;
        case 0x03: // LDIU rd, uimm16
          reg[rd] = uimm16;
          break;
        case 0x04: // LUI rd, uimm16 (rd = (rd & 0xFFFF) | (uimm16 << 16))
          reg[rd] = (reg[rd] & 0xFFFF) | (uimm16 << 16);
          break;
        case 0x05: // ADD rd, ra, rb
          reg[rd] = (reg[ra] + reg[rb]) | 0;
          break;
        case 0x06: // SUB rd, ra, rb
          reg[rd] = (reg[ra] - reg[rb]) | 0;
          break;
        case 0x07: // MUL rd, ra, rb
          reg[rd] = Math.imul(reg[ra], reg[rb]);
          break;
        case 0x08: // DIV rd, ra, rb (signed)
          reg[rd] = reg[rb] === 0 ? 0 : (reg[ra] / reg[rb]) | 0;
          break;
        case 0x09: // MOD rd, ra, rb (signed)
          reg[rd] = reg[rb] === 0 ? 0 : (reg[ra] % reg[rb]) | 0;
          break;
        case 0x0A: // DIVU rd, ra, rb (unsigned)
          reg[rd] = reg[rb] === 0 ? 0 : ((reg[ra] >>> 0) / (reg[rb] >>> 0)) | 0;
          break;
        case 0x0B: // MODU rd, ra, rb (unsigned)
          reg[rd] = reg[rb] === 0 ? 0 : ((reg[ra] >>> 0) % (reg[rb] >>> 0)) | 0;
          break;
        case 0x0C: // AND rd, ra, rb
          reg[rd] = reg[ra] & reg[rb];
          break;
        case 0x0D: // OR rd, ra, rb
          reg[rd] = reg[ra] | reg[rb];
          break;
        case 0x0E: // XOR rd, ra, rb
          reg[rd] = reg[ra] ^ reg[rb];
          break;
        case 0x0F: // SHL rd, ra, rb
          reg[rd] = reg[ra] << (reg[rb] & 31);
          break;
        case 0x10: // SHR rd, ra, rb (logical)
          reg[rd] = reg[ra] >>> (reg[rb] & 31);
          break;
        case 0x11: // SAR rd, ra, rb (arithmetic)
          reg[rd] = reg[ra] >> (reg[rb] & 31);
          break;
        case 0x12: // ADDI rd, ra, imm16
          reg[rd] = (reg[ra] + imm16) | 0;
          break;
        case 0x13: // SUBI rd, ra, imm16
          reg[rd] = (reg[ra] - imm16) | 0;
          break;
        case 0x14: // ANDI rd, ra, uimm16
          reg[rd] = reg[ra] & uimm16;
          break;
        case 0x15: // ORI rd, ra, uimm16
          reg[rd] = reg[ra] | uimm16;
          break;
        case 0x16: // XORI rd, ra, uimm16
          reg[rd] = reg[ra] ^ uimm16;
          break;
        case 0x17: // SHLI rd, ra, uimm16
          reg[rd] = reg[ra] << (uimm16 & 31);
          break;
        case 0x18: // SHRI rd, ra, uimm16
          reg[rd] = reg[ra] >>> (uimm16 & 31);
          break;
        case 0x19: // SARI rd, ra, uimm16
          reg[rd] = reg[ra] >> (uimm16 & 31);
          break;
        case 0x1A: { // CMP ra, rb
          const a = reg[ra], b = reg[rb];
          const ua = a >>> 0, ub = b >>> 0;
          let f = 0;
          if (a === b) f |= 1; // Z
          if (a < b) f |= 2;   // N (signed less)
          if (ua < ub) f |= 4; // C (unsigned less)
          flags = f;
          break;
        }
        case 0x1B: { // CMPI ra, imm16
          const a = reg[ra], b = imm16;
          const ua = a >>> 0, ub = b >>> 0;
          let f = 0;
          if (a === b) f |= 1;
          if (a < b) f |= 2;
          if (ua < ub) f |= 4;
          flags = f;
          break;
        }
        case 0x1C: // LDB rd, [ra + imm16] (zero-extended)
          reg[rd] = ram[(reg[ra] + imm16) & 0xFFFFF];
          break;
        case 0x1D: // LDBS rd, [ra + imm16] (sign-extended)
          reg[rd] = (ram[(reg[ra] + imm16) & 0xFFFFF] << 24) >> 24;
          break;
        case 0x1E: // LDH rd, [ra + imm16] (zero-extended)
          reg[rd] = dv.getUint16((reg[ra] + imm16) & 0xFFFFF, true);
          break;
        case 0x1F: // LDHS rd, [ra + imm16] (sign-extended)
          reg[rd] = dv.getInt16((reg[ra] + imm16) & 0xFFFFF, true);
          break;
        case 0x20: // LDW rd, [ra + imm16]
          reg[rd] = dv.getInt32((reg[ra] + imm16) & 0xFFFFF, true);
          break;
        case 0x21: // STB rd, [ra + imm16]
          ram[(reg[ra] + imm16) & 0xFFFFF] = reg[rd] & 0xFF;
          break;
        case 0x22: // STH rd, [ra + imm16]
          dv.setUint16((reg[ra] + imm16) & 0xFFFFF, reg[rd] & 0xFFFF, true);
          break;
        case 0x23: // STW rd, [ra + imm16]
          dv.setInt32((reg[ra] + imm16) & 0xFFFFF, reg[rd], true);
          break;
        case 0x24: // PUSH rd
          reg[14] = (reg[14] - 4) | 0;
          dv.setInt32(reg[14] & 0xFFFFF, reg[rd], true);
          break;
        case 0x25: // POP rd
          reg[rd] = dv.getInt32(reg[14] & 0xFFFFF, true);
          reg[14] = (reg[14] + 4) | 0;
          break;
        case 0x26: // JMP addr24
          pc = inst & 0x00FFFFFF;
          break;
        case 0x27: // JZ / JE addr24
          if (flags & 1) pc = inst & 0x00FFFFFF;
          break;
        case 0x28: // JNZ / JNE addr24
          if (!(flags & 1)) pc = inst & 0x00FFFFFF;
          break;
        case 0x29: // JLT addr24 (signed <)
          if (flags & 2) pc = inst & 0x00FFFFFF;
          break;
        case 0x2A: // JGE addr24 (signed >=)
          if (!(flags & 2)) pc = inst & 0x00FFFFFF;
          break;
        case 0x2B: // JLE addr24 (signed <=)
          if (flags & 3) pc = inst & 0x00FFFFFF;
          break;
        case 0x2C: // JGT addr24 (signed >)
          if (!(flags & 3)) pc = inst & 0x00FFFFFF;
          break;
        case 0x2D: // CALL addr24
          reg[15] = pc;
          pc = inst & 0x00FFFFFF;
          break;
        case 0x2E: // RET
          pc = reg[15];
          break;
        case 0x2F: // SYS uimm16
          this.pc = pc;
          this.flags = flags;
          this.handleSys(uimm16);
          pc = this.pc;
          flags = this.flags;
          if (this.halted) return steps;
          break;
        case 0x30: // JB / JLU addr24 (unsigned <)
          if (flags & 4) pc = inst & 0x00FFFFFF;
          break;
        case 0x31: // JAE / JGEU addr24 (unsigned >=)
          if (!(flags & 4)) pc = inst & 0x00FFFFFF;
          break;
        case 0x32: // JBE / JLEU addr24 (unsigned <=)
          if (flags & 5) pc = inst & 0x00FFFFFF;
          break;
        case 0x33: // JA / JGTU addr24 (unsigned >)
          if (!(flags & 5)) pc = inst & 0x00FFFFFF;
          break;
        case 0x34: // CALLR rd
          reg[15] = pc;
          pc = reg[rd];
          break;
        case 0x35: // JMPR rd
          pc = reg[rd];
          break;
        case 0x36: // SETCC rd, uimm16 (0:EQ, 1:NE, 2:LT, 3:GE, 4:LE, 5:GT, 6:LTU, 7:GEU, 8:LEU, 9:GTU)
          switch (uimm16) {
            case 0: reg[rd] = (flags & 1) ? 1 : 0; break;
            case 1: reg[rd] = !(flags & 1) ? 1 : 0; break;
            case 2: reg[rd] = (flags & 2) ? 1 : 0; break;
            case 3: reg[rd] = !(flags & 2) ? 1 : 0; break;
            case 4: reg[rd] = (flags & 3) ? 1 : 0; break;
            case 5: reg[rd] = !(flags & 3) ? 1 : 0; break;
            case 6: reg[rd] = (flags & 4) ? 1 : 0; break;
            case 7: reg[rd] = !(flags & 4) ? 1 : 0; break;
            case 8: reg[rd] = (flags & 5) ? 1 : 0; break;
            case 9: reg[rd] = !(flags & 5) ? 1 : 0; break;
          }
          break;
        default:
          this.halted = true;
          break;
      }
    }

    this.pc = pc;
    this.flags = flags;
    return steps;
  }

  handleSys(num) {
    const r = this.reg;
    switch (num) {
      case 0: { // EXIT(code)
        const code = r[0];
        if (this.procStack.length > 0) {
          const saved = this.procStack.pop();
          this.ram.set(saved.ram, 0);
          this.reg.set(saved.reg);
          this.pc = saved.pc;
          this.flags = saved.flags;
          this.reg[0] = code;
        } else {
          this.exitCode = code;
          this.halted = true;
        }
        break;
      }
      case 1: { // OPEN(path_ptr, mode) -> fd
        const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
        const mode = r[1]; // 0 = read, 1 = write/create/trunc
        if (mode === 0) {
          const data = this.fs.readFile(path);
          if (!data) { r[0] = -1; break; }
          const fd = this.fs.nextFd++;
          this.fs.fds.set(fd, { path, mode: 0, pos: 0, data: new Uint8Array(data) });
          r[0] = fd;
        } else {
          const fd = this.fs.nextFd++;
          this.fs.fds.set(fd, { path, mode: 1, pos: 0, chunks: [], len: 0 });
          r[0] = fd;
        }
        break;

      fnRetType[fIdx] = declBaseType;

      fnRetStruct[fIdx] = declStruct;

      fnDefined[fIdx] = 1;

        gPtr[idx] = ptr;
        gStruct[idx] = declStruct;

// Hand-Encoded WebAssembly Basic-Block JIT for TabComp™ 32-bit RISC CPU
// Zero libraries: emits raw Wasm binary bytes (0x00 0x61 0x73 0x6d ...) directly in JS.

function encodeULEB128(val, out) {
  let v = val >>> 0;
  do {
    let b = v & 0x7F;
    v >>>= 7;
    if (v !== 0) b |= 0x80;
    out.push(b);
  } while (v !== 0);
}

function encodeSLEB128(val, out) {
  let v = val | 0;
  let more = true;
  while (more) {
    let b = v & 0x7F;
    v >>= 7;
    if ((v === 0 && (b & 0x40) === 0) || (v === -1 && (b & 0x40) !== 0)) {
      more = false;
    } else {
      b |= 0x80;
    }
    out.push(b);
  }
}

function emitSection(id, payload, out) {
  out.push(id);
  encodeULEB128(payload.length, out);
  for (let i = 0; i < payload.length; i++) out.push(payload[i]);
}

class TabCompWasmJIT {
  constructor(cpu) {
    this.cpu = cpu;
    this.wasmMem = new WebAssembly.Memory({ initial: 17 }); // 17 * 64KB = 1,114,112 bytes
    this.memU8 = new Uint8Array(this.wasmMem.buffer);
    this.memI32 = new Int32Array(this.wasmMem.buffer);
    this.hotCounts = new Uint16Array(65536); // indexed by (pc >>> 2) & 0xFFFF
    this.compiledBlocks = new Map(); // pc -> { fn, instCount }

  compileBasicBlock(startPc) {
    const dv = this.cpu.ramDV;
    const body = [];
    // Local declarations: 1 local of type i32 (local 0 = reg base 0x100000 or temp)
    body.push(1, 1, 0x7F);

    let pc = startPc;
    let count = 0;
    let ended = false;

    function pushRegAddr(r) {
      body.push(0x41); // i32.const
      encodeSLEB128(0x100000 + (r << 2), body);
    }
    function loadReg(r) {
      pushRegAddr(r);
      body.push(0x28, 0x02, 0x00); // i32.load align=4 offset=0
    }
    function storeRegEnd() {
      body.push(0x36, 0x02, 0x00); // i32.store align=4 offset=0
    }
    function setExitPc(targetPc) {
      body.push(0x41);
      encodeSLEB128(0x100040, body);
      body.push(0x41);
      encodeSLEB128(targetPc, body);
      storeRegEnd();
    }

    while (count < 32 && !ended) {
      const inst = dv.getUint32(pc, true);
      const nextPc = (pc + 4) | 0;
      const op = (inst >>> 24) & 0x3F;
      const rd = (inst >>> 20) & 0x0F;
      const ra = (inst >>> 16) & 0x0F;
      const rb = (inst >>> 12) & 0x0F;
      const imm16 = (inst << 16) >> 16;
      const uimm16 = inst & 0xFFFF;

      switch (op) {
        case 0x00: // NOP
          break;
        case 0x01: // MOV rd, ra
          pushRegAddr(rd);
          loadReg(ra);
          storeRegEnd();
          break;
        case 0x02: // LDI rd, imm16
          pushRegAddr(rd);
          body.push(0x41);
          encodeSLEB128(imm16, body);
          storeRegEnd();
          break;
        case 0x03: // LDIU rd, uimm16
          pushRegAddr(rd);
          body.push(0x41);
          encodeSLEB128(uimm16, body);
          storeRegEnd();
          break;
        case 0x04: // LUI rd, uimm16
          pushRegAddr(rd);
          loadReg(rd);
          body.push(0x41);
          encodeSLEB128(0xFFFF, body);
          body.push(0x71); // i32.and
          body.push(0x41);
          encodeSLEB128(uimm16 << 16, body);
          body.push(0x72); // i32.or
          storeRegEnd();
          break;
        case 0x05: // ADD
        case 0x06: // SUB
        case 0x07: // MUL
        case 0x0C: // AND
        case 0x0D: // OR
        case 0x0E: // XOR
        case 0x0F: // SHL
        case 0x10: // SHR
        case 0x11: { // SAR
          pushRegAddr(rd);
          loadReg(ra);
          loadReg(rb);
          if (op === 0x0F || op === 0x10 || op === 0x11) {
            body.push(0x41);
            encodeSLEB128(31, body);
            body.push(0x71); // i32.and
          }
          const wasmOp = {
            0x05: 0x6A, // i32.add
            0x06: 0x6B, // i32.sub
            0x07: 0x6C, // i32.mul
            0x0C: 0x71, // i32.and
            0x0D: 0x72, // i32.or
            0x0E: 0x73, // i32.xor
            0x0F: 0x74, // i32.shl
            0x10: 0x76, // i32.shr_u
            0x11: 0x75  // i32.shr_s
          }[op];
          body.push(wasmOp);
          storeRegEnd();
          break;
        }
        case 0x12: // ADDI
        case 0x13: { // SUBI
          pushRegAddr(rd);
          loadReg(ra);
          body.push(0x41);
          encodeSLEB128(imm16, body);
          body.push(op === 0x12 ? 0x6A : 0x6B);
          storeRegEnd();
          break;
        }
        case 0x14: // ANDI
        case 0x15: // ORI
        case 0x16: { // XORI
          pushRegAddr(rd);
          loadReg(ra);
          body.push(0x41);
          encodeSLEB128(uimm16, body);
          body.push(op === 0x14 ? 0x71 : (op === 0x15 ? 0x72 : 0x73));
          storeRegEnd();
          break;
        }
        case 0x26: { // JMP addr24
          pc = inst & 0x00FFFFFF;
          count++;
          ended = true;
          continue;
        }
        default:
          // Bail out before unsupported instruction
          ended = true;
          continue;
      }
      pc = nextPc;
      count++;
    }

    if (count === 0) return null;

    setExitPc(pc);
    // Return count (i32.const count, end)
    body.push(0x41);
    encodeSLEB128(count, body);
    body.push(0x0B); // end function

    // Build complete Wasm module bytes
    const wasm = [0x00, 0x61, 0x73, 0x6D, 0x01, 0x00, 0x00, 0x00];
    // Type section (id=1): 1 func type () -> i32
    emitSection(1, [1, 0x60, 0, 1, 0x7F], wasm);
    // Import section (id=2): 1 import "e"."m" memory(min=17)
    emitSection(2, [1, 1, 101, 1, 109, 0x02, 0x00, 17], wasm);
    // Function section (id=3): 1 func of type 0
    emitSection(3, [1, 0], wasm);
    // Export section (id=7): 1 export "r" -> func 0
    emitSection(7, [1, 1, 114, 0x00, 0], wasm);
    // Code section (id=10): 1 body
    const codeSec = [1];
    encodeULEB128(body.length, codeSec);
    for (let i = 0; i < body.length; i++) codeSec.push(body[i]);
    emitSection(10, codeSec, wasm);

    const mod = new WebAssembly.Module(new Uint8Array(wasm));
    const inst = new WebAssembly.Instance(mod, { e: { m: this.wasmMem } });
    const block = { fn: inst.exports.r, instCount: count };
    this.compiledBlocks.set(startPc, block);
    return block;
  }

  benchmarkMips(interpMips) {
    // Compile a hot arithmetic loop into Wasm and measure actual execution speed
    const dv = this.cpu.ramDV;
    const scratchPc = 0x0DE000;
    // Emit 16 arithmetic instructions at 0x0DE000 ending with JMP 0x0DE000
    for (let i = 0; i < 15; i++) {

    for (let i = 0; i < iters; i++) {
      totalInst += blk.fn();
    }
    const dt = Math.max(1, Date.now() - t0);
    return (totalInst / 1e6) / (dt / 1000);
  }
}

      initHardwareMemory(cCPU);
      let outStr = "";
      cCPU.hooks.onStdout = function(s) { outStr += s; };
      const ccBin = vfs.readFile("/bin/cc");
      cCPU.cwd = "/home";
      cCPU.loadBinary(ccBin, "/home/_test_cc.tt -o /home/_test_cc.bin");
      while (!cCPU.halted) cCPU.stepBatch(200000);
      const testBin = vfs.readFile("/home/_test_cc.bin");
      cCPU.loadBinary(testBin, "");
      while (!cCPU.halted) cCPU.stepBatch(100000);
      vfs.unlink("/home/_test_cc.tt");
      vfs.unlink("/home/_test_cc.bin");
      record("Compiler", outStr.trim() === "127", "fact(5)+strlen('TabComp')=" + outStr.trim());
    } catch (e) {
      record("Compiler", false, e.message);
    }

    // 3. Bootstrap Fixed Point (stage2 == stage3 and stage1 == stage2)
    try {
      const bRes = runThreeStageBootstrap();
      record("Bootstrap fixed point", bRes.s2_eq_s3 && bRes.s1_eq_s2,
        "stage2==stage3:" + bRes.s2_eq_s3 + ", stage1==stage2:" + bRes.s1_eq_s2 + " (" + bRes.size + " bytes)");
    } catch (e) {
      record("Bootstrap fixed point", false, e.message);
    }

    // 4. Filesystem Round-Trip (create/write/read/list/delete)
    try {
      vfs.mkdir("/home/_fstest");
      vfs.writeFile("/home/_fstest/item.txt", "XINU-1989");
      const rText = vfs.readText("/home/_fstest/item.txt");
      const list = vfs.list("/home/_fstest");
      const listOk = list && list.length === 1 && list[0].name === "item.txt" && list[0].size === 9;
      vfs.unlink("/home/_fstest/item.txt");
      vfs.unlink("/home/_fstest");
      const gone = vfs.stat("/home/_fstest") === null;
      record("FS", rText === "XINU-1989" && listOk && gone, "read=" + rText + ",listOk=" + listOk + ",deleted=" + gone);
    } catch (e) {
      record("FS", false, e.message);
    }

    // 5. Save Identity (unchanged disk produces byte-identical HTML string to pristine original)
    try {
      const pristineHTML = buildHTMLFromPristine(PRISTINE_DISK);
      const savedHTML = generateSaveHTML();
      const identical = (savedHTML === pristineHTML);
      record("Save identity", identical, "len=" + savedHTML.length + ",byteIdentical=" + identical);
    } catch (e) {
      record("Save identity", false, e.message);
    }

    // 6. Save Fidelity (modified disk saved to HTML and parsed back matches live disk)
    try {
      vfs.writeFile("/home/_fidelity.txt", "HEREDITY-OK-42");
      const modifiedHTML = generateSaveHTML();
      const mStart = modifiedHTML.indexOf('<script type="application/x-tabcomp-disk" id="tc-disk">');
      const mEnd = modifiedHTML.indexOf('<\/script>', mStart);
      const extractedB64 = modifiedHTML.slice(mStart + 55, mEnd);
      const checkFS = new TabCompFS();
      deserializeDiskB64(extractedB64, checkFS);
      const restored = checkFS.readText("/home/_fidelity.txt");
      const fCountMatch = checkFS.files.size === vfs.files.size;
      vfs.unlink("/home/_fidelity.txt");
      record("Save fidelity", restored === "HEREDITY-OK-42" && fCountMatch,
        "restored=" + restored + ",files=" + checkFS.files.size);
    } catch (e) {
      vfs.unlink("/home/_fidelity.txt");
      record("Save fidelity", false, e.message);
    }

    // 7. Export Cartridge (contains player, excludes compiler and shell)
    try {
      const cartStr = generateCartridgeHTML("/bin/breakout", "TabBreakout");
      const hasPlayer = cartStr && cartStr.indexOf("TabCompCPU") >= 0 && cartStr.indexOf("A TabComp™ Production") >= 0;
      const noCompilerOrShell = cartStr && cartStr.indexOf("compileTabTalk") < 0 && cartStr.indexOf("TABCOMP_SELFTEST") < 0;
      record("Export", !!(hasPlayer && noCompilerOrShell),
        "cartSize=" + (cartStr ? cartStr.length : 0) + ",hasPlayer=" + hasPlayer + ",noCompiler=" + noCompilerOrShell);
    } catch (e) {
      record("Export", false, e.message);
    }

    // 8. Performance (MIPS >= 5)
    try {
      const mips = measureCPU_MIPS();
      record("Performance", mips >= 5.0, mips.toFixed(1) + " MIPS");
    } catch (e) {
      record("Performance", false, e.message);
    }

    return { passed: passed, failed: failed, results: results };
  }

  window.TABCOMP_SELFTEST = function() {
    return Promise.resolve(runAllSelfTestsSync());
  };

  // Wire up CPU host hooks
  cpu.hooks.onSave = function() {
    const html = generateSaveHTML();
    triggerFileDownload(buildSaveFilename(), html);
  };
  cpu.hooks.onExport = function(binPath, title) {
    const cart = generateCartridgeHTML(binPath, title);
    if (!cart) return -1;
    const clean = (title || "game").replace(/[^a-zA-Z0-9_-]/g, "") || "game";
    triggerFileDownload(clean + ".html", cart);
    return 0;
  };
  cpu.hooks.onRebootstrap = function() {
    const r = runThreeStageBootstrap();
    return (r.s2_eq_s3 && r.s1_eq_s2) ? 0 : 1;
  };
  cpu.hooks.onSelftest = function(bufAddr) {
    const res = runAllSelfTestsSync();
    let lines = "";
    for (let i = 0; i < res.results.length; i++) {
      const item = res.results[i];
      lines += (item.pass ? "[PASS] " : "[FAIL] ") + item.name + "\n";
    }
    lines += "TOTAL: " + res.passed + " PASSED, " + res.failed + " FAILED\n";
    cpu.writeStr(bufAddr, lines, 1024);
    return res.failed;
  };
  cpu.hooks.onMips = function() {
    const m = measureCPU_MIPS();
    return Math.round(m * 10);
  };
  cpu.hooks.onJitToggle = function() {
    measureCPU_MIPS();
  };

  // UI Chrome Buttons
  document.getElementById("tc-btn-save").addEventListener("click", function() {
    cpu.hooks.onSave();
    canvas.focus();
  });
  document.getElementById("tc-btn-fs").addEventListener("click", function() {
    if (canvas.requestFullscreen) canvas.requestFullscreen();
    canvas.focus();
  });

  // Keyboard handling + Halt/Break key (Ctrl+C or Escape returns runaway app to shell)
  window.addEventListener("keydown", function(e) {
    sound.unlock();
    if ((e.ctrlKey && (e.key === "c" || e.key === "C")) || (e.key === "Escape" && cpu.procStack.length > 0)) {
      e.preventDefault();
      if (cpu.procStack.length > 0) {
        // Unwind to top-level shell
        const rootShell = cpu.procStack[0];
        cpu.procStack.length = 0;
        cpu.ram.set(rootShell.ram, 0);
        cpu.reg.set(rootShell.reg);
        cpu.pc = rootShell.pc;
        cpu.flags = rootShell.flags;
        cpu.reg[0] = 130;
        // Silence audio channels on break
        for (let i = 0; i < 32; i++) cpu.ram[0x0FFD20 + i] = 0;
        sound.syncFromRAM();
      }
      return;
    }

    if (e.key === "Tab" || e.key === "Backspace" || e.key.startsWith("Arrow") ||
        e.key === "PageUp" || e.key === "PageDown" || e.key === "Home" || e.key === "End" ||
        (e.ctrlKey && (e.key === "s" || e.key === "S" || e.key === "q" || e.key === "Q"))) {
      e.preventDefault();
    }

    let ascii = 0;
    if (e.ctrlKey && (e.key === "s" || e.key === "S")) ascii = 19;
    else if (e.ctrlKey && (e.key === "q" || e.key === "Q")) ascii = 17;
    else if (e.key.length === 1) ascii = e.key.charCodeAt(0);
    else if (e.key === "Enter") ascii = 13;
    else if (e.key === "Backspace") ascii = 8;
    else if (e.key === "Tab") ascii = 9;
    else if (e.key === "Escape") ascii = 27;

    const mods = (e.shiftKey ? 1 : 0) | (e.ctrlKey ? 2 : 0) | (e.altKey ? 4 : 0);
    const kcode = e.keyCode & 255;
    cpu.keyQueue.push((mods << 16) | (kcode << 8) | (ascii & 255));
    if (!bootDone) {
      launchShell();
    }
    if (ascii === 13 || ascii === 19 || ascii === 17 || e.ctrlKey) {
      let guard = 0;
      while (!cpu.halted && guard < 5000) {
        cpu.yielded = false;
        cpu.stepBatch(20000);
        guard++;
        if (cpu.yielded && cpu.keyQueue.length === 0) break;
      }
      renderFramebufferToCanvas(cpu, ctx2d, imgData);
    }
  });

  // Boot sequence: POST memory count + MIPS report + Bootstrap status + Launch /bin/sh
  let bootFrame = 0;
  const BOOT_TOTAL_FRAMES = 24;
  let bootDone = false;

  function drawBootBanner(frameIdx) {
    // Draw directly into TabComp framebuffer using TabComp text/rect layout
    const ram = cpu.ram;
    ram.fill(1, 0x0F0000, 0x0F0000 + 64000); // Dark blue POST screen
    const drawStr = function(x, y, s, fg, bg) {
      for (let i = 0; i < s.length; i++) {
        const ch = s.charCodeAt(i);
        const fOff = 0x0EF000 + (ch - 32) * 8;
        for (let r = 0; r < 8; r++) {
          const bits = ram[fOff + r];
          const rowOff = 0x0F0000 + (y + r) * 320;
          for (let c = 0; c < 8; c++) {
            ram[rowOff + x + i * 8 + c] = (bits & (128 >> c)) ? fg : bg;
          }
        }
      }
    };
    drawStr(16, 12, "ConsciousNode SoftWorks ROM BIOS v1.0", 14, 1);
    drawStr(16, 24, "TabComp(TM) 1.0 - The Computer That", 11, 1);
    drawStr(16, 34, "Fits In Your Tab! (XINU Architecture)", 11, 1);

    const memCount = Math.min(1048576, Math.floor(((frameIdx + 1) / 10) * 1048576));
    drawStr(16, 54, "POST MEMORY TEST: " + memCount + " BYTES OK", 15, 1);
    drawStr(16, 68, "1,048,576 BYTES FREE", 10, 1);
    drawStr(16, 82, "CPU: " + cpu.lastMips.toFixed(1) + " MIPS!", 14, 1);

    const stage = Math.min(3, Math.floor((frameIdx / BOOT_TOTAL_FRAMES) * 3) + 1);
    drawStr(16, 104, "BOOTSTRAPPING TABTALK... STAGE " + stage + " OF 3", 15, 1);

    // Progress bar
    const barW = Math.floor(((frameIdx + 1) / BOOT_TOTAL_FRAMES) * 280);
    for (let y = 120; y < 132; y++) {
      for (let x = 16; x < 16 + 280; x++) {
        ram[0x0F0000 + y * 320 + x] = (x < 16 + barW) ? 10 : 8;
      }
    }
    drawStr(16, 144, "FIXED POINT: STAGE 1 == 2 == 3 (OK)", 11, 1);
  }

  function launchShell() {
    const shBin = vfs.readFile("/bin/sh");
    cpu.cwd = "/home";
    cpu.loadBinary(shBin, "");
    bootDone = true;
    statusEl.textContent = "System Ready • Type 'help' in Shell • Ctrl+C / Esc returns to Shell";
  }

  measureCPU_MIPS();
  canvas.focus();

  function mainLoop() {
    cpu.vsyncCount = (cpu.vsyncCount + 1) | 0;
    cpu.ramDV.setInt32(0x0FFD00, (Date.now() - cpu.bootTime) | 0, true);
    cpu.ramDV.setInt32(0x0FFD04, cpu.vsyncCount, true);

    if (!bootDone) {
      if (cpu.keyQueue.length > 0) {
        bootFrame = BOOT_TOTAL_FRAMES;
      }
      drawBootBanner(bootFrame);
      renderFramebufferToCanvas(cpu, ctx2d, imgData);
      bootFrame++;
      if (bootFrame >= BOOT_TOTAL_FRAMES) {
        launchShell();
      } else {
        requestAnimationFrame(mainLoop);
        return;
      }
    }

    cpu.yielded = false;
    const sliceStart = performance.now();
    while (!cpu.halted && (performance.now() - sliceStart) < 8.0) {
      cpu.yielded = false;
      cpu.stepBatch(20000);
      if (cpu.yielded && cpu.keyQueue.length === 0) break;
    }

    if (cpu.halted) {
      // Respawn shell if top-level exited
      launchShell();
    }

    sound.syncFromRAM();
    renderFramebufferToCanvas(cpu, ctx2d, imgData);
    requestAnimationFrame(mainLoop);
  }

  requestAnimationFrame(mainLoop);
})();
</script>
</body>
