  nextToken();
  while (tok !== TK_EOF) {
    if (tok === TK_CONST) {
      nextToken();
      const cName = tokStr;
      expect(TK_IDENT);
      expect(61);
      let sign = 1;
      if (tok === 45) { sign = -1; nextToken(); }
      const cVal = (tokVal * sign) | 0;
      expect(TK_NUM);
      expect(59);
      constName[constCount] = cName;
      constVal[constCount] = cVal;
      constCount++;
      continue;
    }
    if (tok === TK_STRUCT) {
      nextToken();
      const sName = tokStr;
      expect(TK_IDENT);
      if (tok === 123) {
        nextToken();
        const sIdx = structCount++;
        structName[sIdx] = sName;
        let offset = 0;
        while (tok !== 125 && tok !== TK_EOF) {
          parseType();
          const fName = tokStr;
          expect(TK_IDENT);
          let isArr = 0;
          let count = 1;
          if (tok === 91) {
            isArr = 1;
            nextToken();
            count = tokVal;
            expect(TK_NUM);
            expect(93);
          }
          expect(59);
          const fIdx = fieldCount++;
          fieldStructIdx[fIdx] = sIdx;
          fieldName[fIdx] = fName;
          fieldType[fIdx] = parsedBaseType;
          fieldPtr[fIdx] = parsedPtr;
          fieldIsArr[fIdx] = isArr;
          const fSz = typeSize(parsedBaseType, parsedPtr, parsedStruct) * count;
          if (fSz >= 4 && (offset & 3) !== 0) offset = (offset + 3) & ~3;
          fieldOffset[fIdx] = offset;
          offset += fSz;
        }
        expect(125);
        expect(59);
        structSize[sIdx] = (offset + 3) & ~3;
        continue;
      } else {
        parsedBaseType = TY_STRUCT;
        parsedStruct = findStruct(sName);
        parsedPtr = 0;
        while (tok === 42) { parsedPtr++; nextToken(); }
      }
    } else {
      parseType();
    }

    const declBaseType = parsedBaseType;
    const declPtr = parsedPtr;
    const declStruct = parsedStruct;
    const declName = tokStr;
    expect(TK_IDENT);

    if (tok === 40) {
      nextToken();
      lCount = 0;
      const pTypes = [];
      const pPtrs = [];
      const pStructs = [];
      const pNames = [];
      let nParams = 0;
      if (tok !== 41) {
        while (true) {
          parseType();
          const pName = tokStr;
          expect(TK_IDENT);
          let pPtr = parsedPtr;
          if (tok === 91) {
            nextToken();
            expect(93);
            pPtr++;
          }
          pTypes.push(parsedBaseType);
          pPtrs.push(pPtr);
          pStructs.push(parsedStruct);
          pNames.push(pName);
          nParams++;
          if (tok === 44) nextToken();
          else break;
        }
      }
      expect(41);

      let fIdx = findFn(declName);
      if (fIdx < 0) {
        fIdx = fnCount++;
        fnName[fIdx] = declName;
        fnAddr[fIdx] = 0;
        fnDefined[fIdx] = 0;
      }
      fnRetType[fIdx] = declBaseType;
      fnRetPtr[fIdx] = declPtr;
      fnRetStruct[fIdx] = declStruct;

      if (tok === 59) {
        nextToken();
        continue;
      }

      fnAddr[fIdx] = codePos;
      fnDefined[fIdx] = 1;

      for (let i = 0; i < nParams; i++) {
        const idx = lCount++;
        lName[idx] = pNames[i];
        lType[idx] = pTypes[i];
        lPtr[idx] = pPtrs[i];
        lStruct[idx] = pStructs[i];
        lIsArr[idx] = (pPtrs[i] === 0 && pTypes[i] === TY_STRUCT) ? 2 : 0;
        lOffset[idx] = 4 + (nParams - 1 - i) * 4;
      }

      curLocalOffset = -4;
      emitI(0x24, 13, 0, 0);
      emitR(0x01, 13, 14, 0);
      emitI(0x24, 15, 0, 0);
      const spAllocPos = codePos;
      emitI(0x03, 2, 0, 0); // LDIU R2, frameSize (patched)
      emitR(0x06, 14, 14, 2); // SUB SP, SP, R2

      parseStmt();

      const frameSize = (-4 - curLocalOffset);
      codeDV.setUint16(spAllocPos, frameSize & 0xFFFF, true);

      emitLoadImm(0, 0);
      emitFuncReturn();
    } else {
      let ptr = declPtr;
      let vName = declName;
      while (true) {
        let isArr = 0;
        let elemCount = 1;
        if (tok === 91) {
          isArr = 1;
          nextToken();
          elemCount = tokVal;
          expect(TK_NUM);
          expect(93);
        }
        const sz = typeSize(declBaseType, ptr, declStruct) * elemCount;
        const alignedSz = (sz + 3) & ~3;
        const idx = gCount++;
        gName[idx] = vName;
        gType[idx] = declBaseType;
        gPtr[idx] = ptr;
        gStruct[idx] = declStruct;
        gIsArr[idx] = isArr;
        gAddr[idx] = gNextAddr;
        gNextAddr += alignedSz;

        if (tok === 44) {
          nextToken();
          ptr = 0;
          while (tok === 42) { ptr++; nextToken(); }
          vName = tokStr;
          expect(TK_IDENT);
        } else {
          break;
        }
      }
      expect(59);
    }

  const mainIdx = findFn('main');
  if (mainIdx < 0 || !fnDefined[mainIdx]) {
    throw new Error('Undefined main() function');
  }
  patchAddr24(0, fnAddr[mainIdx]);

  for (let i = 0; i < fixupCount; i++) {
    const fIdx = fixupFnIdx[i];
    if (!fnDefined[fIdx]) {
      throw new Error(`Undefined function '${fnName[fIdx]}'`);
    }
    patchAddr24(fixupCodeAddr[i], fnAddr[fIdx]);
  }

  function measurePeakMIPS() {
    const benchFS = new TabCompFS();
    const benchCPU = new TabCompCPU(benchFS);
    const dv = benchCPU.ramDV;
    dv.setUint32(0, (0x02 << 24) | (0 << 20) | 0, true);

    dv.setUint32(8, (0x05 << 24) | (1 << 20) | (1 << 16) | (0 << 12), true);

  // Honest real-workload benchmark: compiles /src/edit.tt (or /src/cc.tt) with both Interpreter and WebAssembly JIT
  function benchmarkRealWorkload(targetSrc) {
    const srcPath = targetSrc || "/src/edit.tt";
    const ccBin = vfs.readFile("/bin/cc");
    const bCPU = new TabCompCPU(vfs);
    initHardwareMemory(bCPU);

    bCPU.interpInstCount = 0;
    bCPU.cwd = "/src";
    bCPU.loadBinary(ccBin, srcPath + " -o /home/_bench_out.bin");
    const t0 = performance.now();
    while (!bCPU.halted) bCPU.stepBatch(500000);
    const interpMs = Math.max(0.5, performance.now() - t0);
    const interpSteps = bCPU.interpInstCount;
    const interpMips = (interpSteps / 1e6) / (interpMs / 1000);

    // 2. WebAssembly JIT cold run (populates Wasm blocks)
    bCPU.jitEnabled = 1;
    bCPU.jitInstCount = 0;
    bCPU.interpInstCount = 0;
    bCPU.cwd = "/src";
    bCPU.loadBinary(ccBin, srcPath + " -o /home/_bench_out.bin");
    const t1 = performance.now();
    while (!bCPU.halted) bCPU.stepBatch(500000);
    const jitColdMs = Math.max(0.5, performance.now() - t1);
    const jitColdTotal = bCPU.jitInstCount + bCPU.interpInstCount;
    const jitColdMips = (jitColdTotal / 1e6) / (jitColdMs / 1000);

    // 3. WebAssembly JIT warm run
    bCPU.jitInstCount = 0;
    bCPU.interpInstCount = 0;
    bCPU.cwd = "/src";
    bCPU.loadBinary(ccBin, srcPath + " -o /home/_bench_out.bin");
    const t2 = performance.now();
    while (!bCPU.halted) bCPU.stepBatch(500000);
    const jitWarmMs = Math.max(0.5, performance.now() - t2);

  function runThreeStageBootstrap(forceJit, srcFile) {
    const target = srcFile || "/src/cc.tt";
    const bCPU = new TabCompCPU(vfs);
    initHardwareMemory(bCPU);
    bCPU.jitEnabled = (forceJit !== undefined) ? forceJit : cpu.jitEnabled;

    const s1 = compileTabTalk(target, vfs);
    vfs.writeFile("/bin/cc_stage1", s1);

    bCPU.cwd = "/src";
    bCPU.loadBinary(s1, target + " -o /bin/cc_stage2");
    while (!bCPU.halted) bCPU.stepBatch(500000);
    const s2 = vfs.readFile("/bin/cc_stage2");

    bCPU.cwd = "/src";
    bCPU.loadBinary(s2, target + " -o /bin/cc_stage3");
    while (!bCPU.halted) bCPU.stepBatch(500000);
    const s3 = vfs.readFile("/bin/cc_stage3");

    const eq = function(a, b) {
      if (!a || !b || a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
      return true;
    };
    const s2_eq_s3 = eq(s2, s3);
    const s1_eq_s2 = eq(s1, s2);
    if (s2_eq_s3 && !srcFile) {
      vfs.writeFile("/bin/cc", s3);
    }
    vfs.unlink("/bin/cc_stage1");
    vfs.unlink("/bin/cc_stage2");
    vfs.unlink("/bin/cc_stage3");
    return {
      s2_eq_s3: s2_eq_s3,
      s1_eq_s2: s1_eq_s2,
      size: s3 ? s3.length : 0,
      s2: s2,
      s3: s3,
      jitSteps: bCPU.jitInstCount,
      interpSteps: bCPU.interpInstCount
    };
  }

      emit((0x24 << 24) | (3 << 20));
      emit((0x25 << 24) | (8 << 20));
      emit((0x2F << 24) | 0);
      tCPU.reg[14] = 0x0DF000;
      tCPU.stepBatch(100);
      const ok = (tCPU.reg[3] === -6 && tCPU.reg[4] === -2 && tCPU.reg[6] === -25 && tCPU.reg[7] === 231 && tCPU.reg[8] === -6);
      record("ISA", ok, "R3=" + tCPU.reg[3] + ",R4=" + tCPU.reg[4] + ",R6=" + tCPU.reg[6] + ",R7=" + tCPU.reg[7] + ",R8=" + tCPU.reg[8]);
    } catch (e) {
      record("ISA", false, e.message);
    }

    // 2. Compiler Test (recursion, pointers, structs, strings)
    try {
      const testProg = [
        'import "/src/lib/std.tt";',
        'struct Pair { int a; int b; };',
        'int fact(int n) { if (n <= 1) return 1; return n * fact(n - 1); }',
        'int main() {',
        '  struct Pair p;',
        '  p.a = fact(5);',
        '  int* ptr = &p.b;',
        '  *ptr = strlen("TabComp");',
        '  print_int(p.a + p.b);',
        '  return 0;',
        '}'
      ].join("\n");
      vfs.writeFile("/home/_test_cc.tt", testProg);
      const cCPU = new TabCompCPU(vfs);
      initHardwareMemory(cCPU);
      cCPU.jitEnabled = 1;
      let outStr = "";
      cCPU.hooks.onStdout = function(s) { outStr += s; };
      const ccBin = vfs.readFile("/bin/cc");
      cCPU.cwd = "/home";
      cCPU.loadBinary(ccBin, "/home/_test_cc.tt -o /home/_test_cc.bin");
      while (!cCPU.halted) cCPU.stepBatch(200000);
      const testBin = vfs.readFile("/home/_test_cc.bin");
      cCPU.loadBinary(testBin, "");
      while (!cCPU.halted) cCPU.stepBatch(100000);
      vfs.unlink("/home/_test_cc.tt");
      vfs.unlink("/home/_test_cc.bin");
      record("Compiler", outStr.trim() === "127", "fact(5)+strlen('TabComp')=" + outStr.trim());
    } catch (e) {
      record("Compiler", false, e.message);
    }

    // 3. Bootstrap Fixed Point (Interpreter stage1 == stage2 == stage3)
    let interpStage3 = null;
    try {
      const bRes = runThreeStageBootstrap(0);
      interpStage3 = bRes.s3;
      record("Bootstrap fixed point", bRes.s2_eq_s3 && bRes.s1_eq_s2,
        "stage2==stage3:" + bRes.s2_eq_s3 + ", stage1==stage2:" + bRes.s1_eq_s2 + " (" + bRes.size + " bytes)");
    } catch (e) {
      record("Bootstrap fixed point", false, e.message);
    }

    // 4. Filesystem Round-Trip
    try {
      vfs.mkdir("/home/_fstest");
      vfs.writeFile("/home/_fstest/item.txt", "XINU-1989");
      const rText = vfs.readText("/home/_fstest/item.txt");
      const list = vfs.list("/home/_fstest");
      const listOk = list && list.length === 1 && list[0].name === "item.txt" && list[0].size === 9;
      vfs.unlink("/home/_fstest/item.txt");
      vfs.unlink("/home/_fstest");
      const gone = vfs.stat("/home/_fstest") === null;
      record("FS", rText === "XINU-1989" && listOk && gone, "read=" + rText + ",listOk=" + listOk + ",deleted=" + gone);
    } catch (e) {
      record("FS", false, e.message);
    }

    // 5. Save Identity
    try {
      const pristineHTML = buildHTMLFromPristine(PRISTINE_DISK);
      const savedHTML = generateSaveHTML();
      const identical = (savedHTML === pristineHTML);
      record("Save identity", identical, "len=" + savedHTML.length + ",byteIdentical=" + identical);
    } catch (e) {
      record("Save identity", false, e.message);
    }

    // 6. Save Fidelity
    try {
      vfs.writeFile("/home/_fidelity.txt", "HEREDITY-OK-42");
      const modifiedHTML = generateSaveHTML();
      const mStart = modifiedHTML.indexOf('<script type="application/x-tabcomp-disk" id="tc-disk">');
      const mEnd = modifiedHTML.indexOf('<\/script>', mStart);
      const extractedB64 = modifiedHTML.slice(mStart + 55, mEnd);
      const checkFS = new TabCompFS();
      deserializeDiskB64(extractedB64, checkFS);
      const restored = checkFS.readText("/home/_fidelity.txt");
      const fCountMatch = checkFS.files.size === vfs.files.size;
      vfs.unlink("/home/_fidelity.txt");
      record("Save fidelity", restored === "HEREDITY-OK-42" && fCountMatch,
        "restored=" + restored + ",files=" + checkFS.files.size);
    } catch (e) {
      vfs.unlink("/home/_fidelity.txt");
      record("Save fidelity", false, e.message);
    }

    // 7. Export Cartridge (checks player, TabPad, playerHandleKey, INITIAL_CLOCK, and trimmed CSS without .tk-board)
    try {
      const cartStr = generateCartridgeHTML("/bin/breakout", "TabBreakout");
      const hasPlayer = cartStr && cartStr.indexOf("TabCompCPU") >= 0 && cartStr.indexOf("presentBuf") >= 0 &&
        cartStr.indexOf("buildTabPad") >= 0 && cartStr.indexOf("playerHandleKey") >= 0 && cartStr.indexOf("INITIAL_CLOCK") >= 0;
      const noCompilerOrTabKey = cartStr && cartStr.indexOf("compileTabTalk") < 0 &&
        cartStr.indexOf("TABCOMP_SELFTEST") < 0 && cartStr.indexOf(".tk-board") < 0;
      record("Export", !!(hasPlayer && noCompilerOrTabKey),
        "cartSize=" + (cartStr ? cartStr.length : 0) + ",hasTabPad=" + hasPlayer + ",trimmedCSS=" + noCompilerOrTabKey);
    } catch (e) {
      record("Export", false, e.message);
    }

    // 8. Performance
    try {
      const peak = measurePeakMIPS();
      record("Performance", peak >= 5.0, peak.toFixed(1) + " MIPS (peak)");
    } catch (e) {
      record("Performance", false, e.message);
    }

    // 9. Font & MMIO Bounds Test ("aZ{~" rendered via draw_char vs FONT_8X8_HEX bit-for-bit + verifyHardwareRegions assertion)
    try {
      const badOob = verifyHardwareRegions([{ name: "BAD_FONT", start: 0x0FFE00, size: 768 }]);
      const badOvl = verifyHardwareRegions([
        { name: "R1", start: 0x0F0000, size: 64000 },
        { name: "R2", start: 0x0FF000, size: 512 }
      ]);
      const assertChecksOk = cpu.hwAssertOk && !badOob.ok && !badOvl.ok;

      const fontProg = [
        'import "/src/lib/std.tt";',
        'int main() {',
        '  cls(0);',
        '  draw_char(0, 0, 97, 15, 0);',  // 'a'
        '  draw_char(8, 0, 90, 15, 0);',  // 'Z'
        '  draw_char(16, 0, 123, 15, 0);', // '{'
        '  draw_char(24, 0, 126, 15, 0);', // '~'
        '  return 0;',
        '}'
      ].join("\n");
      vfs.writeFile("/home/_font_test.tt", fontProg);
      const fontBin = compileTabTalk("/home/_font_test.tt", vfs);
      vfs.unlink("/home/_font_test.tt");

      const fCPU = new TabCompCPU(vfs);
      initHardwareMemory(fCPU);
      fCPU.loadBinary(fontBin, "");
      while (!fCPU.halted) fCPU.stepBatch(100000);

      const testChars = [97, 90, 123, 126];
      let bitsMatch = true;
      let checkedBits = 0;
      for (let ci = 0; ci < testChars.length; ci++) {
        const ch = testChars[ci];
        const fOff = (ch - 32) * 8;
        for (let r = 0; r < 8; r++) {
          const expectedByte = parseInt(FONT_8X8_HEX.substr((fOff + r) * 2, 2), 16);
          for (let c = 0; c < 8; c++) {
            const expectedPix = (expectedByte & (128 >> c)) ? 15 : 0;
            const actualPix = fCPU.ram[0x0F0000 + r * 320 + ci * 8 + c];
            if (actualPix !== expectedPix) bitsMatch = false;
            checkedBits++;
          }
        }
      }
      record("Font & MMIO bounds", assertChecksOk && bitsMatch,
        "hwAssert=" + assertChecksOk + ",glyphs='aZ{~'(" + checkedBits + "/256 bits match)");
    } catch (e) {
      vfs.unlink("/home/_font_test.tt");
      record("Font & MMIO bounds", false, e.message);
    }

    // 10. Tear-Free YIELD Present Test (cls(1) -> rect(20,20,100,60,14) -> yield() under tiny slice budget)
    try {
      const tearProg = [
        'import "/src/lib/std.tt";',
        'int main() {',
        '  int f = 0;',
        '  while (f < 3) {',
        '    cls(1);',
        '    rect(20, 20, 100, 60, 14);',
        '    yield();',
        '    f++;',
        '  }',
        '  return 0;',
        '}'
      ].join("\n");
      vfs.writeFile("/home/_tear_test.tt", tearProg);
      const tearBin = compileTabTalk("/home/_tear_test.tt", vfs);
      vfs.unlink("/home/_tear_test.tt");

      const yCPU = new TabCompCPU(vfs);
      initHardwareMemory(yCPU);
      yCPU.loadBinary(tearBin, "");
      let slices = 0;
      let tornSlices = 0;
      let checkedSlices = 0;
      // Run with a 2,500-instruction slice budget (a single frame takes ~285,000 instructions, so >110 slices per frame!)
      while (!yCPU.halted && slices < 500) {
        yCPU.yielded = false;
        yCPU.stepBatch(2500);
        slices++;
        if (yCPU.presentCount > 0) {
          checkedSlices++;
          const pb = yCPU.presentBuf;
          // Verify key interior and exterior scanlines in presentBuf have the complete rectangle and zero tearing
          for (let y = 0; y < 200; y += 5) {
            const inY = (y >= 20 && y < 80);
            for (let x = 0; x < 320; x += 4) {
              const inX = (x >= 20 && x < 120);
              const exp = (inX && inY) ? 14 : 1;
              if (pb[y * 320 + x] !== exp) {
                tornSlices++;
                break;
              }
            }
          }
        }
      }
      record("Tear-free YIELD present", yCPU.presentCount === 3 && checkedSlices > 100 && tornSlices === 0,
        "frames=" + yCPU.presentCount + ",slices=" + slices + ",tornSlices=" + tornSlices);
    } catch (e) {
      vfs.unlink("/home/_tear_test.tt");
      record("Tear-free YIELD present", false, e.message);
    }

    // 11. Disk Binary Reproducibility (recompile every /bin/* from /src/*.tt using /bin/cc and compare bytes)
    try {
      const targets = ["cc", "sh", "edit", "sprite", "breakout", "tracker", "tilemap"];
      const ccBin = vfs.readFile("/bin/cc");
      const rCPU = new TabCompCPU(vfs);
      initHardwareMemory(rCPU);
      rCPU.jitEnabled = 1;
      let matchedCount = 0;
      for (let i = 0; i < targets.length; i++) {
        const name = targets[i];
        const tmpOut = "/home/_repro_" + name;
        rCPU.cwd = "/src";
        rCPU.loadBinary(ccBin, "/src/" + name + ".tt -o " + tmpOut);
        while (!rCPU.halted) rCPU.stepBatch(500000);
        const fresh = vfs.readFile(tmpOut);
        const diskBin = vfs.readFile("/bin/" + name);
        vfs.unlink(tmpOut);
        if (fresh && diskBin && fresh.length === diskBin.length) {
          let same = true;
          for (let k = 0; k < fresh.length; k++) {
            if (fresh[k] !== diskBin[k]) { same = false; break; }
          }
          if (same) matchedCount++;
        }
      }
      record("Disk binary reproducibility", matchedCount === targets.length,
        matchedCount + "/" + targets.length + " binaries match /src/*.tt byte-for-byte");
    } catch (e) {
      record("Disk binary reproducibility", false, e.message);
    }

    // 12. JIT Bootstrap Equivalence (3-stage bootstrap with jit on == jit off byte-for-byte)
    try {
      const jRes = runThreeStageBootstrap(1);
      let matchesInterp = false;
      if (interpStage3 && jRes.s3 && interpStage3.length === jRes.s3.length) {
        matchesInterp = true;
        for (let i = 0; i < interpStage3.length; i++) {
          if (interpStage3[i] !== jRes.s3[i]) { matchesInterp = false; break; }
        }
      }
      const ok = jRes.s2_eq_s3 && jRes.s1_eq_s2 && matchesInterp && jRes.jitSteps > 10000000;
      record("JIT bootstrap equivalence", ok,
        "jitSteps=" + jRes.jitSteps + ",interpSteps=" + jRes.interpSteps + ",matchInterp=" + matchesInterp);
    } catch (e) {
      record("JIT bootstrap equivalence", false, e.message);
    }

    // 13. JIT Tamper Fixed Point (KEHA trailer with jit on)
    try {
      const origCC = vfs.readText("/src/cc.tt");
      const tampered = origCC.replace("int outFd = fopen(outPath, 1);", "emit32(0x4148454B);\n  int outFd = fopen(outPath, 1);");
      vfs.writeFile("/src/_cc_keha.tt", tampered);
      const tRes = runThreeStageBootstrap(1, "/src/_cc_keha.tt");
      vfs.unlink("/src/_cc_keha.tt");
      const s2 = tRes.s2;
      const s3 = tRes.s3;
      const tail = s3 && s3.length >= 4
        ? String.fromCharCode(s3[s3.length - 4], s3[s3.length - 3], s3[s3.length - 2], s3[s3.length - 1])
        : "";
      const ok = tRes.s2_eq_s3 && !tRes.s1_eq_s2 && tail === "KEHA" && tRes.jitSteps > 10000000;
      record("JIT tamper fixed point", ok,
        "tail=" + tail + ",s2==s3=" + tRes.s2_eq_s3 + ",jitSteps=" + tRes.jitSteps);
    } catch (e) {
      vfs.unlink("/src/_cc_keha.tt");
      record("JIT tamper fixed point", false, e.message);
    }

    // 14. Clock Governor Test (1.0s wall time under clock 25, JIT off and JIT on, within ±3% of 25,000,000)
    try {
      const loopProg = [
        'int main() {',
        '  int i = 0;',
        '  while (i < 200000000) {',
        '    i++;',
        '  }',
        '  return i;',
        '}'
      ].join("\n");
      vfs.writeFile("/home/_clk_test.tt", loopProg);
      const loopBin = compileTabTalk("/home/_clk_test.tt", vfs);
      vfs.unlink("/home/_clk_test.tt");

      const runOneSec = function(jitMode) {
        const gCPU = new TabCompCPU(vfs);
        initHardwareMemory(gCPU);
        gCPU.jitEnabled = jitMode;
        gCPU.loadBinary(loopBin, "");
        const tStart = performance.now();
        gCPU.setClock(25, tStart);
        let now = tStart;
        while ((now - tStart) < 1000.0) {
          gCPU.runGovernedSlice(now, 8.0, false);
          now = performance.now();
        }
        gCPU.runGovernedSlice(now, 8.0, false);
        return gCPU.jitInstCount + gCPU.interpInstCount;
      };

      const interpCount = runOneSec(0);
      const jitCount = runOneSec(1);
      const minOk = Math.floor(25000000 * 0.97); // 24,250,000
      const maxOk = Math.ceil(25000000 * 1.03);  // 25,750,000
      const ok = (interpCount >= minOk && interpCount <= maxOk) && (jitCount >= minOk && jitCount <= maxOk);
      record("Clock governor (25 MIPS)", ok,
        "interp=" + interpCount + ",jit=" + jitCount + " (target 25M ±3%)");
    } catch (e) {
      vfs.unlink("/home/_clk_test.tt");
      record("Clock governor (25 MIPS)", false, e.message);
    }

    // 15. Clock Debt Cap Test (simulated 2-second stall under clock 25 produces <= ~100 ms catch-up)
    try {
      const loopProg = [
        'int main() {',
        '  int i = 0;',
        '  while (i < 200000000) { i++; }',
        '  return i;',
        '}'
      ].join("\n");
      vfs.writeFile("/home/_stall_test.tt", loopProg);
      const loopBin = compileTabTalk("/home/_stall_test.tt", vfs);
      vfs.unlink("/home/_stall_test.tt");

      const sCPU = new TabCompCPU(vfs);
      initHardwareMemory(sCPU);
      sCPU.jitEnabled = 1;
      sCPU.loadBinary(loopBin, "");
      const t0 = performance.now();
      sCPU.setClock(25, t0);
      const catchupSteps = sCPU.runGovernedSlice(t0 + 2000.0, 50.0, false);
      const ok = catchupSteps >= 2400000 && catchupSteps <= 2550000 && Math.abs(sCPU.clockBudget) < 5000;
      record("Clock debt cap (2s stall)", ok,
        "catchup=" + catchupSteps + " inst (~" + (catchupSteps / 25000).toFixed(1) + "ms at 25 MIPS)");
    } catch (e) {
      vfs.unlink("/home/_stall_test.tt");
      record("Clock debt cap (2s stall)", false, e.message);
    }

    // 16. Shell Command History Test (inject "ver\n", "ls\n", Up, Up, "\n" and verify last command executed was "ver")
    try {
      const shBin = vfs.readFile("/bin/sh");
      const hCPU = new TabCompCPU(vfs);
      initHardwareMemory(hCPU);
      hCPU.jitEnabled = 1;
      hCPU.cwd = "/home";
      let outLog = "";
      hCPU.hooks.onStdout = function(s) { outLog += s; };
      hCPU.loadBinary(shBin, "");

      const pushStr = function(str) {
        for (let i = 0; i < str.length; i++) {
          const c = str.charCodeAt(i);
          hCPU.keyQueue.push(((c === 10 ? 13 : c) << 8) | (c === 10 ? 13 : c));
        }
      };
      const pushKey = function(kcode, ascii) {
        hCPU.keyQueue.push(((kcode & 255) << 8) | (ascii & 255));
      };

      for (let i = 0; i < 40 && !hCPU.yielded; i++) hCPU.stepBatch(20000);

      pushStr("ver\n");
      pushStr("ls\n");
      pushKey(38, 0);  // Up -> recalls "ls"
      pushKey(38, 0);  // Up -> recalls "ver"
      pushKey(13, 13); // Enter -> executes "ver"

      let guard = 0;
      while (!hCPU.halted && guard < 400) {
        hCPU.yielded = false;
        hCPU.stepBatch(25000);
        guard++;
        if (hCPU.yielded && hCPU.keyQueue.length === 0) break;
      }

      const lsPos = outLog.indexOf("hello.tt");
      const secondVerPos = lsPos >= 0 ? outLog.indexOf("TabComp(TM) Personal Computer OS v", lsPos) : -1;
      const ok = lsPos >= 0 && secondVerPos > lsPos;
      record("Shell command history", ok,
        "recalled='ver',lsPos=" + lsPos + ",verAfterLs=" + secondVerPos);
    } catch (e) {
      record("Shell command history", false, e.message);
    }

    return { passed: passed, failed: failed, results: results };
  }

  // Keyboard handling + Halt/Break key (Ctrl+C or Escape returns runaway app to shell)
  function tcHandleKey(e) {
    sound.unlock();
    if ((e.ctrlKey && (e.key === "c" || e.key === "C")) || (e.key === "Escape" && cpu.procStack.length > 0)) {
      e.preventDefault();
      if (cpu.procStack.length > 0) {
        const rootShell = cpu.procStack[0];
        cpu.procStack.length = 0;
        if (cpu.jit) cpu.jit.invalidateAll();
        cpu.ram.set(rootShell.ram, 0);
        cpu.reg.set(rootShell.reg);
        cpu.pc = rootShell.pc;
        cpu.flags = rootShell.flags;
        cpu.reg[0] = 130;
        for (let i = 0; i < 32; i++) cpu.ram[0x0FFD20 + i] = 0;
        sound.syncFromRAM();
        cpu.presentNow();
      }
      return;
    }

    if (e.key === "Tab" || e.key === "Backspace" || e.key.startsWith("Arrow") ||
        e.key === "PageUp" || e.key === "PageDown" || e.key === "Home" || e.key === "End" ||
        (e.ctrlKey && (e.key === "s" || e.key === "S" || e.key === "q" || e.key === "Q"))) {
      e.preventDefault();
    }

    let ascii = 0;
    if (e.ctrlKey && (e.key === "s" || e.key === "S")) ascii = 19;
    else if (e.ctrlKey && (e.key === "q" || e.key === "Q")) ascii = 17;
    else if (e.key.length === 1) ascii = e.key.charCodeAt(0);
    else if (e.key === "Enter") ascii = 13;
    else if (e.key === "Backspace") ascii = 8;
    else if (e.key === "Tab") ascii = 9;
    else if (e.key === "Escape") ascii = 27;

    const mods = (e.shiftKey ? 1 : 0) | (e.ctrlKey ? 2 : 0) | (e.altKey ? 4 : 0);
    const kcode = e.keyCode & 255;
    cpu.keyQueue.push((mods << 16) | (kcode << 8) | (ascii & 255));
    if (!bootDone) {
      launchShell();
    }
    // 1.2.1 (Kehai Interim): this instant-response burst runs only with TURBO on.
    // At a fixed clock it would run up to 100M instructions outside the governor.
    if (cpu.clockRate === 0 && (ascii === 13 || ascii === 19 || ascii === 17 || e.ctrlKey)) {
      let guard = 0;
      while (!cpu.halted && guard < 5000) {
        cpu.yielded = false;
        cpu.stepBatch(20000);
        guard++;
        if (cpu.yielded && cpu.keyQueue.length === 0) break;
      }
      cpu.presentFallbackIfStale(performance.now());
      renderFramebufferToCanvas(cpu, ctx2d, imgData);
    }
  }
  window.addEventListener("keydown", tcHandleKey);

  // TabKey(TM) 101: on-screen keyboard for touch screens (1.0.2, Kehai Interim).
  // Built here from the core script so `save` reproduces it like everything else.
  (function buildTabKey() {
    const chassis = document.querySelector(".tc-chassis");
    const controls = document.querySelector(".tc-controls");
    if (!chassis) return;
    const KC = { "-":189, "=":187, "[":219, "]":221, "\\":220, ";":186, "'":222, ",":188, ".":190, "/":191, "`":192, " ":32 };
    const SH = { "`":"~", "1":"!", "2":"@", "3":"#", "4":"$", "5":"%", "6":"^", "7":"&", "8":"*", "9":"(", "0":")",
                 "-":"_", "=":"+", "[":"{", "]":"}", "\\":"|", ";":":", "'":"\"", ",":"<", ".":">", "/":"?" };
    const chars = function(str) { return str.split("").map(function(c) { return [c]; }); };
    const ROWS = [
      [["Esc","Escape",27,1.4]].concat(chars("`1234567890-="), [["⌫","Backspace",8,1.6,1]]),
      [["Tab","Tab",9,1.5]].concat(chars("qwertyuiop[]\\")),
      [["Ctrl","CTRL",0,1.8]].concat(chars("asdfghjkl;'"), [["Enter","Enter",13,2.1]]),
      [["Shift","SHIFT",0,2.3]].concat(chars("zxcvbnm,./"), [["Shift","SHIFT",0,2.3]]),
      [["PgUp","PageUp",33,1.2,1],["PgDn","PageDown",34,1.2,1],["Home","Home",36,1.2],["End","End",35,1.2],
       ["Space"," ",32,4.5,1],["←","ArrowLeft",37,1,1],["↑","ArrowUp",38,1,1],["↓","ArrowDown",40,1,1],["→","ArrowRight",39,1,1]]
    ];
    let shift = 0, ctrl = 0; // 0 off, 1 one-shot, 2 locked (double-tap)
    let lastMod = null, lastModT = 0; // a double-tap must be two taps of the same modifier in a row
    const board = document.createElement("div");
    board.className = "tk-board";
    const label = document.createElement("div");
    label.className = "tk-label";
    label.innerHTML = "<span>TabKey™ 101</span><span>ConsciousNode SoftWorks</span>";
    board.appendChild(label);
    const capKeys = [], modKeys = { SHIFT: [], CTRL: [] };
    function send(key, code) {
      const isShift = shift > 0, isCtrl = ctrl > 0;
      tcHandleKey({ key: key, keyCode: code, shiftKey: isShift, ctrlKey: isCtrl, altKey: false, preventDefault: function() {} });
      if (shift === 1) shift = 0;
      if (ctrl === 1) ctrl = 0;
      lastMod = null;
      refresh();
    }
    function refresh() {
      ["SHIFT", "CTRL"].forEach(function(m) {
        const v = m === "SHIFT" ? shift : ctrl;
        modKeys[m].forEach(function(b) { b.classList.toggle("tk-lit", v === 1); b.classList.toggle("tk-lock", v === 2); });
      });
      capKeys.forEach(function(o) {
        const c = o.ch;
        o.el.textContent = shift ? (SH[c] || c.toUpperCase()) : c;
      });
    }
    ROWS.forEach(function(row) {
      const r = document.createElement("div");
      r.className = "tk-row";
      row.forEach(function(k) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "tk-key";
        b.style.flexGrow = String(k[3] || 1);
        b.textContent = k[0];
        if (k.length === 1) {
          capKeys.push({ el: b, ch: k[0] });
        } else {
          b.classList.add("tk-mod");
          if (k[1] === "SHIFT" || k[1] === "CTRL") modKeys[k[1]].push(b);
        }
        let repeatT = null;
        const press = function() {
          if (k.length === 1) {
            const c = k[0];
            let key = c, code = KC[c] || c.toUpperCase().charCodeAt(0);
            if (shift) key = SH[c] || c.toUpperCase();
            if (ctrl) key = c; // Ctrl+letter: the handler maps s, q and c
            send(key, code);
          } else if (k[1] === "SHIFT" || k[1] === "CTRL") {
            const now = Date.now(), dbl = lastMod === k[1] && now - lastModT < 350;
            lastMod = k[1]; lastModT = now;
            if (k[1] === "SHIFT") shift = dbl ? 2 : (shift ? 0 : 1);
            else ctrl = dbl ? 2 : (ctrl ? 0 : 1);
            refresh();
          } else {
            send(k[1], k[2]);
          }
        };
        const stop = function() {
          b.classList.remove("tk-down");
          if (repeatT) { clearTimeout(repeatT); repeatT = null; }
        };
        b.addEventListener("pointerdown", function(ev) {
          ev.preventDefault();
          b.classList.add("tk-down");
          press();
          if (k[4]) {
            const rep = function() { press(); repeatT = setTimeout(rep, 70); };
            repeatT = setTimeout(rep, 420);
          }
        });
        b.addEventListener("pointerup", stop);
        b.addEventListener("pointerleave", stop);
        b.addEventListener("pointercancel", stop);
        b.addEventListener("contextmenu", function(ev) { ev.preventDefault(); });
        r.appendChild(b);
      });
      board.appendChild(r);
    });
    chassis.appendChild(board);
    if (controls) {
      const t = document.createElement("button");
      t.type = "button";
      t.className = "tc-btn";
      t.title = "On-screen keyboard";
      t.textContent = "⌨ Keys";
      t.addEventListener("click", function() { board.classList.toggle("tk-on"); });
      controls.appendChild(t);
    }
    const coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    if (coarse) board.classList.add("tk-on");
    refresh();
  })();

  // Also attach TabPad(TM) game controller toggle on the main computer
  buildTabPad(document.querySelector(".tc-chassis"), document.querySelector(".tc-controls"), tcHandleKey, false);

  // Boot sequence: POST memory count + MMIO assertion + MIPS report + Bootstrap status + Launch /bin/sh
  let bootFrame = 0;
  const BOOT_TOTAL_FRAMES = 24;
  let bootDone = false;

  function drawBootBanner(frameIdx) {
    const ram = cpu.ram;
    ram.fill(1, 0x0F0000, 0x0F0000 + 64000);
    const drawStr = function(x, y, s, fg, bg) {
      for (let i = 0; i < s.length; i++) {
        const ch = s.charCodeAt(i);
        const fOff = 0x0EF000 + (ch - 32) * 8;
        for (let r = 0; r < 8; r++) {
          const bits = ram[fOff + r];
          const rowOff = 0x0F0000 + (y + r) * 320;
          for (let c = 0; c < 8; c++) {
            ram[rowOff + x + i * 8 + c] = (bits & (128 >> c)) ? fg : bg;
          }
        }
      }
    };
    drawStr(16, 12, "ConsciousNode SoftWorks ROM BIOS v" + VERSION, 14, 1);
    drawStr(16, 24, "TabComp(TM) " + VERSION + " - The Computer That", 11, 1);
    drawStr(16, 34, "Fits In Your Tab! (XINU Architecture)", 11, 1);

    if (!cpu.hwAssertOk) {
      drawStr(16, 52, "POST HW ASSERT FAIL:", 12, 1);
      drawStr(16, 64, cpu.hwAssertMsg.slice(0, 36), 12, 1);
      cpu.presentNow();
      return;
    }

    const memCount = Math.min(1048576, Math.floor(((frameIdx + 1) / 10) * 1048576));
    drawStr(16, 50, "POST MEMORY TEST: " + memCount + " BYTES OK", 15, 1);
    drawStr(16, 62, "HW MMIO MAP: 6 REGIONS VERIFIED OK", 10, 1);
    drawStr(16, 74, "1,048,576 BYTES FREE", 10, 1);
    const jitTag = cpu.jitEnabled ? " (JIT)" : "";
    drawStr(16, 86, "CPU: " + cpu.peakMips.toFixed(0) + " MIPS | run: " + cpu.runMips.toFixed(0) + " MIPS" + jitTag, 14, 1);

    const stage = Math.min(3, Math.floor((frameIdx / BOOT_TOTAL_FRAMES) * 3) + 1);
    drawStr(16, 104, "BOOTSTRAPPING TABTALK... STAGE " + stage + " OF 3", 15, 1);

    const barW = Math.floor(((frameIdx + 1) / BOOT_TOTAL_FRAMES) * 280);
    for (let y = 120; y < 132; y++) {
      for (let x = 16; x < 16 + 280; x++) {
        ram[0x0F0000 + y * 320 + x] = (x < 16 + barW) ? 10 : 8;
      }
    }
    drawStr(16, 144, "FIXED POINT: STAGE 1 == 2 == 3 (OK)", 11, 1);
    cpu.presentNow();
  }

  function launchShell() {
    const shBin = vfs.readFile("/bin/sh");
    cpu.cwd = "/home";
    cpu.loadBinary(shBin, "");
    cpu.clockLastTime = performance.now();
    bootDone = true;
    statusEl.textContent = "System Ready • Type 'help' in Shell • Ctrl+C / Esc returns to Shell";
  }

  measurePeakMIPS();
  canvas.focus();

  let rollingSteps = 0;
  let rollingMs = 0;

  function mainLoop() {
    const sliceStart = performance.now();
    cpu.vsyncCount = (cpu.vsyncCount + 1) | 0;
    cpu.ramDV.setInt32(0x0FFD00, (sliceStart - cpu.bootPerf) | 0, true);
    cpu.ramDV.setInt32(0x0FFD04, cpu.vsyncCount, true);

    if (!bootDone) {
      if (cpu.keyQueue.length > 0) {
        bootFrame = BOOT_TOTAL_FRAMES;
      }
      drawBootBanner(bootFrame);
      renderFramebufferToCanvas(cpu, ctx2d, imgData);
      bootFrame++;
      if (bootFrame >= BOOT_TOTAL_FRAMES) {
        launchShell();
      } else {
        requestAnimationFrame(mainLoop);
        return;
      }
    }

    const frameSteps = cpu.runGovernedSlice(sliceStart, 8.0, true);
    const sliceDt = performance.now() - sliceStart;
    if (cpu.clockRate === 0 && sliceDt >= 0.5 && frameSteps > 1000) {
      rollingSteps += frameSteps;
      rollingMs += sliceDt;
      if (rollingMs >= 50.0) {
        cpu.runMips = (rollingSteps / 1e6) / (rollingMs / 1000);
        updateMipsBadge();
        rollingSteps = 0;
        rollingMs = 0;
      }
    }

    if (cpu.halted) {
      launchShell();
    }

    cpu.presentFallbackIfStale(performance.now());
    sound.syncFromRAM();
    renderFramebufferToCanvas(cpu, ctx2d, imgData);
    requestAnimationFrame(mainLoop);
  }

  requestAnimationFrame(mainLoop);
})();
</script>
</body>
