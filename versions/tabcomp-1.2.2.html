<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; worker-src blob:">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TabComp™ 1.2.2 — The Computer That Fits In Your Tab!</title>
<style id="tc-style">
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0d14;
    color: #e4e8f0;
    font-family: "Courier New", Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 12px;
    user-select: none;
  }
  .tc-chassis {
    background: #1a1e29;
    border: 3px solid #3c465c;
    border-radius: 10px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.12);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 100%;
  }
  .tc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 2px solid #2b3244;
    padding-bottom: 8px;
    flex-wrap: wrap;
  }
  .tc-brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .tc-logo {
    font-size: 18px;
    font-weight: 900;
    color: #00f0ff;
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(0,240,255,0.45);
  }
  .tc-sub {
    font-size: 11px;
    color: #9ba6bf;
  }
  .tc-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tc-badge {
    background: #0d1018;
    border: 1px solid #2f384d;
    color: #48ff7a;
    padding: 4px 8px;
    font-size: 12px;
    font-weight: bold;
    border-radius: 4px;
  }
  .tc-btn {
    background: #263044;
    border: 1px solid #4d5d80;
    color: #ffffff;
    font-family: inherit;
    font-size: 12px;
    font-weight: bold;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  .tc-btn:hover { background: #33415c; border-color: #00f0ff; }
  .tc-btn:active { transform: translateY(1px); }
  .tc-bezel {
    background: #050608;
    border: 4px solid #0f131c;
    border-radius: 6px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #tc-screen {
    width: 640px;
    height: 400px;
    max-width: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000000;
    display: block;
    outline: none;
  }
  .tc-footer {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #7d89a3;
  }
  .tc-turbo {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(#d8cfba, #b8af96);
    border: 1px solid #7c745e;
    border-bottom-width: 3px;
    color: #231f1a;
    font-weight: 900;
    letter-spacing: 0.5px;
  }
  .tc-turbo:hover { background: linear-gradient(#e4dcc7, #c4bb9f); border-color: #ffe63c; }
  .tc-led {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2b3024;
    border: 1px solid #161912;
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.6);
    display: inline-block;
  }
  .tc-led.tc-led-on {
    background: #38ff64;
    border-color: #1a8c35;
    box-shadow: 0 0 6px #38ff64, inset 0 1px 1px #b8ffc8;
  }
  /* TabPad(TM) Game Controller for Cartridges & Arcade Apps */
  .tp-pad {
    display: none;
    flex-direction: column;
    gap: 6px;
    padding: 8px 10px;
    margin-top: 2px;
    background: linear-gradient(#cfc6ab, #b9b095);
    border: 2px solid #8f8670;
    border-radius: 8px;
    box-shadow: inset 0 1px 0 #efe7cf, 0 4px 10px rgba(0,0,0,0.6);
    touch-action: manipulation;
  }
  .tp-pad.tp-on { display: flex; }
  .tp-label {
    font: 700 10px "Courier New", monospace;
    color: #5c5444;
    letter-spacing: 1px;
    display: flex;
    justify-content: space-between;
    padding: 0 2px;
  }
  .tp-body {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .tp-dpad {
    display: grid;
    grid-template-columns: repeat(3, 40px);
    grid-template-rows: repeat(3, 34px);
    gap: 3px;
  }
  .tp-center {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .tp-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .tp-btn {
    border-radius: 5px;
    background: linear-gradient(#f4eedb, #ddd4b8);
    border: 1px solid #8b8269;
    border-bottom-width: 4px;
    color: #2a2620;
    font: 700 13px "Courier New", Courier, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 40px;
    height: 36px;
    padding: 0 10px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    cursor: pointer;
  }
  .tp-btn.tp-meta {
    background: linear-gradient(#bdb6a0, #a39b82);
    color: #1d1a15;
    font-size: 11px;
    height: 32px;
  }
  .tp-btn.tp-act {
    background: linear-gradient(#e86850, #c4432b);
    border-color: #7a2617;
    color: #fff8ee;
    min-width: 58px;
    height: 42px;
  }
  .tp-btn.tp-down {
    border-bottom-width: 1px;
    transform: translateY(3px);
    filter: brightness(0.92);
  }
  /*@@TABKEY_STYLE_BEGIN*/
  /* TabKey(TM) 101 on-screen keyboard (1.0.2, Kehai Interim; carried into 1.1.1) */
  .tk-board { display:none; flex-direction:column; gap:4px; padding:8px 6px 6px; margin-top:2px;
    background:linear-gradient(#cfc6ab,#b9b095); border:2px solid #8f8670; border-radius:8px;
    box-shadow: inset 0 1px 0 #efe7cf, 0 4px 10px rgba(0,0,0,0.6); touch-action:manipulation; }
  .tk-board.tk-on { display:flex; }
  .tk-row { display:flex; gap:4px; }
  .tk-key { flex:1 1 0; min-width:0; height:clamp(30px,7.5vw,44px); border-radius:5px;
    background:linear-gradient(#f4eedb,#ddd4b8); border:1px solid #8b8269; border-bottom-width:4px;
    color:#2a2620; font:700 clamp(11px,3.2vw,15px) "Courier New",Courier,monospace;
    display:flex; align-items:center; justify-content:center; padding:0;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation; cursor:pointer; }
  .tk-key.tk-mod { background:linear-gradient(#bdb6a0,#a39b82); color:#1d1a15; font-size:clamp(9px,2.6vw,13px); }
  .tk-key.tk-down { border-bottom-width:1px; transform:translateY(3px); background:#c9c0a4; }
  .tk-key.tk-lit { background:linear-gradient(#ffe68a,#f0c84a); }
  .tk-key.tk-lock { background:linear-gradient(#ffb070,#f08a3a); }
  .tk-label { font:700 10px "Courier New",monospace; color:#5c5444; letter-spacing:1px; display:flex; justify-content:space-between; padding:0 2px; }

</style>
</head>
<body>
<div class="tc-chassis">
  <div class="tc-header">
    <div class="tc-brand">
      <span class="tc-logo">TabComp™ 1.2.2</span>
      <span class="tc-sub">ConsciousNode SoftWorks • 1,048,576 BYTES FREE</span>
    </div>
    <div class="tc-controls">
      <span id="tc-mips-badge" class="tc-badge">CLOCK: MAX | --.- MIPS (JIT)</span>
      <button id="tc-btn-turbo" class="tc-btn tc-turbo" type="button" title="Toggle Turbo Clock (MAX / 25 MIPS)"><span id="tc-turbo-led" class="tc-led tc-led-on"></span>TURBO</button>
      <button id="tc-btn-save" class="tc-btn" type="button" title="Save self-replicating HTML with embedded disk">💾 Save HTML</button>
      <button id="tc-btn-fs" class="tc-btn" type="button" title="Fullscreen Mode">⛶ Fullscreen</button>
    </div>
  </div>
  <div class="tc-bezel">
    <canvas id="tc-screen" width="320" height="200" tabindex="0"></canvas>
  </div>
  <div class="tc-footer">
    <span id="tc-status">Click screen to focus • Ctrl+C / Esc breaks to Shell</span>
    <span>XINU Architecture: Single-File Self-Hosting 32-Bit Personal Computer</span>
  </div>
</div>

    { name: "TIMER_MS",   start: 0x0FFD00, size: 4     }, // 0x0FFD00..0x0FFD03
    { name: "VSYNC_CNT",  start: 0x0FFD04, size: 4     }, // 0x0FFD04..0x0FFD07
    { name: "SOUND_REGS", start: 0x0FFD20, size: 32    }  // 0x0FFD20..0x0FFD3F
  ];

  function verifyHardwareRegions(regions) {
    for (let i = 0; i < regions.length; i++) {
      const r = regions[i];
      const end = r.start + r.size;
      if (r.start < 0 || r.size <= 0 || end > 0x100000) {
        return { ok: false, msg: r.name + " out of 1 MiB bounds (0x" + r.start.toString(16) + "..0x" + (end - 1).toString(16) + ")" };
      }
      for (let j = i + 1; j < regions.length; j++) {
        const b = regions[j];
        const bEnd = b.start + b.size;
        if (!(end <= b.start || bEnd <= r.start)) {
          return { ok: false, msg: r.name + " overlaps " + b.name };
        }
      }
    }
    return { ok: true, msg: "6 regions verified in 0x000000..0x0FFFFF" };
  }

  function initHardwareMemory(cpu) {
    // 1. Startup hardware region bounds & overlap assertion
    const check = verifyHardwareRegions(HARDWARE_REGIONS);
    cpu.hwAssertOk = check.ok;
    cpu.hwAssertMsg = check.msg;

    // 2. Load 8x8 font at 0x0EF000..0x0EF2FF
    for (let i = 0; i < 768; i++) {
      cpu.ram[0x0EF000 + i] = parseInt(FONT_8X8_HEX.substr(i * 2, 2), 16);
    }
    // 3. Load 256-colour VGA Mode 13h style palette at 0x0FFA00..0x0FFCFF
    const ega16 = [
      [0,0,0],       [0,18,110],    [0,150,40],    [0,160,160],
      [170,20,20],   [150,0,150],   [170,95,0],    [180,185,195],
      [85,90,105],   [65,125,255],  [72,255,122],  [0,240,255],
      [255,80,80],   [255,85,255],  [255,230,60],  [255,255,255]
    ];
    for (let i = 0; i < 16; i++) {
      cpu.ram[0x0FFA00 + i * 3 + 0] = ega16[i][0];
      cpu.ram[0x0FFA00 + i * 3 + 1] = ega16[i][1];
      cpu.ram[0x0FFA00 + i * 3 + 2] = ega16[i][2];
    }
    for (let i = 16; i < 256; i++) {
      cpu.ram[0x0FFA00 + i * 3 + 0] = (i * 37) & 255;
      cpu.ram[0x0FFA00 + i * 3 + 1] = (i * 73) & 255;
      cpu.ram[0x0FFA00 + i * 3 + 2] = (i * 139) & 255;
    }
  }

  // 4-Channel Web Audio Synthesizer
  class TabCompSound {
    constructor(cpu) {
      this.cpu = cpu;
      this.ctx = null;
      this.channels = [];
    }
    unlock() {
      if (this.ctx) {
        if (this.ctx.state === "suspended") this.ctx.resume();
        return;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      const types = ["square", "triangle", "sawtooth", "square"];
      for (let i = 0; i < 4; i++) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = types[i];
        osc.frequency.value = 0;
        gain.gain.value = 0;
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        this.channels.push({ osc, gain });
      }
    }
    syncFromRAM() {
      if (!this.ctx) return;
      const ram = this.cpu.ram;
      for (let i = 0; i < 4; i++) {
        const base = 0x0FFD20 + i * 8;
        const freq = ram[base] | (ram[base + 1] << 8);
        const vol = ram[base + 2];
        const ch = this.channels[i];
        if (freq > 20 && vol > 0) {
          const f = i === 3 ? (freq * ((Math.random() * 0.5) + 0.75)) : freq;
          ch.osc.frequency.setTargetAtTime(f, this.ctx.currentTime, 0.005);
          ch.gain.gain.setTargetAtTime((vol / 255) * 0.08, this.ctx.currentTime, 0.005);
        } else {
          ch.gain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.005);
        }
      }
    }
  }

  // Display Renderer: draws ONLY the tear-free present buffer (cpu.presentBuf), NEVER live VRAM!
  function renderFramebufferToCanvas(cpu, ctx2d, imgData) {
    const ram = cpu.ram;
    const pbuf = cpu.presentBuf;
    const data32 = new Uint32Array(imgData.data.buffer);
    const palBase = 0x0FFA00;
    const pal32 = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      const r = ram[palBase + i * 3];
      const g = ram[palBase + i * 3 + 1];
      const b = ram[palBase + i * 3 + 2];
      pal32[i] = (255 << 24) | (b << 16) | (g << 8) | r;
    }
    for (let i = 0; i < 64000; i++) {
      data32[i] = pal32[pbuf[i]];
    }
    ctx2d.putImageData(imgData, 0, 0);
  }

  class TabCompFS {
    constructor() {
      this.files = new Map();
      this.dirs = new Set(['/', '/src', '/bin', '/home']);
      this.fds = new Map();
      this.nextFd = 3;
    }

    normPath(p, cwd = '/home') {
      if (!p) return cwd;
      p = p.replace(/\\/g, '/').trim();
      if (!p.startsWith('/')) {
        p = (cwd === '/' ? '/' : cwd + '/') + p;
      }
      const parts = p.split('/');
      const out = [];
      for (const part of parts) {
        if (!part || part === '.') continue;
        if (part === '..') { out.pop(); continue; }
        out.push(part.slice(0, 31));
      }
      return '/' + out.join('/');
    }

    writeFile(path, content) {
      const p = this.normPath(path, '/');
      const lastSlash = p.lastIndexOf('/');
      if (lastSlash > 0) {
        const dir = p.slice(0, lastSlash);
        this.mkdir(dir);
      }
      if (typeof content === 'string') {
        this.files.set(p, new TextEncoder().encode(content));
      } else if (content instanceof Uint8Array) {
        this.files.set(p, new Uint8Array(content));
      } else {
        this.files.set(p, new Uint8Array(content));
      }
    }

    readFile(path) {
      const p = this.normPath(path, '/');
      return this.files.get(p) || null;
    }

    readText(path) {
      const d = this.readFile(path);
      return d ? new TextDecoder().decode(d) : null;
    }

    mkdir(path) {
      const p = this.normPath(path, '/');
      const parts = p.split('/').filter(Boolean);
      let cur = '';
      this.dirs.add('/');
      for (const part of parts) {
        cur += '/' + part;
        this.dirs.add(cur);
      }
      return 0;
    }

    unlink(path) {
      const p = this.normPath(path, '/');
      if (this.files.has(p)) {
        this.files.delete(p);
        return 0;
      }
      if (this.dirs.has(p) && p !== '/') {
        this.dirs.delete(p);
        return 0;
      }
      return -1;
    }

    stat(path) {
      const p = this.normPath(path, '/');
      if (this.dirs.has(p)) return { exists: 1, isDir: 1, size: 0 };
      if (this.files.has(p)) return { exists: 1, isDir: 0, size: this.files.get(p).length };
      return null;
    }

    list(dirPath) {
      const p = this.normPath(dirPath, '/');
      if (!this.dirs.has(p)) return null;
      const prefix = p === '/' ? '/' : p + '/';
      const entries = [];
      for (const d of this.dirs) {
        if (d !== p && d.startsWith(prefix)) {
          const rest = d.slice(prefix.length);
          if (!rest.includes('/')) {
            entries.push({ name: rest, isDir: 1, size: 0 });
          }
        }
      }
      for (const [f, data] of this.files.entries()) {
        if (f.startsWith(prefix)) {
          const rest = f.slice(prefix.length);
          if (!rest.includes('/')) {
            entries.push({ name: rest, isDir: 0, size: data.length });
          }
        }
      }
      entries.sort((a, b) => (b.isDir - a.isDir) || a.name.localeCompare(b.name));
      return entries;
    }
  }

  // Zero-dependency WebAssembly Basic-Block / Superblock JIT Compiler
  // Shares linear memory directly with TabCompCPU (0x000000..0x0FFFFF = RAM, 0x100000..0x10003F = R0..R15, 0x100040 = pc, 0x100044 = flags, 0x100048 = codeDirty)
  function encodeULEB128(val, out) {
    let v = val >>> 0;
    do {
      let b = v & 0x7F;
      v >>>= 7;
      if (v !== 0) b |= 0x80;
      out.push(b);
    } while (v !== 0);
  }

  function encodeSLEB128(val, out) {
    let v = val | 0;
    let more = true;
    while (more) {
      let b = v & 0x7F;
      v >>= 7;
      if ((v === 0 && (b & 0x40) === 0) || (v === -1 && (b & 0x40) !== 0)) {
        more = false;
      } else {
        b |= 0x80;
      }
      out.push(b);
    }
  }

  function emitSection(id, payload, out) {
    out.push(id);
    encodeULEB128(payload.length, out);
    for (let i = 0; i < payload.length; i++) out.push(payload[i]);
  }

  const L_FLAGS = 16;
  const L_EXIT_PC = 17;
  const L_STEPS = 18;
  const L_ITERS = 19;
  const L_A = 20;
  const L_B = 21;
  const L_DIRTY = 22;

  class TabCompWasmJIT {
    constructor(cpu) {
      this.cpu = cpu;
      this.wasmMem = cpu.wasmMem;
      this.hotCounts = new Uint16Array(65536);
      this.blockTable = new Array(65536);
      this.wasmCache = new Map();
      this.compiledCount = 0;
    }

    invalidateAll() {
      this.hotCounts.fill(0);
      this.blockTable.fill(undefined);
      this.compiledCount = 0;
    }

    compileBasicBlock(startPc) {
      if (!this.wasmMem) return null;
      const dv = this.cpu.ramDV;

      let readRegs = 0;
      let writtenRegs = 0;
      let hasSelfLoop = false;
      let hasStore = false;

      const trace = [];
      let pc = startPc;
      let count = 0;
      let ended = false;
      let terminated = false;
      let sigA = 2166136261;
      let sigB = startPc;

      function markRead(r) { readRegs |= (1 << r); }
      function markWrite(r) { writtenRegs |= (1 << r); }
      function pushConst(v, out) { out.push(0x41); encodeSLEB128(v | 0, out); }
      function getReg(r, out) { markRead(r); out.push(0x20, r); }
      function setReg(r, out) { markWrite(r); out.push(0x21, r); }
      function teeReg(r, out) { markWrite(r); out.push(0x22, r); }
      function emitExit(targetPc, stepCount, brDepth, out) {
        pushConst(targetPc, out);
        out.push(0x21, L_EXIT_PC);
        out.push(0x20, L_STEPS);
        pushConst(stepCount, out);
        out.push(0x6A, 0x21, L_STEPS);
        out.push(0x0C, brDepth);
      }
      function pushBranchCond(op, out) {
        markRead(L_FLAGS);
        out.push(0x20, L_FLAGS);
        switch (op) {
          case 0x27: pushConst(1, out); out.push(0x71); break;
          case 0x28: pushConst(1, out); out.push(0x71, 0x45); break;
          case 0x29: pushConst(2, out); out.push(0x71); break;
          case 0x2A: pushConst(2, out); out.push(0x71, 0x45); break;
          case 0x2B: pushConst(3, out); out.push(0x71); break;
          case 0x2C: pushConst(3, out); out.push(0x71, 0x45); break;
          case 0x30: pushConst(4, out); out.push(0x71); break;
          case 0x31: pushConst(4, out); out.push(0x71, 0x45); break;
          case 0x32: pushConst(5, out); out.push(0x71); break;
          case 0x33: pushConst(5, out); out.push(0x71, 0x45); break;
        }
      }

      while (count < 64 && !ended) {
        const inst = dv.getUint32(pc, true);
        sigA = Math.imul(sigA ^ inst, 16777619);
        sigB = Math.imul(sigB ^ (inst >>> 11), 16777619);
        const nextPc = (pc + 4) | 0;
        const op = (inst >>> 24) & 0x3F;
        const rd = (inst >>> 20) & 0x0F;
        const ra = (inst >>> 16) & 0x0F;
        const rb = (inst >>> 12) & 0x0F;
        const imm16 = (inst << 16) >> 16;
        const uimm16 = inst & 0xFFFF;

        switch (op) {
          case 0x00:
            break;
          case 0x01:
            if (rd !== ra) { getReg(ra, trace); setReg(rd, trace); }
            break;
          case 0x02:
            pushConst(imm16, trace); setReg(rd, trace);
            break;
          case 0x03:
            pushConst(uimm16, trace); setReg(rd, trace);
            break;
          case 0x04:
            getReg(rd, trace);
            pushConst(0xFFFF, trace); trace.push(0x71);
            pushConst(uimm16 << 16, trace); trace.push(0x72);
            setReg(rd, trace);
            break;
          case 0x05:
          case 0x06:
          case 0x07:
          case 0x0C:
          case 0x0D:
          case 0x0E:
          case 0x0F:
          case 0x10:
          case 0x11: {
            getReg(ra, trace);
            getReg(rb, trace);
            if (op === 0x0F || op === 0x10 || op === 0x11) {
              pushConst(31, trace); trace.push(0x71);
            }
            const wasmOp = {
              0x05: 0x6A, 0x06: 0x6B, 0x07: 0x6C,
              0x0C: 0x71, 0x0D: 0x72, 0x0E: 0x73,
              0x0F: 0x74, 0x10: 0x76, 0x11: 0x75
            }[op];
            trace.push(wasmOp);
            setReg(rd, trace);
            break;
          }
          case 0x12:
          case 0x13:
            getReg(ra, trace);
            pushConst(imm16, trace);
            trace.push(op === 0x12 ? 0x6A : 0x6B);
            setReg(rd, trace);
            break;
          case 0x14:
          case 0x15:
          case 0x16:
            getReg(ra, trace);
            pushConst(uimm16, trace);
            trace.push(op === 0x14 ? 0x71 : (op === 0x15 ? 0x72 : 0x73));
            setReg(rd, trace);
            break;
          case 0x17:
          case 0x18:
          case 0x19:
            getReg(ra, trace);
            pushConst(uimm16 & 31, trace);
            trace.push(op === 0x17 ? 0x74 : (op === 0x18 ? 0x76 : 0x75));
            setReg(rd, trace);
            break;
          case 0x1A:
            getReg(ra, trace); trace.push(0x21, L_A);
            getReg(rb, trace); trace.push(0x21, L_B);
            trace.push(0x20, L_A, 0x20, L_B, 0x46);
            trace.push(0x20, L_A, 0x20, L_B, 0x48);
            pushConst(1, trace); trace.push(0x74, 0x72);
            trace.push(0x20, L_A, 0x20, L_B, 0x49);
            pushConst(2, trace); trace.push(0x74, 0x72);
            setReg(L_FLAGS, trace);
            break;
          case 0x1B:
            getReg(ra, trace); trace.push(0x21, L_A);
            pushConst(imm16, trace); trace.push(0x21, L_B);
            trace.push(0x20, L_A, 0x20, L_B, 0x46);
            trace.push(0x20, L_A, 0x20, L_B, 0x48);
            pushConst(1, trace); trace.push(0x74, 0x72);
            trace.push(0x20, L_A, 0x20, L_B, 0x49);
            pushConst(2, trace); trace.push(0x74, 0x72);
            setReg(L_FLAGS, trace);
            break;
          case 0x1C:
          case 0x1D:
          case 0x1E:
          case 0x1F:
          case 0x20:
            getReg(ra, trace);
            if (imm16 !== 0) { pushConst(imm16, trace); trace.push(0x6A); }
            pushConst(0xFFFFF, trace); trace.push(0x71);
            if (op === 0x1C) trace.push(0x2D, 0x00, 0x00);
            else if (op === 0x1D) trace.push(0x2C, 0x00, 0x00);
            else if (op === 0x1E) trace.push(0x2F, 0x00, 0x00);
            else if (op === 0x1F) trace.push(0x2E, 0x00, 0x00);
            else trace.push(0x28, 0x00, 0x00);
            setReg(rd, trace);
            break;
          case 0x21:
          case 0x22:
          case 0x23:
            getReg(ra, trace);
            if (imm16 !== 0) { pushConst(imm16, trace); trace.push(0x6A); }
            pushConst(0xFFFFF, trace); trace.push(0x71);
            if (ra !== 13 && ra !== 14) {
              trace.push(0x22, L_A);
            }
            getReg(rd, trace);
            if (op === 0x21) trace.push(0x3A, 0x00, 0x00);
            else if (op === 0x22) trace.push(0x3B, 0x00, 0x00);
            else trace.push(0x36, 0x00, 0x00);
            if (ra !== 13 && ra !== 14) {
              hasStore = true;
              trace.push(0x20, L_A);
              pushConst(0x050000, trace);
              trace.push(0x49, 0x20, L_DIRTY, 0x72, 0x21, L_DIRTY);
            }
            break;
          case 0x24:
            getReg(14, trace);
            pushConst(4, trace);
            trace.push(0x6B);
            teeReg(14, trace);
            pushConst(0xFFFFF, trace);
            trace.push(0x71);
            getReg(rd, trace);
            trace.push(0x36, 0x00, 0x00);
            break;
          case 0x25:
            getReg(14, trace);
            trace.push(0x22, L_A);
            pushConst(0xFFFFF, trace);
            trace.push(0x71);
            trace.push(0x28, 0x00, 0x00);
            trace.push(0x21, L_B);
            trace.push(0x20, L_A);
            pushConst(4, trace);
            trace.push(0x6A);
            setReg(14, trace);
            trace.push(0x20, L_B);
            setReg(rd, trace);
            break;
          case 0x36:
            markRead(L_FLAGS);
            trace.push(0x20, L_FLAGS);
            switch (uimm16) {
              case 0: pushConst(1, trace); trace.push(0x71, 0x45, 0x45); break;
              case 1: pushConst(1, trace); trace.push(0x71, 0x45); break;
              case 2: pushConst(2, trace); trace.push(0x71, 0x45, 0x45); break;
              case 3: pushConst(2, trace); trace.push(0x71, 0x45); break;
              case 4: pushConst(3, trace); trace.push(0x71, 0x45, 0x45); break;
              case 5: pushConst(3, trace); trace.push(0x71, 0x45); break;
              case 6: pushConst(4, trace); trace.push(0x71, 0x45, 0x45); break;
              case 7: pushConst(4, trace); trace.push(0x71, 0x45); break;
              case 8: pushConst(5, trace); trace.push(0x71, 0x45, 0x45); break;
              case 9: pushConst(5, trace); trace.push(0x71, 0x45); break;
              default: trace.push(0x1A); pushConst(0, trace); break;
            }
            setReg(rd, trace);
            break;
          case 0x27:
          case 0x28:
          case 0x29:
          case 0x2A:
          case 0x2B:
          case 0x2C:
          case 0x30:
          case 0x31:
          case 0x32:
          case 0x33: {
            const target = inst & 0x00FFFFFF;
            count++;
            pushBranchCond(op, trace);
            trace.push(0x04, 0x40);
            if (target === startPc) {
              hasSelfLoop = true;
              trace.push(0x20, L_STEPS); pushConst(count, trace); trace.push(0x6A, 0x21, L_STEPS);
              trace.push(0x20, L_ITERS); pushConst(1, trace); trace.push(0x6B, 0x22, L_ITERS);
              trace.push(0x0D, 1);
            }
            emitExit(target, count, 2, trace);
            trace.push(0x0B);
            pc = nextPc;
            continue;
          }
          case 0x26: {
            const target = inst & 0x00FFFFFF;
            count++;
            if (target === startPc) {
              hasSelfLoop = true;
              trace.push(0x20, L_STEPS); pushConst(count, trace); trace.push(0x6A, 0x21, L_STEPS);
              trace.push(0x20, L_ITERS); pushConst(1, trace); trace.push(0x6B, 0x22, L_ITERS);
              trace.push(0x0D, 0);
            } else if (target > pc && count < 56) {
              pc = target;
              continue;
            }
            emitExit(target, count, 1, trace);
            ended = true;
            terminated = true;
            continue;
          }
          case 0x2D: {
            const target = inst & 0x00FFFFFF;
            count++;
            pushConst(nextPc, trace);
            setReg(15, trace);
            emitExit(target, count, 1, trace);
            ended = true;
            terminated = true;
            continue;
          }
          case 0x2E:
            count++;
            getReg(15, trace);
            trace.push(0x21, L_EXIT_PC);
            trace.push(0x20, L_STEPS);
            pushConst(count, trace);
            trace.push(0x6A, 0x21, L_STEPS);
            trace.push(0x0C, 1);
            ended = true;
            terminated = true;
            continue;
          case 0x34:
            count++;
            getReg(rd, trace);
            trace.push(0x21, L_EXIT_PC);
            pushConst(nextPc, trace);
            setReg(15, trace);
            trace.push(0x20, L_STEPS);
            pushConst(count, trace);
            trace.push(0x6A, 0x21, L_STEPS);
            trace.push(0x0C, 1);
            ended = true;
            terminated = true;
            continue;
          case 0x35:
            count++;
            getReg(rd, trace);
            trace.push(0x21, L_EXIT_PC);
            trace.push(0x20, L_STEPS);
            pushConst(count, trace);
            trace.push(0x6A, 0x21, L_STEPS);
            trace.push(0x0C, 1);
            ended = true;
            terminated = true;
            continue;
          default:
            ended = true;
            continue;
        }
        pc = nextPc;
        count++;
      }

      if (count === 0) return null;

      const cacheKey = startPc + ":" + sigA + ":" + sigB + ":" + count;
      let cached = this.wasmCache.get(cacheKey);
      if (cached) {
        this.blockTable[(startPc >>> 2) & 0xFFFF] = cached;
        this.compiledCount++;
        return cached;
      }

      if (!terminated) {
        emitExit(pc, count, 1, trace);
      }

      const loadMask = readRegs | writtenRegs;
      const body = [];
      body.push(1, 23, 0x7F);

      for (let r = 0; r < 16; r++) {
        if (loadMask & (1 << r)) {
          pushConst(0x100000 + (r << 2), body);
          body.push(0x28, 0x02, 0x00, 0x21, r);
        }
      }
      if (loadMask & (1 << L_FLAGS)) {
        pushConst(0x100044, body);
        body.push(0x28, 0x02, 0x00, 0x21, L_FLAGS);
      }
      if (hasSelfLoop) {
        pushConst(512, body);
        body.push(0x21, L_ITERS);
      }

      body.push(0x02, 0x40, 0x03, 0x40);
      for (let i = 0; i < trace.length; i++) body.push(trace[i]);
      body.push(0x0B, 0x0B);

      for (let r = 0; r < 16; r++) {
        if (writtenRegs & (1 << r)) {
          pushConst(0x100000 + (r << 2), body);
          body.push(0x20, r, 0x36, 0x02, 0x00);
        }
      }
      if (writtenRegs & (1 << L_FLAGS)) {
        pushConst(0x100044, body);
        body.push(0x20, L_FLAGS, 0x36, 0x02, 0x00);
      }
      if (hasStore) {
        pushConst(0x100048, body);
        body.push(0x20, L_DIRTY, 0x36, 0x02, 0x00);
      }
      pushConst(0x100040, body);
      body.push(0x20, L_EXIT_PC, 0x36, 0x02, 0x00);
      body.push(0x20, L_STEPS, 0x0B);

      const wasm = [0x00, 0x61, 0x73, 0x6D, 0x01, 0x00, 0x00, 0x00];
      emitSection(1, [1, 0x60, 0, 1, 0x7F], wasm);
      emitSection(2, [1, 1, 101, 1, 109, 0x02, 0x00, 17], wasm);
      emitSection(3, [1, 0], wasm);
      emitSection(7, [1, 1, 114, 0x00, 0], wasm);
      const codeSec = [1];
      encodeULEB128(body.length, codeSec);
      for (let i = 0; i < body.length; i++) codeSec.push(body[i]);
      emitSection(10, codeSec, wasm);

      const mod = new WebAssembly.Module(new Uint8Array(wasm));
      const inst = new WebAssembly.Instance(mod, { e: { m: this.wasmMem } });
      const block = { fn: inst.exports.r, startPc: startPc };
      this.wasmCache.set(cacheKey, block);
      this.blockTable[(startPc >>> 2) & 0xFFFF] = block;
      this.compiledCount++;
      return block;
    }
  }

  class TabCompCPU {
    constructor(fsController) {
      this.wasmMem = (typeof WebAssembly !== "undefined" && WebAssembly.Memory)
        ? new WebAssembly.Memory({ initial: 17 })
        : null;
      const memBuf = this.wasmMem ? this.wasmMem.buffer : new ArrayBuffer(1114112);
      this.ram = new Uint8Array(memBuf, 0, 1048576);
      this.ramDV = new DataView(memBuf, 0, 1048576);
      this.ram32 = new Int32Array(memBuf, 0, 262144);
      this.reg = new Int32Array(memBuf, 0x100000, 16);
      this.state32 = new Int32Array(memBuf, 0x100040, 4);
      this.presentBuf = new Uint8Array(64000);
      this.frameReady = false;
      this.presentCount = 0;
      this.lastYieldTime = (typeof performance !== "undefined" ? performance.now() : Date.now());
      this.pc = 0;
      this.flags = 0;
      this.halted = false;
      this.yielded = false;
      this.exitCode = 0;
      this.fs = fsController;
      this.cwd = '/home';
      this.bootTime = Date.now();
      this.bootPerf = (typeof performance !== "undefined" ? performance.now() : Date.now());
      this.vsyncCount = 0;
      this.keyQueue = [];
      this.procStack = [];
      this.lastMips = 35.0;
      this.peakMips = 200.0;
      this.runMips = 200.0;
      this.jitEnabled = this.wasmMem ? 1 : 0;
      this.jitInstCount = 0;
      this.interpInstCount = 0;
      this.clockRate = 0;      // 0 = MAX (turbo on), 1..1000 = fixed rate in MIPS (turbo off)
      this.compatRate = 25;    // default compatibility rate when turbo is toggled off
      this.clockBudget = 0.0;  // signed instruction budget (carries overshoot & debt)
      this.clockLastTime = this.bootPerf;
      this.clockBehindMs = 0.0;
      this.deviceLagMips = 0;
      this.hwAssertOk = true;
      this.hwAssertMsg = "";
      this.hooks = {};
      this.jit = this.wasmMem ? new TabCompWasmJIT(this) : null;
    }

    setClock(rate, now) {
      const t = (now !== undefined) ? now : (typeof performance !== "undefined" ? performance.now() : Date.now());
      if (rate <= 0) {
        this.clockRate = 0;
      } else {
        const r = Math.max(1, Math.min(1000, rate | 0));
        this.clockRate = r;
        this.compatRate = r;
      }
      this.clockBudget = 0.0;
      this.clockLastTime = t;
      this.clockBehindMs = 0.0;
      this.deviceLagMips = 0;
      if (this.hooks.onClockChange) this.hooks.onClockChange(this.clockRate);
      return this.clockRate;
    }

    advanceClock(now) {
      if (this.clockRate <= 0) {
        this.clockLastTime = now;
        this.clockBudget = 0.0;
        return;
      }
      const dt = Math.max(0, now - this.clockLastTime);
      this.clockLastTime = now;
      this.clockBudget += dt * this.clockRate * 1000.0;
      const maxDebt = this.clockRate * 100.0 * 1000.0; // cap debt at 100 ms of instructions
      if (this.clockBudget > maxDebt) {
        this.clockBudget = maxDebt;
      }
    }

    runGovernedSlice(now, maxSliceMs = 8.0, stopOnYield = true) {
      const tStart = (typeof performance !== "undefined") ? performance.now() : Date.now();
      const clockNow = (now !== undefined) ? now : tStart;
      if (this.clockRate <= 0) {
        this.clockLastTime = clockNow;
        this.clockBudget = 0.0;
        this.clockBehindMs = 0.0;
        this.deviceLagMips = 0;
        let steps = 0;
        while (!this.halted && (((typeof performance !== "undefined" ? performance.now() : Date.now()) - tStart) < maxSliceMs)) {
          this.yielded = false;
          steps += this.stepBatch(20000);
          if (stopOnYield && this.yielded && this.keyQueue.length === 0) break;
        }
        return steps;
      }

      const prevTime = this.clockLastTime;
      const wallDt = Math.max(0, clockNow - prevTime);
      this.advanceClock(clockNow);
      let steps = 0;
      while (!this.halted && this.clockBudget >= 1.0 && (((typeof performance !== "undefined" ? performance.now() : Date.now()) - tStart) < maxSliceMs)) {
        this.yielded = false;
        const batch = Math.min(20000, Math.max(1, Math.floor(this.clockBudget)));
        const ran = this.stepBatch(batch);
        steps += ran;
        this.clockBudget -= ran;
        if (stopOnYield && this.yielded && this.keyQueue.length === 0) {
          const yCap = this.clockRate * 16000.0; if (this.clockBudget > yCap) this.clockBudget = yCap;
          break;
        }
      }

      const sliceElapsed = ((typeof performance !== "undefined" ? performance.now() : Date.now()) - tStart);
      if (!this.halted && !(stopOnYield && this.yielded) && sliceElapsed >= maxSliceMs * 0.9 && this.clockBudget > this.clockRate * 16000) {
        this.clockBehindMs += Math.max(wallDt, sliceElapsed);
        if (this.clockBehindMs >= 1000 && sliceElapsed > 0.5) {
          const achieved = Math.max(1, Math.round((steps / 1e6) / (Math.max(wallDt, sliceElapsed) / 1000)));
          if (achieved < this.clockRate) {
            const prevLag = this.deviceLagMips;
            this.deviceLagMips = achieved;
            if (prevLag !== achieved && this.hooks.onClockChange) this.hooks.onClockChange(this.clockRate);
          }
        }
      } else if (this.clockBudget <= this.clockRate * 4000) {
        if (this.clockBehindMs > 0 || this.deviceLagMips > 0) {
          this.clockBehindMs = 0.0;
          const hadLag = this.deviceLagMips > 0;
          this.deviceLagMips = 0;
          if (hadLag && this.hooks.onClockChange) this.hooks.onClockChange(this.clockRate);
        }
      }
      return steps;
    }

    presentNow() {
      this.instAtPresent = this.jitInstCount + this.interpInstCount;
      this.presentBuf.set(this.ram.subarray(0x0F0000, 0x0F0000 + 64000));
      this.frameReady = true;
      this.presentCount = (this.presentCount + 1) | 0;
      this.lastYieldTime = (typeof performance !== "undefined" ? performance.now() : Date.now());
    }

    presentFallbackIfStale(now) {
      // 1.2.2 (Kehai Interim): the fallback is for programs that never yield, so
      // it also waits for 4M instructions without a yield (twice TabBreakout's
      // biggest frame). At a slow clock (e.g. `clock 10`) a game frame can take
      // longer than 100 ms; without this, the fallback showed it half-drawn.
      if ((now - this.lastYieldTime) > 100 &&
          (this.jitInstCount + this.interpInstCount) - (this.instAtPresent || 0) >= 4000000) {
        this.presentNow();
      }
    }

    readStr(addr) {
      let s = '';
      while (addr >= 0 && addr < 1048576) {
        const b = this.ram[addr++];
        if (b === 0) break;
        s += String.fromCharCode(b);
      }
      return s;
    }

    writeStr(addr, str, maxLen = 256) {
      const n = Math.min(str.length, maxLen - 1);
      for (let i = 0; i < n; i++) {
        this.ram[addr + i] = str.charCodeAt(i) & 0xFF;
      }
      this.ram[addr + n] = 0;
      return n;
    }

    loadBinary(bytes, argStr = '') {
      if (this.jit) this.jit.invalidateAll();
      this.ram.fill(0, 0, 0x0E0000);
      this.ram.set(bytes, 0);
      this.writeStr(0x0DF000, argStr, 1024);
      this.reg.fill(0);
      this.reg[13] = 0x0DF000;
      this.reg[14] = 0x0DF000;
      this.ramDV.setUint32(0x0DF800, 0x2F000000, true);
      this.reg[15] = 0x0DF800;
      this.pc = 0;
      this.flags = 0;
      this.halted = false;
      this.yielded = false;
    }

    stepInterp(maxSteps) {
      const reg = this.reg;
      const ram = this.ram;
      const dv = this.ramDV;
      let pc = this.pc;
      let flags = this.flags;
      let steps = 0;

      while (steps < maxSteps && !this.halted) {
        const inst = dv.getUint32(pc, true);
        pc = (pc + 4) | 0;
        steps++;

        const op = (inst >>> 24) & 0x3F;
        const rd = (inst >>> 20) & 0x0F;
        const ra = (inst >>> 16) & 0x0F;
        const rb = (inst >>> 12) & 0x0F;
        const imm16 = (inst << 16) >> 16;
        const uimm16 = inst & 0xFFFF;

        switch (op) {
          case 0x00:
            break;
          case 0x01:
            reg[rd] = reg[ra];
            break;
          case 0x02:
            reg[rd] = imm16;
            break;
          case 0x03:
            reg[rd] = uimm16;
            break;
          case 0x04:
            reg[rd] = (reg[rd] & 0xFFFF) | (uimm16 << 16);
            break;
          case 0x05:
            reg[rd] = (reg[ra] + reg[rb]) | 0;
            break;
          case 0x06:
            reg[rd] = (reg[ra] - reg[rb]) | 0;
            break;
          case 0x07:
            reg[rd] = Math.imul(reg[ra], reg[rb]);
            break;
          case 0x08:
            reg[rd] = reg[rb] === 0 ? 0 : (reg[ra] / reg[rb]) | 0;
            break;
          case 0x09:
            reg[rd] = reg[rb] === 0 ? 0 : (reg[ra] % reg[rb]) | 0;
            break;
          case 0x0A:
            reg[rd] = reg[rb] === 0 ? 0 : ((reg[ra] >>> 0) / (reg[rb] >>> 0)) | 0;
            break;
          case 0x0B:
            reg[rd] = reg[rb] === 0 ? 0 : ((reg[ra] >>> 0) % (reg[rb] >>> 0)) | 0;
            break;
          case 0x0C:
            reg[rd] = reg[ra] & reg[rb];
            break;
          case 0x0D:
            reg[rd] = reg[ra] | reg[rb];
            break;
          case 0x0E:
            reg[rd] = reg[ra] ^ reg[rb];
            break;
          case 0x0F:
            reg[rd] = reg[ra] << (reg[rb] & 31);
            break;
          case 0x10:
            reg[rd] = reg[ra] >>> (reg[rb] & 31);
            break;
          case 0x11:
            reg[rd] = reg[ra] >> (reg[rb] & 31);
            break;
          case 0x12:
            reg[rd] = (reg[ra] + imm16) | 0;
            break;
          case 0x13:
            reg[rd] = (reg[ra] - imm16) | 0;
            break;
          case 0x14:
            reg[rd] = reg[ra] & uimm16;
            break;
          case 0x15:
            reg[rd] = reg[ra] | uimm16;
            break;
          case 0x16:
            reg[rd] = reg[ra] ^ uimm16;
            break;
          case 0x17:
            reg[rd] = reg[ra] << (uimm16 & 31);
            break;
          case 0x18:
            reg[rd] = reg[ra] >>> (uimm16 & 31);
            break;
          case 0x19:
            reg[rd] = reg[ra] >> (uimm16 & 31);
            break;
          case 0x1A: {
            const a = reg[ra], b = reg[rb];
            const ua = a >>> 0, ub = b >>> 0;
            let f = 0;
            if (a === b) f |= 1;
            if (a < b) f |= 2;
            if (ua < ub) f |= 4;
            flags = f;
            break;
          }
          case 0x1B: {
            const a = reg[ra], b = imm16;
            const ua = a >>> 0, ub = b >>> 0;
            let f = 0;
            if (a === b) f |= 1;
            if (a < b) f |= 2;
            if (ua < ub) f |= 4;
            flags = f;
            break;
          }
          case 0x1C:
            reg[rd] = ram[(reg[ra] + imm16) & 0xFFFFF];
            break;
          case 0x1D:
            reg[rd] = (ram[(reg[ra] + imm16) & 0xFFFFF] << 24) >> 24;
            break;
          case 0x1E:
            reg[rd] = dv.getUint16((reg[ra] + imm16) & 0xFFFFF, true);
            break;
          case 0x1F:
            reg[rd] = dv.getInt16((reg[ra] + imm16) & 0xFFFFF, true);
            break;
          case 0x20:
            reg[rd] = dv.getInt32((reg[ra] + imm16) & 0xFFFFF, true);
            break;
          case 0x21: {
            const addr = (reg[ra] + imm16) & 0xFFFFF;
            ram[addr] = reg[rd] & 0xFF;
            if (this.jitEnabled && addr < 0x050000 && this.jit) this.jit.invalidateAll();
            break;
          }
          case 0x22: {
            const addr = (reg[ra] + imm16) & 0xFFFFF;
            dv.setUint16(addr, reg[rd] & 0xFFFF, true);
            if (this.jitEnabled && addr < 0x050000 && this.jit) this.jit.invalidateAll();
            break;
          }
          case 0x23: {
            const addr = (reg[ra] + imm16) & 0xFFFFF;
            dv.setInt32(addr, reg[rd], true);
            if (this.jitEnabled && addr < 0x050000 && this.jit) this.jit.invalidateAll();
            break;
          }
          case 0x24:
            reg[14] = (reg[14] - 4) | 0;
            dv.setInt32(reg[14] & 0xFFFFF, reg[rd], true);
            break;
          case 0x25:
            reg[rd] = dv.getInt32(reg[14] & 0xFFFFF, true);
            reg[14] = (reg[14] + 4) | 0;
            break;
          case 0x26:
            pc = inst & 0x00FFFFFF;
            break;
          case 0x27:
            if (flags & 1) pc = inst & 0x00FFFFFF;
            break;
          case 0x28:
            if (!(flags & 1)) pc = inst & 0x00FFFFFF;
            break;
          case 0x29:
            if (flags & 2) pc = inst & 0x00FFFFFF;
            break;
          case 0x2A:
            if (!(flags & 2)) pc = inst & 0x00FFFFFF;
            break;
          case 0x2B:
            if (flags & 3) pc = inst & 0x00FFFFFF;
            break;
          case 0x2C:
            if (!(flags & 3)) pc = inst & 0x00FFFFFF;
            break;
          case 0x2D:
            reg[15] = pc;
            pc = inst & 0x00FFFFFF;
            break;
          case 0x2E:
            pc = reg[15];
            break;
          case 0x2F:
            this.pc = pc;
            this.flags = flags;
            this.handleSys(uimm16);
            pc = this.pc;
            flags = this.flags;
            if (this.halted || this.yielded) return steps;
            break;
          case 0x30:
            if (flags & 4) pc = inst & 0x00FFFFFF;
            break;
          case 0x31:
            if (!(flags & 4)) pc = inst & 0x00FFFFFF;
            break;
          case 0x32:
            if (flags & 5) pc = inst & 0x00FFFFFF;
            break;
          case 0x33:
            if (!(flags & 5)) pc = inst & 0x00FFFFFF;
            break;
          case 0x34:
            reg[15] = pc;
            pc = reg[rd];
            break;
          case 0x35:
            pc = reg[rd];
            break;
          case 0x36:
            switch (uimm16) {
              case 0: reg[rd] = (flags & 1) ? 1 : 0; break;
              case 1: reg[rd] = !(flags & 1) ? 1 : 0; break;
              case 2: reg[rd] = (flags & 2) ? 1 : 0; break;
              case 3: reg[rd] = !(flags & 2) ? 1 : 0; break;
              case 4: reg[rd] = (flags & 3) ? 1 : 0; break;
              case 5: reg[rd] = !(flags & 3) ? 1 : 0; break;
              case 6: reg[rd] = (flags & 4) ? 1 : 0; break;
              case 7: reg[rd] = !(flags & 4) ? 1 : 0; break;
              case 8: reg[rd] = (flags & 5) ? 1 : 0; break;
              case 9: reg[rd] = !(flags & 5) ? 1 : 0; break;
            }
            break;
          default:
            this.halted = true;
            break;
        }
      }

      this.pc = pc;
      this.flags = flags;
      return steps;
    }

    stepBatch(maxSteps) {
      if (!this.jitEnabled || !this.jit) {
        const n = this.stepInterp(maxSteps);
        this.interpInstCount += n;
        return n;
      }
      let steps = 0;
      const jit = this.jit;
      const hotCounts = jit.hotCounts;
      const blockTable = jit.blockTable;
      const state32 = this.state32;

      while (steps < maxSteps && !this.halted && !this.yielded) {
        const pc = this.pc;
        const idx = (pc >>> 2) & 0xFFFF;
        let blk = blockTable[idx];
        if (blk !== undefined && blk.startPc !== pc) {
          blk = undefined;
        }
        if (blk === undefined) {
          const c = (hotCounts[idx] + 1) & 0xFFFF;
          hotCounts[idx] = c;
          if (c >= 50) {
            blk = jit.compileBasicBlock(pc) || { fn: null, startPc: pc };
            blockTable[idx] = blk;
          }
        }
        if (blk && blk.fn) {
          state32[0] = pc;
          state32[1] = this.flags;
          state32[2] = 0;
          const ran = blk.fn();
          this.pc = state32[0];
          this.flags = state32[1];
          if (state32[2]) jit.invalidateAll();
          steps += ran;
          this.jitInstCount += ran;
        } else {
          const ran = this.stepInterp(1);
          steps += ran;
          this.interpInstCount += ran;
        }
      }
      return steps;
    }

    handleSys(num) {
      const r = this.reg;
      switch (num) {
        case 0: { // EXIT(code)
          const code = r[0];
          if (this.procStack.length > 0) {
            const saved = this.procStack.pop();
            if (this.jit) this.jit.invalidateAll();
            this.ram.set(saved.ram, 0);
            this.reg.set(saved.reg);
            this.pc = saved.pc;
            this.flags = saved.flags;
            this.reg[0] = code;
          } else {
            this.exitCode = code;
            this.halted = true;
          }
          break;
        }
        case 1: { // OPEN(path_ptr, mode) -> fd
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const mode = r[1];
          if (mode === 0) {
            const data = this.fs.readFile(path);
            if (!data) { r[0] = -1; break; }
            const fd = this.fs.nextFd++;
            this.fs.fds.set(fd, { path, mode: 0, pos: 0, data: new Uint8Array(data) });
            r[0] = fd;
          } else {
            const fd = this.fs.nextFd++;
            this.fs.fds.set(fd, { path, mode: 1, pos: 0, chunks: [], len: 0 });
            r[0] = fd;
          }
          break;
        }
        case 2: { // READ(fd, buf_ptr, len) -> bytes_read
          const desc = this.fs.fds.get(r[0]);
          if (!desc || desc.mode !== 0) { r[0] = -1; break; }
          const buf = r[1];
          const len = r[2];
          const avail = Math.max(0, Math.min(len, desc.data.length - desc.pos));
          for (let i = 0; i < avail; i++) {
            this.ram[(buf + i) & 0xFFFFF] = desc.data[desc.pos + i];
          }
          desc.pos += avail;
          r[0] = avail;
          break;
        }
        case 3: { // WRITE(fd, buf_ptr, len) -> bytes_written
          const fd = r[0];
          const buf = r[1];
          const len = r[2];
          if (fd === 1 || fd === 2) {
            if (this.hooks.onStdout) {
              let s = '';
              for (let i = 0; i < len; i++) s += String.fromCharCode(this.ram[(buf + i) & 0xFFFFF]);
              this.hooks.onStdout(s);
            }
            r[0] = len;
            break;
          }
          const desc = this.fs.fds.get(fd);
          if (!desc || desc.mode !== 1) { r[0] = -1; break; }
          const chunk = new Uint8Array(len);
          for (let i = 0; i < len; i++) chunk[i] = this.ram[(buf + i) & 0xFFFFF];
          desc.chunks.push(chunk);
          desc.len += len;
          r[0] = len;
          break;
        }
        case 4: { // CLOSE(fd) -> 0
          const fd = r[0];
          const desc = this.fs.fds.get(fd);
          if (!desc) { r[0] = -1; break; }
          if (desc.mode === 1) {
            const merged = new Uint8Array(desc.len);
            let off = 0;
            for (const c of desc.chunks) { merged.set(c, off); off += c.length; }
            this.fs.writeFile(desc.path, merged);
          }
          this.fs.fds.delete(fd);
          r[0] = 0;
          break;
        }
        case 5: { // LIST(dir_ptr, idx, name_out_ptr, is_dir_ptr, size_ptr) -> 1 or 0
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const idx = r[1];
          const entries = this.fs.list(path);
          if (!entries || idx < 0 || idx >= entries.length) {
            r[0] = 0;
            break;
          }
          const e = entries[idx];
          if (r[2]) this.writeStr(r[2], e.name, 32);
          if (r[3]) this.ramDV.setInt32(r[3] & 0xFFFFF, e.isDir, true);
          if (r[4]) this.ramDV.setInt32(r[4] & 0xFFFFF, e.size, true);
          r[0] = 1;
          break;
        }
        case 6: { // MKDIR(path_ptr)
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          r[0] = this.fs.mkdir(path);
          break;
        }
        case 7: { // DELETE(path_ptr)
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          r[0] = this.fs.unlink(path);
          break;
        }
        case 8: { // STAT(path_ptr, size_ptr, is_dir_ptr) -> 0 if exists, -1 if not
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const st = this.fs.stat(path);
          if (!st) { r[0] = -1; break; }
          if (r[1]) this.ramDV.setInt32(r[1] & 0xFFFFF, st.size, true);
          if (r[2]) this.ramDV.setInt32(r[2] & 0xFFFFF, st.isDir, true);
          r[0] = 0;
          break;
        }
        case 9: { // EXEC(bin_path_ptr, arg_str_ptr) -> exit_code
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const argStr = r[1] ? this.readStr(r[1]) : '';
          const bin = this.fs.readFile(path);
          if (!bin) { r[0] = -1; break; }
          this.procStack.push({
            ram: this.ram.slice(0, 0x0E0000),
            reg: new Int32Array(this.reg),
            pc: this.pc,
            flags: this.flags
          });
          this.loadBinary(bin, argStr);
          break;
        }
        case 10: // YIELD() -> copies live VRAM to tear-free presentBuf
          this.yielded = true;
          this.presentNow();
          if (this.hooks.onYield) this.hooks.onYield();
          break;
        case 11: { // KEY() -> next key or 0
          if (this.keyQueue.length > 0) {
            r[0] = this.keyQueue.shift();
          } else {
            r[0] = 0;
          }
          break;
        }
        case 12: { // TIME() -> ms since boot
          const elapsedMs = ((typeof performance !== "undefined" ? performance.now() : Date.now()) - this.bootPerf) | 0;
          this.ramDV.setInt32(0x0FFD00, elapsedMs, true);
          r[0] = elapsedMs;
          break;
        }
        case 13: // SAVE()
          if (this.hooks.onSave) this.hooks.onSave();
          r[0] = 0;
          break;
        case 14: { // EXPORT(bin_path_ptr, title_ptr)
          const binPath = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const title = this.readStr(r[1]);
          if (this.hooks.onExport) r[0] = this.hooks.onExport(binPath, title);
          else r[0] = 0;
          break;
        }
        case 15: { // REBOOTSTRAP() -> 0 if stage1==stage2==stage3, 2 if stage2==stage3
          if (this.hooks.onRebootstrap) r[0] = this.hooks.onRebootstrap();
          else r[0] = 0;
          break;
        }
        case 16: { // SELFTEST(report_buf_ptr) -> failed_count
          if (this.hooks.onSelftest) r[0] = this.hooks.onSelftest(r[0]);
          else r[0] = 0;
          break;
        }
        case 17: { // MIPS([report_buf_ptr]) -> MIPS * 10
          if (this.hooks.onMips) r[0] = this.hooks.onMips(r[0]);
          else r[0] = (this.lastMips * 10) | 0;
          break;
        }
        case 18: { // CHDIR(path_ptr) -> 0 or -1
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const st = this.fs.stat(path);
          if (st && st.isDir) {
            this.cwd = path;
            r[0] = 0;
          } else {
            r[0] = -1;
          }
          break;
        }
        case 19: { // GETCWD(buf_ptr) -> 0
          this.writeStr(r[0], this.cwd, 128);
          r[0] = 0;
          break;
        }
        case 20: { // GETARGS(buf_ptr) -> 0
          const args = this.readStr(0x0DF000);
          this.writeStr(r[0], args, 512);
          r[0] = 0;
          break;
        }
        case 21: { // JIT(mode) -> 0:off, 1:on, -1:query
          if (r[0] === 0 || r[0] === 1) {
            this.jitEnabled = (r[0] && this.wasmMem) ? 1 : 0;
            if (this.hooks.onJitToggle) this.hooks.onJitToggle(this.jitEnabled);
          }
          r[0] = this.jitEnabled;
          break;
        }
        case 22: { // CLOCK(rate) -> 0:max, 1..1000:MIPS, -1:query
          const arg = r[0] | 0;
          if (arg === 0) {
            this.setClock(0);
          } else if (arg >= 1 && arg <= 1000) {
            this.setClock(arg);
          }
          r[0] = this.clockRate;
          break;
        }
        default:
          r[0] = -1;
          break;
      }
    }
  }

        ctrlKey: false,

      });

    actions.className = "tp-actions";
    actions.appendChild(makeBtn("Space", " ", 32, "tp-act", true));
    actions.appendChild(makeBtn("Enter", "Enter", 13, "tp-act", false));
    body.appendChild(actions);

    pad.appendChild(body);
    chassisEl.appendChild(pad);

    if (controlsEl) {
      const t = document.createElement("button");
      t.type = "button";
      t.className = "tc-btn";
      t.title = "On-screen game controller (TabPad)";

      pad.classList.add("tp-on");

  // Stage 0 TabTalk Compiler in JS
// Exact 1-to-1 algorithmic match with /src/cc.tt so stage1 == stage2 == stage3 byte-for-byte!

const TK_EOF = 0;
const TK_NUM = 1;
const TK_IDENT = 2;
const TK_STR = 3;

const TK_INT = 10;
const TK_BYTE = 11;
const TK_STRUCT = 12;
const TK_IF = 13;
const TK_ELSE = 14;
const TK_WHILE = 15;
const TK_FOR = 16;
const TK_RETURN = 17;
const TK_BREAK = 18;
const TK_CONTINUE = 19;
const TK_IMPORT = 20;
const TK_SYS = 21;
const TK_CONST = 22;

const TK_EQ = 256;    // ==
const TK_NE = 257;    // !=
const TK_LE = 258;    // <=
const TK_GE = 259;    // >=
const TK_SHL = 260;   // <<
const TK_SHR = 261;   // >>
const TK_AND = 262;   // &&
const TK_OR = 263;    // ||
const TK_INC = 264;   // ++
const TK_DEC = 265;   // --
const TK_ADDEQ = 266; // +=
const TK_SUBEQ = 267; // -=
const TK_ARROW = 268; // ->

const TY_INT = 1;
const TY_BYTE = 2;
const TY_STRUCT = 3;

function compileTabTalk(srcPath, fsController) {
  // Source buffer (expanded with imports)
  const src = new Uint8Array(262144);
  let srcLen = 0;

  // Imported file table (up to 32 files, 32 bytes each)
  const impNames = [];

  function loadSourceFile(pathStr, curDir) {
    const norm = fsController.normPath(pathStr, curDir);
    for (let i = 0; i < impNames.length; i++) {
      if (impNames[i] === norm) return;
    }
    impNames.push(norm);
    const raw = fsController.readFile(norm);
    if (!raw) throw new Error('Cannot open file: ' + norm);
    const dir = norm.slice(0, norm.lastIndexOf('/')) || '/';

    let i = 0;
    const n = raw.length;
    while (i < n) {
      if (
        i + 7 < n &&
        raw[i] === 105 && raw[i + 1] === 109 && raw[i + 2] === 112 &&
        raw[i + 3] === 111 && raw[i + 4] === 114 && raw[i + 5] === 116 &&
        (raw[i + 6] === 32 || raw[i + 6] === 9) &&
        (i === 0 || raw[i - 1] === 10 || raw[i - 1] === 13 || raw[i - 1] === 32 || raw[i - 1] === 9)
      ) {
        let j = i + 6;
        while (j < n && (raw[j] === 32 || raw[j] === 9)) j++;
        if (raw[j] === 34) { // '"'
          j++;
          let fname = '';
          while (j < n && raw[j] !== 34) {
            fname += String.fromCharCode(raw[j]);
            j++;
          }
          if (raw[j] === 34) j++;
          if (raw[j] === 59) j++;
          loadSourceFile(fname, dir);
          src[srcLen++] = 10;
          i = j;
          continue;
        }
      }
      src[srcLen++] = raw[i++];
    }
    src[srcLen++] = 10;
  }

  loadSourceFile(srcPath, '/src');
  src[srcLen] = 0;

  // Code buffer
  const code = new Uint8Array(262144);
  const codeDV = new DataView(code.buffer);
  let codePos = 0;

  function emit32(w) {
    codeDV.setUint32(codePos, w >>> 0, true);
    codePos += 4;
  }
  function patchAddr24(addr, target) {
    const old = codeDV.getUint32(addr, true);
    codeDV.setUint32(addr, ((old & 0xFF000000) | (target & 0x00FFFFFF)) >>> 0, true);
  }
  function emitR(op, rd, ra, rb) {
    emit32(((op & 0x3F) << 24) | ((rd & 0x0F) << 20) | ((ra & 0x0F) << 16) | ((rb & 0x0F) << 12));
  }
  function emitI(op, rd, ra, imm16) {
    emit32(((op & 0x3F) << 24) | ((rd & 0x0F) << 20) | ((ra & 0x0F) << 16) | (imm16 & 0xFFFF));
  }
  function emitJ(op, addr24) {
    emit32(((op & 0x3F) << 24) | (addr24 & 0x00FFFFFF));
  }
  function emitLoadImm(rd, val) {
    const v = val | 0;
    if (v >= -32768 && v <= 32767) {
      emitI(0x02, rd, 0, v & 0xFFFF); // LDI
    } else if (v >= 0 && v <= 65535) {
      emitI(0x03, rd, 0, v & 0xFFFF); // LDIU
    } else {
      emitI(0x03, rd, 0, v & 0xFFFF); // LDIU
      emitI(0x04, rd, 0, (v >>> 16) & 0xFFFF); // LUI
    }

  // Lexer state
  let lexPos = 0;
  let tok = 0;
  let tokVal = 0;
  let tokStr = '';
  const tokBytes = new Uint8Array(512);
  let tokBytesLen = 0;
  let lineNum = 1;

  function isAlpha(c) {
    return (c >= 65 && c <= 90) || (c >= 97 && c <= 122) || c === 95;
  }
  function isDigit(c) {
    return c >= 48 && c <= 57;
  }
  function isHex(c) {
    return isDigit(c) || (c >= 65 && c <= 70) || (c >= 97 && c <= 102);
  }

    if (c >= 65 && c <= 70) return c - 55;
    return c - 87;

      const c = src[lexPos];

        continue;
      }

        lexPos++;
        continue;

      if (c === 47 && src[lexPos + 1] === 47) { // //

        continue;
      }

        lexPos += 2;
        while (lexPos < srcLen && !(src[lexPos] === 42 && src[lexPos + 1] === 47)) {
          if (src[lexPos] === 10) lineNum++;
          lexPos++;
        }
        if (lexPos < srcLen) lexPos += 2;
        continue;
      }
      break;
    }

    if (lexPos >= srcLen) {
      tok = TK_EOF;
      return;
    }

    const c = src[lexPos];

    if (isAlpha(c)) {
      let s = '';
      while (lexPos < srcLen && (isAlpha(src[lexPos]) || isDigit(src[lexPos]))) {
        s += String.fromCharCode(src[lexPos++]);
      }
      tokStr = s;
      if (s === 'int') { tok = TK_INT; return; }
      if (s === 'byte') { tok = TK_BYTE; return; }
      if (s === 'struct') { tok = TK_STRUCT; return; }
      if (s === 'if') { tok = TK_IF; return; }
      if (s === 'else') { tok = TK_ELSE; return; }
      if (s === 'while') { tok = TK_WHILE; return; }
      if (s === 'for') { tok = TK_FOR; return; }
      if (s === 'return') { tok = TK_RETURN; return; }
      if (s === 'break') { tok = TK_BREAK; return; }
      if (s === 'continue') { tok = TK_CONTINUE; return; }
      if (s === 'import') { tok = TK_IMPORT; return; }
      if (s === 'sys') { tok = TK_SYS; return; }
      if (s === 'const') { tok = TK_CONST; return; }
      for (let i = constCount - 1; i >= 0; i--) {
        if (constName[i] === s) {
          tok = TK_NUM;
          tokVal = constVal[i];
          return;
        }
      }
      tok = TK_IDENT;
      return;
    }

      let v = 0;
      if (c === 48 && (src[lexPos + 1] === 120 || src[lexPos + 1] === 88)) {
        lexPos += 2;
        while (lexPos < srcLen && isHex(src[lexPos])) {

        }

        }

      tokVal = v | 0;
      return;

      lexPos++;
      let v = src[lexPos++];
      if (v === 92) v = readEscape();
      if (src[lexPos] === 39) lexPos++;

      tokVal = v;
      return;
    }

    if (c === 34) { // '"'
      lexPos++;
      tokBytesLen = 0;
      while (lexPos < srcLen && src[lexPos] !== 34) {
        let ch = src[lexPos++];
        if (ch === 92) ch = readEscape();
        tokBytes[tokBytesLen++] = ch & 0xFF;
      }
      if (src[lexPos] === 34) lexPos++;
      tokBytes[tokBytesLen] = 0;
      tok = TK_STR;
      return;
    }

    const c2 = src[lexPos + 1];
    if (c === 61 && c2 === 61) { lexPos += 2; tok = 256; return; }
    if (c === 33 && c2 === 61) { lexPos += 2; tok = 257; return; }
    if (c === 60 && c2 === 61) { lexPos += 2; tok = 258; return; }
    if (c === 62 && c2 === 61) { lexPos += 2; tok = 259; return; }
    if (c === 60 && c2 === 60) { lexPos += 2; tok = 260; return; }
    if (c === 62 && c2 === 62) { lexPos += 2; tok = 261; return; }
    if (c === 38 && c2 === 38) { lexPos += 2; tok = 262; return; }
    if (c === 124 && c2 === 124) { lexPos += 2; tok = 263; return; }
    if (c === 43 && c2 === 43) { lexPos += 2; tok = 264; return; }
    if (c === 45 && c2 === 45) { lexPos += 2; tok = 265; return; }
    if (c === 43 && c2 === 61) { lexPos += 2; tok = 266; return; }
    if (c === 45 && c2 === 61) { lexPos += 2; tok = 267; return; }
    if (c === 45 && c2 === 62) { lexPos += 2; tok = 268; return; }

    lexPos++;
    tok = c;
  }

  function expect(t) {
    if (tok !== t) {
      throw new Error(`Line ${lineNum}: expected token ${t} ('${String.fromCharCode(t)}'), got ${tok} ('${tokStr}')`);
    }
    nextToken();
  }

  // Symbol tables
  const constName = [];
  const constVal = [];
  let constCount = 0;

  const structName = [];
  const structSize = [];
  let structCount = 0;

  const fieldStructIdx = [];
  const fieldName = [];
  const fieldType = [];
  const fieldPtr = [];
  const fieldOffset = [];
  const fieldIsArr = [];
  let fieldCount = 0;

  const gName = [];
  const gType = [];
  const gPtr = [];
  const gStruct = [];
  const gIsArr = [];
  const gAddr = [];
  let gCount = 0;
  let gNextAddr = 0x050000;

  const lName = [];
  const lType = [];
  const lPtr = [];
  const lStruct = [];
  const lIsArr = [];
  const lOffset = [];
  let lCount = 0;
  let curLocalOffset = -4;

  const fnName = [];
  const fnAddr = [];
  const fnDefined = [];
  const fnRetType = [];
  const fnRetPtr = [];
  const fnRetStruct = [];
  let fnCount = 0;

  const fixupCodeAddr = [];
  const fixupFnIdx = [];
  let fixupCount = 0;

  const breakPatchAddr = new Int32Array(256);
  const breakLoopDepth = new Int32Array(256);
  let breakCount = 0;
  const contTargetAddr = new Int32Array(64);
  const contPatchAddr = new Int32Array(256);
  const contLoopDepth = new Int32Array(256);
  let contCount = 0;
  let loopDepth = 0;

  let exprPtr = 0;
  let exprStruct = -1;
  let exprIsLval = 0;

    if (baseType === TY_BYTE) return 1;
    if (baseType === TY_STRUCT) return structSize[sIdx];
    return 4;
  }

    if (baseType === TY_BYTE) return 1;

    return 4;

    for (let i = 0; i < fnCount; i++) {
      if (fnName[i] === name) return i;
    }
    return -1;

  let parsedPtr = 0;
  let parsedStruct = -1;

  function isTypeStart() {
    return tok === TK_INT || tok === TK_BYTE || tok === TK_STRUCT;
  }

  function parseType() {
    parsedPtr = 0;
    parsedStruct = -1;
    if (tok === TK_INT) {
      parsedBaseType = TY_INT;
      nextToken();
    } else if (tok === TK_BYTE) {
      parsedBaseType = TY_BYTE;
      nextToken();
    } else if (tok === TK_STRUCT) {
      parsedBaseType = TY_STRUCT;
      nextToken();
      parsedStruct = findStruct(tokStr);
      expect(TK_IDENT);
    } else {
      throw new Error(`Line ${lineNum}: expected type`);
    }
    while (tok === 42) {
      parsedPtr++;
      nextToken();
    }

  function parseExpr() {
    parseAssign();
  }

  function emitStoreLval() {
    if (exprPtr === 0 && exprType === TY_BYTE) {
      emitI(0x21, 0, 1, 0); // STB R0, [R1 + 0]
    } else {
      emitI(0x23, 0, 1, 0); // STW R0, [R1 + 0]
    }

  function parseAssign() {
    parseCond();
    if (tok === 61 || tok === TK_ADDEQ || tok === TK_SUBEQ) {

      const op = tok;
      const lhsType = exprType;
      const lhsPtr = exprPtr;
      const lhsStruct = exprStruct;
      nextToken();

      if (op === 61) {
        emitI(0x24, 0, 0, 0); // PUSH R0
        parseAssign();
        rvalLoad();
        emitI(0x25, 1, 0, 0); // POP R1
        exprType = lhsType;
        exprPtr = lhsPtr;
        exprStruct = lhsStruct;
        emitStoreLval();
        exprIsLval = 0;
      } else {
        emitI(0x24, 0, 0, 0); // PUSH R0
        rvalLoad();
        emitI(0x24, 0, 0, 0); // PUSH R0
        parseAssign();
        rvalLoad();
        const scale = lhsPtr > 0 ? derefSize(lhsType, lhsPtr, lhsStruct) : 1;
        if (scale > 1) {
          emitLoadImm(2, scale);
          emitR(0x07, 0, 0, 2);
        }
        emitI(0x25, 1, 0, 0); // POP R1
        if (op === TK_ADDEQ) emitR(0x05, 0, 1, 0);
        else emitR(0x06, 0, 1, 0);
        emitI(0x25, 1, 0, 0); // POP R1
        exprType = lhsType;
        exprPtr = lhsPtr;
        exprStruct = lhsStruct;
        emitStoreLval();
        exprIsLval = 0;

  function parseCond() {
    parseLogOr();
    if (tok === 63) { // '?'
      rvalLoad();
      nextToken();
      emitI(0x1B, 0, 0, 0); // CMPI R0, 0
      const patchFalse = codePos;
      emitJ(0x27, 0); // JZ false
      parseExpr();
      rvalLoad();
      const tType = exprType;
      const tPtr = exprPtr;
      const tStruct = exprStruct;
      expect(58); // ':'
      const patchEnd = codePos;
      emitJ(0x26, 0); // JMP end
      patchAddr24(patchFalse, codePos);
      parseCond();
      rvalLoad();
      patchAddr24(patchEnd, codePos);
      exprType = tType;
      exprPtr = tPtr;
      exprStruct = tStruct;
      exprIsLval = 0;
    }

  function parseLogOr() {
    parseLogAnd();
    while (tok === TK_OR) {
      rvalLoad();
      nextToken();
      emitI(0x1B, 0, 0, 0);
      const patchTrue = codePos;
      emitJ(0x28, 0); // JNZ true
      parseLogAnd();
      rvalLoad();
      emitI(0x1B, 0, 0, 0);
      const patchTrue2 = codePos;
      emitJ(0x28, 0);
      emitLoadImm(0, 0);
      const patchEnd = codePos;
      emitJ(0x26, 0);
      const trueAddr = codePos;
      patchAddr24(patchTrue, trueAddr);
      patchAddr24(patchTrue2, trueAddr);
      emitLoadImm(0, 1);
      patchAddr24(patchEnd, codePos);
      exprType = TY_INT;
      exprPtr = 0;
      exprStruct = -1;
      exprIsLval = 0;
    }
  }

  function parseLogAnd() {
    parseBitOr();
    while (tok === TK_AND) {
      rvalLoad();
      nextToken();
      emitI(0x1B, 0, 0, 0);
      const patchFalse = codePos;
      emitJ(0x27, 0); // JZ false
      parseBitOr();
      rvalLoad();
      emitI(0x1B, 0, 0, 0);
      const patchFalse2 = codePos;
      emitJ(0x27, 0);
      emitLoadImm(0, 1);
      const patchEnd = codePos;
      emitJ(0x26, 0);
      const falseAddr = codePos;
      patchAddr24(patchFalse, falseAddr);
      patchAddr24(patchFalse2, falseAddr);
      emitLoadImm(0, 0);
      patchAddr24(patchEnd, codePos);
      exprType = TY_INT;
      exprPtr = 0;
      exprStruct = -1;
      exprIsLval = 0;
    }

  function parseBitOr() {
    parseBitXor();
    while (tok === 124) {
      rvalLoad();
      emitI(0x24, 0, 0, 0);
      nextToken();
      parseBitXor();
      rvalLoad();
      emitI(0x25, 1, 0, 0);
      emitR(0x0D, 0, 1, 0);
      exprType = TY_INT;
      exprPtr = 0;
      exprIsLval = 0;
    }
  }

  function parseBitXor() {
    parseBitAnd();
    while (tok === 94) {
      rvalLoad();
      emitI(0x24, 0, 0, 0);
      nextToken();
      parseBitAnd();
      rvalLoad();
      emitI(0x25, 1, 0, 0);
      emitR(0x0E, 0, 1, 0);
      exprType = TY_INT;
      exprPtr = 0;
      exprIsLval = 0;
    }

  function parseBitAnd() {
    parseEq();
    while (tok === 38) {
      rvalLoad();
      emitI(0x24, 0, 0, 0);
      nextToken();
      parseEq();
      rvalLoad();
      emitI(0x25, 1, 0, 0);
      emitR(0x0C, 0, 1, 0);
      exprType = TY_INT;
      exprPtr = 0;
      exprIsLval = 0;

  function parseEq() {
    parseRel();
    while (tok === TK_EQ || tok === TK_NE) {
      const op = tok;
      rvalLoad();
      emitI(0x24, 0, 0, 0);
      nextToken();
      parseRel();
      rvalLoad();
      emitI(0x25, 1, 0, 0);
      emitR(0x1A, 0, 1, 0);
      emitI(0x36, 0, 0, op === TK_EQ ? 0 : 1);
      exprType = TY_INT;
      exprPtr = 0;
      exprIsLval = 0;

  function parseRel() {
    parseShift();
    while (tok === 60 || tok === 62 || tok === TK_LE || tok === TK_GE) {
      const op = tok;
      rvalLoad();
      emitI(0x24, 0, 0, 0);
      nextToken();
      parseShift();
      rvalLoad();
      emitI(0x25, 1, 0, 0);
      emitR(0x1A, 0, 1, 0);
      let cc = 2;
      if (op === 60) cc = 2;
      else if (op === TK_GE) cc = 3;
      else if (op === TK_LE) cc = 4;
      else if (op === 62) cc = 5;
      emitI(0x36, 0, 0, cc);
      exprType = TY_INT;
      exprPtr = 0;
      exprIsLval = 0;

  function parseShift() {
    parseAdd();

      nextToken();
      parseAdd();
      rvalLoad();
      emitI(0x25, 1, 0, 0);

      const lPtr = exprPtr;
      const lStruct = exprStruct;

      parseMul();
      rvalLoad();

      const rPtr = exprPtr;
      const rStruct = exprStruct;

          emitR(0x07, 0, 0, 2);

        exprType = lType;
        exprPtr = lPtr;
        exprStruct = lStruct;

        if (scale > 1) {
          emitLoadImm(2, scale);
          emitR(0x07, 1, 1, 2);

        emitR(0x05, 0, 1, 0);
        exprType = rType;
        exprPtr = rPtr;
        exprStruct = rStruct;

        emitR(0x06, 0, 1, 0);
        const scale = derefSize(lType, lPtr, lStruct);
        if (scale > 1) {
          emitLoadImm(2, scale);
          emitR(0x08, 0, 0, 2);

        exprPtr = 0;
        exprStruct = -1;

        exprType = TY_INT;
        exprPtr = 0;
        exprStruct = -1;

  function parseMul() {
    parseUnary();
    while (tok === 42 || tok === 47 || tok === 37) {

      rvalLoad();
      emitI(0x24, 0, 0, 0);
      nextToken();
      parseUnary();
      rvalLoad();
      emitI(0x25, 1, 0, 0);
      if (op === 42) emitR(0x07, 0, 1, 0);
      else if (op === 47) emitR(0x08, 0, 1, 0);
      else emitR(0x09, 0, 1, 0);
      exprType = TY_INT;
      exprPtr = 0;
      exprStruct = -1;
      exprIsLval = 0;
    }
  }

  function parseUnary() {
    if (tok === 45) {
      nextToken();
      parseUnary();
      rvalLoad();
      emitLoadImm(1, 0);
      emitR(0x06, 0, 1, 0);
      exprType = TY_INT;
      exprPtr = 0;
      exprIsLval = 0;
      return;
    }
    if (tok === 33) {
      nextToken();
      parseUnary();
      rvalLoad();
      emitI(0x1B, 0, 0, 0);
      emitI(0x36, 0, 0, 0);
      exprType = TY_INT;
      exprPtr = 0;
      exprIsLval = 0;
      return;
    }
    if (tok === 126) {
      nextToken();
      parseUnary();
      rvalLoad();
      emitLoadImm(1, -1);
      emitR(0x0E, 0, 0, 1);
      exprType = TY_INT;
      exprPtr = 0;
      exprIsLval = 0;
      return;
    }
    if (tok === 42) {
      nextToken();
      parseUnary();
      rvalLoad();
      if (exprPtr > 0) exprPtr--;
      exprIsLval = 1;
      return;
    }
    if (tok === 38) {
      nextToken();
      parseUnary();
      if (!exprIsLval && exprType !== TY_STRUCT) {
        throw new Error(`Line ${lineNum}: cannot take address of rvalue`);
      }
      exprPtr++;
      exprIsLval = 0;
      return;
    }
    if (tok === TK_INC || tok === TK_DEC) {
      const op = tok;
      nextToken();
      parseUnary();
      if (!exprIsLval) throw new Error(`Line ${lineNum}: invalid lvalue in ++/--`);
      const step = exprPtr > 0 ? derefSize(exprType, exprPtr, exprStruct) : 1;
      emitR(0x01, 1, 0, 0);
      rvalLoad();
      if (op === TK_INC) emitI(0x12, 0, 0, step);

      exprIsLval = 0;
      return;

  }

  function parsePostfix() {
    parsePrimary();
    while (true) {
      if (tok === 91) {
        rvalLoad();
        const bType = exprType;
        const bPtr = exprPtr;
        const bStruct = exprStruct;
        emitI(0x24, 0, 0, 0);
        nextToken();
        parseExpr();
        rvalLoad();
        expect(93);
        const elemPtr = bPtr > 0 ? bPtr - 1 : 0;
        const scale = typeSize(bType, elemPtr, bStruct);
        if (scale > 1) {
          emitLoadImm(2, scale);
          emitR(0x07, 0, 0, 2);
        }
        emitI(0x25, 1, 0, 0);
        emitR(0x05, 0, 1, 0);
        exprType = bType;
        exprPtr = elemPtr;
        exprStruct = bStruct;

        nextToken();
        const fName = tokStr;
        expect(TK_IDENT);
        let found = -1;

        const off = fieldOffset[found];
        if (off !== 0) emitI(0x12, 0, 0, off);
        exprType = fieldType[found];
        exprPtr = fieldPtr[found];
        exprStruct = -1;
        if (fieldIsArr[found]) {

          exprIsLval = 0;
        } else {
          exprIsLval = 1;
        }
      } else if (tok === TK_INC || tok === TK_DEC) {
        if (!exprIsLval) throw new Error(`Line ${lineNum}: invalid lvalue in post ++/--`);
        const op = tok;
        nextToken();
        const step = exprPtr > 0 ? derefSize(exprType, exprPtr, exprStruct) : 1;
        emitR(0x01, 1, 0, 0);
        rvalLoad();
        emitR(0x01, 2, 0, 0);
        if (op === TK_INC) emitI(0x12, 0, 0, step);
        else emitI(0x13, 0, 0, step);
        emitStoreLval();
        emitR(0x01, 0, 2, 0);
        exprIsLval = 0;
      } else {
        break;
      }
    }
  }

  function parsePrimary() {

      nextToken();
      exprType = TY_INT;
      exprPtr = 0;
      exprStruct = -1;
      exprIsLval = 0;
      return;

      emitJ(0x26, 0);

      }
      patchAddr24(jmpAddr, codePos);
      emitLoadImm(0, strAddr);
      nextToken();
      exprType = TY_BYTE;
      exprPtr = 1;
      exprStruct = -1;
      exprIsLval = 0;
      return;

      parseExpr();
      expect(41);
      return;
    }

      expect(40);

        parseExpr();
        rvalLoad();
        emitI(0x24, 0, 0, 0);

      exprPtr = 0;
      exprStruct = -1;

            rvalLoad();

          fnAddr[fIdx] = 0;
          fnDefined[fIdx] = 0;
          fnRetType[fIdx] = TY_INT;
          fnRetPtr[fIdx] = 0;
          fnRetStruct[fIdx] = -1;

        exprPtr = fnRetPtr[fIdx];
        exprStruct = fnRetStruct[fIdx];
        exprIsLval = 0;

          if (lOffset[i] >= -32768 && lOffset[i] <= 32767) {

            emitR(0x05, 0, 13, 2);

          exprStruct = lStruct[i];

            exprPtr++;
            exprIsLval = 0;
          } else if (exprPtr === 0 && exprType === TY_STRUCT) {
            exprIsLval = 0;
          } else {
            exprIsLval = 1;
          }
          return;
        }
      }

      for (let i = gCount - 1; i >= 0; i--) {
        if (gName[i] === name) {
          emitLoadImm(0, gAddr[i]);
          exprType = gType[i];
          exprPtr = gPtr[i];
          exprStruct = gStruct[i];
          if (gIsArr[i]) {
            exprPtr++;
            exprIsLval = 0;
          } else if (exprPtr === 0 && exprType === TY_STRUCT) {
            exprIsLval = 0;
          } else {
            exprIsLval = 1;

          return;

  function emitFuncReturn() {

    emitI(0x25, 13, 0, 0);  // POP FP

      expect(59);
      breakPatchAddr[breakCount] = codePos;
      breakLoopDepth[breakCount] = loopDepth;
      breakCount++;
      emitJ(0x26, 0);
      return;
    }
    if (tok === TK_CONTINUE) {
      nextToken();
      expect(59);
      contPatchAddr[contCount] = codePos;
      contLoopDepth[contCount] = loopDepth;
      contCount++;
      emitJ(0x26, 0);
      return;
    }
    if (tok === 59) {
      nextToken();
      return;
    }
    parseExpr();
    expect(59);
  }
