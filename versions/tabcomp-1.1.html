<style id="tc-style">
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0d14;
    color: #e4e8f0;
    font-family: "Courier New", Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 12px;
    user-select: none;
  }
  .tc-chassis {
    background: #1a1e29;
    border: 3px solid #3c465c;
    border-radius: 10px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.12);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 100%;
  }
  .tc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 2px solid #2b3244;
    padding-bottom: 8px;
    flex-wrap: wrap;
  }
  .tc-brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .tc-logo {
    font-size: 18px;
    font-weight: 900;
    color: #00f0ff;
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(0,240,255,0.45);
  }
  .tc-sub {
    font-size: 11px;
    color: #9ba6bf;
  }
  .tc-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tc-badge {
    background: #0d1018;
    border: 1px solid #2f384d;
    color: #48ff7a;
    padding: 4px 8px;
    font-size: 12px;
    font-weight: bold;
    border-radius: 4px;
  }
  .tc-btn {
    background: #263044;
    border: 1px solid #4d5d80;
    color: #ffffff;
    font-family: inherit;
    font-size: 12px;
    font-weight: bold;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  .tc-btn:hover { background: #33415c; border-color: #00f0ff; }
  .tc-btn:active { transform: translateY(1px); }
  .tc-bezel {
    background: #050608;
    border: 4px solid #0f131c;
    border-radius: 6px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #tc-screen {
    width: 640px;
    height: 400px;
    max-width: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000000;
    display: block;
    outline: none;
  }
  .tc-footer {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #7d89a3;
  }
</style>
</head>

  function u8ToB64(u8) {
    let bin = "";
    const len = u8.length;
    for (let i = 0; i < len; i++) bin += String.fromCharCode(u8[i]);
    return btoa(bin);
  }

  function b64ToU8(b64) {
    const bin = atob(b64.trim());
    const len = bin.length;
    const u8 = new Uint8Array(len);
    for (let i = 0; i < len; i++) u8[i] = bin.charCodeAt(i) & 0xFF;
    return u8;
  }

  function serializeDiskB64(fsObj) {
    const dirs = Array.from(fsObj.dirs).sort();
    const fileKeys = Array.from(fsObj.files.keys()).sort();
    const files = {};
    for (let i = 0; i < fileKeys.length; i++) {
      const k = fileKeys[i];
      files[k] = u8ToB64(fsObj.files.get(k));
    }
    const json = JSON.stringify({ dirs: dirs, files: files });
    const utf8 = new TextEncoder().encode(json);
    return u8ToB64(utf8);
  }

    fsObj.dirs.clear();

    const rawJson = new TextDecoder().decode(b64ToU8(b64Str));

    for (let i = 0; i < parsed.dirs.length; i++) {
      fsObj.dirs.add(parsed.dirs[i]);
    }
    const keys = Object.keys(parsed.files);
    for (let i = 0; i < keys.length; i++) {

  class TabCompSound {
    constructor(cpu) {
      this.cpu = cpu;
      this.ctx = null;
      this.channels = [];
    }
    unlock() {
      if (this.ctx) {
        if (this.ctx.state === "suspended") this.ctx.resume();
        return;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      const types = ["square", "triangle", "sawtooth", "square"];
      for (let i = 0; i < 4; i++) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = types[i];
        osc.frequency.value = 0;
        gain.gain.value = 0;
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        this.channels.push({ osc, gain });
      }
    }
    syncFromRAM() {
      if (!this.ctx) return;
      const ram = this.cpu.ram;
      for (let i = 0; i < 4; i++) {
        const base = 0x0FFD20 + i * 8;
        const freq = ram[base] | (ram[base + 1] << 8);
        const vol = ram[base + 2];
        const ch = this.channels[i];
        if (freq > 20 && vol > 0) {
          const f = i === 3 ? (freq * ((Math.random() * 0.5) + 0.75)) : freq;
          ch.osc.frequency.setTargetAtTime(f, this.ctx.currentTime, 0.005);
          ch.gain.gain.setTargetAtTime((vol / 255) * 0.08, this.ctx.currentTime, 0.005);
        } else {
          ch.gain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.005);
        }
      }
    }
  }

  // Display Renderer: draws ONLY the tear-free present buffer (cpu.presentBuf), NEVER live VRAM!
  function renderFramebufferToCanvas(cpu, ctx2d, imgData) {
    const ram = cpu.ram;
    const pbuf = cpu.presentBuf;
    const data32 = new Uint32Array(imgData.data.buffer);
    const palBase = 0x0FFA00;
    const pal32 = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      const r = ram[palBase + i * 3];
      const g = ram[palBase + i * 3 + 1];
      const b = ram[palBase + i * 3 + 2];
      pal32[i] = (255 << 24) | (b << 16) | (g << 8) | r;
    }
    for (let i = 0; i < 64000; i++) {
      data32[i] = pal32[pbuf[i]];
    }
    ctx2d.putImageData(imgData, 0, 0);
  }

  class TabCompFS {
    constructor() {
      this.files = new Map();
      this.dirs = new Set(['/', '/src', '/bin', '/home']);
      this.fds = new Map();
      this.nextFd = 3;
    }

    normPath(p, cwd = '/home') {
      if (!p) return cwd;
      p = p.replace(/\\/g, '/').trim();
      if (!p.startsWith('/')) {
        p = (cwd === '/' ? '/' : cwd + '/') + p;
      }
      const parts = p.split('/');
      const out = [];
      for (const part of parts) {
        if (!part || part === '.') continue;
        if (part === '..') { out.pop(); continue; }
        out.push(part.slice(0, 31));
      }
      return '/' + out.join('/');
    }

    writeFile(path, content) {
      const p = this.normPath(path, '/');
      const lastSlash = p.lastIndexOf('/');
      if (lastSlash > 0) {
        const dir = p.slice(0, lastSlash);
        this.mkdir(dir);
      }
      if (typeof content === 'string') {
        this.files.set(p, new TextEncoder().encode(content));
      } else if (content instanceof Uint8Array) {
        this.files.set(p, new Uint8Array(content));
      } else {
        this.files.set(p, new Uint8Array(content));
      }
    }

    readFile(path) {
      const p = this.normPath(path, '/');
      return this.files.get(p) || null;
    }

    readText(path) {
      const d = this.readFile(path);
      return d ? new TextDecoder().decode(d) : null;
    }

    mkdir(path) {
      const p = this.normPath(path, '/');
      const parts = p.split('/').filter(Boolean);
      let cur = '';
      this.dirs.add('/');
      for (const part of parts) {
        cur += '/' + part;
        this.dirs.add(cur);
      }
      return 0;
    }

    unlink(path) {
      const p = this.normPath(path, '/');
      if (this.files.has(p)) {
        this.files.delete(p);
        return 0;
      }
      if (this.dirs.has(p) && p !== '/') {
        this.dirs.delete(p);
        return 0;
      }
      return -1;
    }

    stat(path) {
      const p = this.normPath(path, '/');
      if (this.dirs.has(p)) return { exists: 1, isDir: 1, size: 0 };
      if (this.files.has(p)) return { exists: 1, isDir: 0, size: this.files.get(p).length };
      return null;
    }

    list(dirPath) {
      const p = this.normPath(dirPath, '/');
      if (!this.dirs.has(p)) return null;
      const prefix = p === '/' ? '/' : p + '/';
      const entries = [];
      for (const d of this.dirs) {
        if (d !== p && d.startsWith(prefix)) {
          const rest = d.slice(prefix.length);
          if (!rest.includes('/')) {
            entries.push({ name: rest, isDir: 1, size: 0 });
          }
        }
      }
      for (const [f, data] of this.files.entries()) {
        if (f.startsWith(prefix)) {
          const rest = f.slice(prefix.length);
          if (!rest.includes('/')) {
            entries.push({ name: rest, isDir: 0, size: data.length });
          }
        }
      }
      entries.sort((a, b) => (b.isDir - a.isDir) || a.name.localeCompare(b.name));
      return entries;
    }
  }

  // Zero-dependency WebAssembly Basic-Block / Superblock JIT Compiler
  // Shares linear memory directly with TabCompCPU (0x000000..0x0FFFFF = RAM, 0x100000..0x10003F = R0..R15, 0x100040 = pc, 0x100044 = flags, 0x100048 = codeDirty)
  function encodeULEB128(val, out) {
    let v = val >>> 0;
    do {
      let b = v & 0x7F;
      v >>>= 7;
      if (v !== 0) b |= 0x80;
      out.push(b);
    } while (v !== 0);
  }

  function encodeSLEB128(val, out) {
    let v = val | 0;
    let more = true;
    while (more) {
      let b = v & 0x7F;
      v >>= 7;
      if ((v === 0 && (b & 0x40) === 0) || (v === -1 && (b & 0x40) !== 0)) {
        more = false;
      } else {
        b |= 0x80;
      }
      out.push(b);
    }
  }

  function emitSection(id, payload, out) {
    out.push(id);
    encodeULEB128(payload.length, out);
    for (let i = 0; i < payload.length; i++) out.push(payload[i]);
  }

  const L_FLAGS = 16;
  const L_EXIT_PC = 17;
  const L_STEPS = 18;
  const L_ITERS = 19;
  const L_A = 20;
  const L_B = 21;
  const L_DIRTY = 22;

  class TabCompWasmJIT {
    constructor(cpu) {
      this.cpu = cpu;
      this.wasmMem = cpu.wasmMem;
      this.hotCounts = new Uint16Array(65536);
      this.blockTable = new Array(65536);
      this.wasmCache = new Map();
      this.compiledCount = 0;
    }

    invalidateAll() {
      this.hotCounts.fill(0);
      this.blockTable.fill(undefined);
      this.compiledCount = 0;
    }

    compileBasicBlock(startPc) {
      if (!this.wasmMem) return null;
      const dv = this.cpu.ramDV;

      let readRegs = 0;
      let writtenRegs = 0;
      let hasSelfLoop = false;
      let hasStore = false;

      const trace = [];
      let pc = startPc;
      let count = 0;
      let ended = false;
      let terminated = false;
      let sigA = 2166136261;
      let sigB = startPc;

      function markRead(r) { readRegs |= (1 << r); }
      function markWrite(r) { writtenRegs |= (1 << r); }
      function pushConst(v, out) { out.push(0x41); encodeSLEB128(v | 0, out); }
      function getReg(r, out) { markRead(r); out.push(0x20, r); }
      function setReg(r, out) { markWrite(r); out.push(0x21, r); }
      function teeReg(r, out) { markWrite(r); out.push(0x22, r); }
      function emitExit(targetPc, stepCount, brDepth, out) {
        pushConst(targetPc, out);
        out.push(0x21, L_EXIT_PC);
        out.push(0x20, L_STEPS);
        pushConst(stepCount, out);
        out.push(0x6A, 0x21, L_STEPS);
        out.push(0x0C, brDepth);
      }
      function pushBranchCond(op, out) {
        markRead(L_FLAGS);
        out.push(0x20, L_FLAGS);
        switch (op) {
          case 0x27: pushConst(1, out); out.push(0x71); break;
          case 0x28: pushConst(1, out); out.push(0x71, 0x45); break;
          case 0x29: pushConst(2, out); out.push(0x71); break;
          case 0x2A: pushConst(2, out); out.push(0x71, 0x45); break;
          case 0x2B: pushConst(3, out); out.push(0x71); break;
          case 0x2C: pushConst(3, out); out.push(0x71, 0x45); break;
          case 0x30: pushConst(4, out); out.push(0x71); break;
          case 0x31: pushConst(4, out); out.push(0x71, 0x45); break;
          case 0x32: pushConst(5, out); out.push(0x71); break;
          case 0x33: pushConst(5, out); out.push(0x71, 0x45); break;
        }
      }

      while (count < 64 && !ended) {
        const inst = dv.getUint32(pc, true);
        sigA = Math.imul(sigA ^ inst, 16777619);
        sigB = Math.imul(sigB ^ (inst >>> 11), 16777619);
        const nextPc = (pc + 4) | 0;
        const op = (inst >>> 24) & 0x3F;
        const rd = (inst >>> 20) & 0x0F;
        const ra = (inst >>> 16) & 0x0F;
        const rb = (inst >>> 12) & 0x0F;
        const imm16 = (inst << 16) >> 16;
        const uimm16 = inst & 0xFFFF;

        switch (op) {
          case 0x00:
            break;
          case 0x01:
            if (rd !== ra) { getReg(ra, trace); setReg(rd, trace); }
            break;
          case 0x02:
            pushConst(imm16, trace); setReg(rd, trace);
            break;
          case 0x03:
            pushConst(uimm16, trace); setReg(rd, trace);
            break;
          case 0x04:
            getReg(rd, trace);
            pushConst(0xFFFF, trace); trace.push(0x71);
            pushConst(uimm16 << 16, trace); trace.push(0x72);
            setReg(rd, trace);
            break;
          case 0x05:
          case 0x06:
          case 0x07:
          case 0x0C:
          case 0x0D:
          case 0x0E:
          case 0x0F:
          case 0x10:
          case 0x11: {
            getReg(ra, trace);
            getReg(rb, trace);
            if (op === 0x0F || op === 0x10 || op === 0x11) {
              pushConst(31, trace); trace.push(0x71);
            }
            const wasmOp = {
              0x05: 0x6A, 0x06: 0x6B, 0x07: 0x6C,
              0x0C: 0x71, 0x0D: 0x72, 0x0E: 0x73,
              0x0F: 0x74, 0x10: 0x76, 0x11: 0x75
            }[op];
            trace.push(wasmOp);
            setReg(rd, trace);
            break;
          }
          case 0x12:
          case 0x13:
            getReg(ra, trace);
            pushConst(imm16, trace);
            trace.push(op === 0x12 ? 0x6A : 0x6B);
            setReg(rd, trace);
            break;
          case 0x14:
          case 0x15:
          case 0x16:
            getReg(ra, trace);
            pushConst(uimm16, trace);
            trace.push(op === 0x14 ? 0x71 : (op === 0x15 ? 0x72 : 0x73));
            setReg(rd, trace);
            break;
          case 0x17:
          case 0x18:
          case 0x19:
            getReg(ra, trace);
            pushConst(uimm16 & 31, trace);
            trace.push(op === 0x17 ? 0x74 : (op === 0x18 ? 0x76 : 0x75));
            setReg(rd, trace);
            break;
          case 0x1A:
            getReg(ra, trace); trace.push(0x21, L_A);
            getReg(rb, trace); trace.push(0x21, L_B);
            trace.push(0x20, L_A, 0x20, L_B, 0x46);
            trace.push(0x20, L_A, 0x20, L_B, 0x48);
            pushConst(1, trace); trace.push(0x74, 0x72);
            trace.push(0x20, L_A, 0x20, L_B, 0x49);
            pushConst(2, trace); trace.push(0x74, 0x72);
            setReg(L_FLAGS, trace);
            break;
          case 0x1B:
            getReg(ra, trace); trace.push(0x21, L_A);
            pushConst(imm16, trace); trace.push(0x21, L_B);
            trace.push(0x20, L_A, 0x20, L_B, 0x46);
            trace.push(0x20, L_A, 0x20, L_B, 0x48);
            pushConst(1, trace); trace.push(0x74, 0x72);
            trace.push(0x20, L_A, 0x20, L_B, 0x49);
            pushConst(2, trace); trace.push(0x74, 0x72);
            setReg(L_FLAGS, trace);
            break;
          case 0x1C:
          case 0x1D:
          case 0x1E:
          case 0x1F:
          case 0x20:
            getReg(ra, trace);
            if (imm16 !== 0) { pushConst(imm16, trace); trace.push(0x6A); }
            pushConst(0xFFFFF, trace); trace.push(0x71);
            if (op === 0x1C) trace.push(0x2D, 0x00, 0x00);
            else if (op === 0x1D) trace.push(0x2C, 0x00, 0x00);
            else if (op === 0x1E) trace.push(0x2F, 0x00, 0x00);
            else if (op === 0x1F) trace.push(0x2E, 0x00, 0x00);
            else trace.push(0x28, 0x00, 0x00);
            setReg(rd, trace);
            break;
          case 0x21:
          case 0x22:
          case 0x23:
            getReg(ra, trace);
            if (imm16 !== 0) { pushConst(imm16, trace); trace.push(0x6A); }
            pushConst(0xFFFFF, trace); trace.push(0x71);
            if (ra !== 13 && ra !== 14) {
              trace.push(0x22, L_A);
            }
            getReg(rd, trace);
            if (op === 0x21) trace.push(0x3A, 0x00, 0x00);
            else if (op === 0x22) trace.push(0x3B, 0x00, 0x00);
            else trace.push(0x36, 0x00, 0x00);
            if (ra !== 13 && ra !== 14) {
              hasStore = true;
              trace.push(0x20, L_A);
              pushConst(0x050000, trace);
              trace.push(0x49, 0x20, L_DIRTY, 0x72, 0x21, L_DIRTY);
            }
            break;
          case 0x24:
            getReg(14, trace);
            pushConst(4, trace);
            trace.push(0x6B);
            teeReg(14, trace);
            pushConst(0xFFFFF, trace);
            trace.push(0x71);
            getReg(rd, trace);
            trace.push(0x36, 0x00, 0x00);
            break;
          case 0x25:
            getReg(14, trace);
            trace.push(0x22, L_A);
            pushConst(0xFFFFF, trace);
            trace.push(0x71);
            trace.push(0x28, 0x00, 0x00);
            trace.push(0x21, L_B);
            trace.push(0x20, L_A);
            pushConst(4, trace);
            trace.push(0x6A);
            setReg(14, trace);
            trace.push(0x20, L_B);
            setReg(rd, trace);
            break;
          case 0x36:
            markRead(L_FLAGS);
            trace.push(0x20, L_FLAGS);
            switch (uimm16) {
              case 0: pushConst(1, trace); trace.push(0x71, 0x45, 0x45); break;
              case 1: pushConst(1, trace); trace.push(0x71, 0x45); break;
              case 2: pushConst(2, trace); trace.push(0x71, 0x45, 0x45); break;
              case 3: pushConst(2, trace); trace.push(0x71, 0x45); break;
              case 4: pushConst(3, trace); trace.push(0x71, 0x45, 0x45); break;
              case 5: pushConst(3, trace); trace.push(0x71, 0x45); break;
              case 6: pushConst(4, trace); trace.push(0x71, 0x45, 0x45); break;
              case 7: pushConst(4, trace); trace.push(0x71, 0x45); break;
              case 8: pushConst(5, trace); trace.push(0x71, 0x45, 0x45); break;
              case 9: pushConst(5, trace); trace.push(0x71, 0x45); break;
              default: trace.push(0x1A); pushConst(0, trace); break;
            }
            setReg(rd, trace);
            break;
          case 0x27:
          case 0x28:
          case 0x29:
          case 0x2A:
          case 0x2B:
          case 0x2C:
          case 0x30:
          case 0x31:
          case 0x32:
          case 0x33: {
            const target = inst & 0x00FFFFFF;
            count++;
            pushBranchCond(op, trace);
            trace.push(0x04, 0x40);
            if (target === startPc) {
              hasSelfLoop = true;
              trace.push(0x20, L_STEPS); pushConst(count, trace); trace.push(0x6A, 0x21, L_STEPS);
              trace.push(0x20, L_ITERS); pushConst(1, trace); trace.push(0x6B, 0x22, L_ITERS);
              trace.push(0x0D, 1);
            }
            emitExit(target, count, 2, trace);
            trace.push(0x0B);
            pc = nextPc;
            continue;
          }
          case 0x26: {
            const target = inst & 0x00FFFFFF;
            count++;
            if (target === startPc) {
              hasSelfLoop = true;
              trace.push(0x20, L_STEPS); pushConst(count, trace); trace.push(0x6A, 0x21, L_STEPS);
              trace.push(0x20, L_ITERS); pushConst(1, trace); trace.push(0x6B, 0x22, L_ITERS);
              trace.push(0x0D, 0);
            } else if (target > pc && count < 56) {
              pc = target;
              continue;
            }
            emitExit(target, count, 1, trace);
            ended = true;
            terminated = true;
            continue;
          }
          case 0x2D: {
            const target = inst & 0x00FFFFFF;
            count++;
            pushConst(nextPc, trace);
            setReg(15, trace);
            emitExit(target, count, 1, trace);
            ended = true;
            terminated = true;
            continue;
          }
          case 0x2E:
            count++;
            getReg(15, trace);
            trace.push(0x21, L_EXIT_PC);
            trace.push(0x20, L_STEPS);
            pushConst(count, trace);
            trace.push(0x6A, 0x21, L_STEPS);
            trace.push(0x0C, 1);
            ended = true;
            terminated = true;
            continue;
          case 0x34:
            count++;
            getReg(rd, trace);
            trace.push(0x21, L_EXIT_PC);
            pushConst(nextPc, trace);
            setReg(15, trace);
            trace.push(0x20, L_STEPS);
            pushConst(count, trace);
            trace.push(0x6A, 0x21, L_STEPS);
            trace.push(0x0C, 1);
            ended = true;
            terminated = true;
            continue;
          case 0x35:
            count++;
            getReg(rd, trace);
            trace.push(0x21, L_EXIT_PC);
            trace.push(0x20, L_STEPS);
            pushConst(count, trace);
            trace.push(0x6A, 0x21, L_STEPS);
            trace.push(0x0C, 1);
            ended = true;
            terminated = true;
            continue;
          default:
            ended = true;
            continue;
        }
        pc = nextPc;
        count++;
      }

      if (count === 0) return null;

      const cacheKey = startPc + ":" + sigA + ":" + sigB + ":" + count;
      let cached = this.wasmCache.get(cacheKey);
      if (cached) {
        this.blockTable[startPc >>> 2] = cached;
        this.compiledCount++;
        return cached;
      }

      if (!terminated) {
        emitExit(pc, count, 1, trace);
      }

      const loadMask = readRegs | writtenRegs;
      const body = [];
      body.push(1, 23, 0x7F);

      for (let r = 0; r < 16; r++) {
        if (loadMask & (1 << r)) {
          pushConst(0x100000 + (r << 2), body);
          body.push(0x28, 0x02, 0x00, 0x21, r);
        }
      }
      if (loadMask & (1 << L_FLAGS)) {
        pushConst(0x100044, body);
        body.push(0x28, 0x02, 0x00, 0x21, L_FLAGS);
      }
      if (hasSelfLoop) {
        pushConst(512, body);
        body.push(0x21, L_ITERS);
      }

      body.push(0x02, 0x40, 0x03, 0x40);
      for (let i = 0; i < trace.length; i++) body.push(trace[i]);
      body.push(0x0B, 0x0B);

      for (let r = 0; r < 16; r++) {
        if (writtenRegs & (1 << r)) {
          pushConst(0x100000 + (r << 2), body);
          body.push(0x20, r, 0x36, 0x02, 0x00);
        }
      }
      if (writtenRegs & (1 << L_FLAGS)) {
        pushConst(0x100044, body);
        body.push(0x20, L_FLAGS, 0x36, 0x02, 0x00);
      }
      if (hasStore) {
        pushConst(0x100048, body);
        body.push(0x20, L_DIRTY, 0x36, 0x02, 0x00);
      }
      pushConst(0x100040, body);
      body.push(0x20, L_EXIT_PC, 0x36, 0x02, 0x00);
      body.push(0x20, L_STEPS, 0x0B);

      const wasm = [0x00, 0x61, 0x73, 0x6D, 0x01, 0x00, 0x00, 0x00];
      emitSection(1, [1, 0x60, 0, 1, 0x7F], wasm);
      emitSection(2, [1, 1, 101, 1, 109, 0x02, 0x00, 17], wasm);
      emitSection(3, [1, 0], wasm);
      emitSection(7, [1, 1, 114, 0x00, 0], wasm);
      const codeSec = [1];
      encodeULEB128(body.length, codeSec);
      for (let i = 0; i < body.length; i++) codeSec.push(body[i]);
      emitSection(10, codeSec, wasm);

      const mod = new WebAssembly.Module(new Uint8Array(wasm));
      const inst = new WebAssembly.Instance(mod, { e: { m: this.wasmMem } });
      const block = { fn: inst.exports.r };
      this.wasmCache.set(cacheKey, block);
      this.blockTable[startPc >>> 2] = block;
      this.compiledCount++;
      return block;
    }
  }

  class TabCompCPU {
    constructor(fsController) {
      this.wasmMem = (typeof WebAssembly !== "undefined" && WebAssembly.Memory)
        ? new WebAssembly.Memory({ initial: 17 })
        : null;
      const memBuf = this.wasmMem ? this.wasmMem.buffer : new ArrayBuffer(1114112);
      this.ram = new Uint8Array(memBuf, 0, 1048576);
      this.ramDV = new DataView(memBuf, 0, 1048576);
      this.ram32 = new Int32Array(memBuf, 0, 262144);
      this.reg = new Int32Array(memBuf, 0x100000, 16);
      this.state32 = new Int32Array(memBuf, 0x100040, 4);
      this.presentBuf = new Uint8Array(64000);
      this.frameReady = false;
      this.presentCount = 0;
      this.lastYieldTime = (typeof performance !== "undefined" ? performance.now() : Date.now());
      this.pc = 0;
      this.flags = 0;
      this.halted = false;
      this.yielded = false;
      this.exitCode = 0;
      this.fs = fsController;
      this.cwd = '/home';
      this.bootTime = Date.now();
      this.vsyncCount = 0;
      this.keyQueue = [];
      this.procStack = [];
      this.lastMips = 35.0;
      this.peakMips = 200.0;
      this.runMips = 180.0;
      this.jitEnabled = 0;
      this.jitInstCount = 0;
      this.interpInstCount = 0;
      this.hwAssertOk = true;
      this.hwAssertMsg = "";
      this.hooks = {};
      this.jit = this.wasmMem ? new TabCompWasmJIT(this) : null;
    }

    presentNow() {
      this.presentBuf.set(this.ram.subarray(0x0F0000, 0x0F0000 + 64000));
      this.frameReady = true;
      this.presentCount = (this.presentCount + 1) | 0;
      this.lastYieldTime = (typeof performance !== "undefined" ? performance.now() : Date.now());
    }

    presentFallbackIfStale(now) {
      if ((now - this.lastYieldTime) > 100) {
        this.presentNow();
      }
    }

    readStr(addr) {
      let s = '';
      while (addr >= 0 && addr < 1048576) {
        const b = this.ram[addr++];
        if (b === 0) break;
        s += String.fromCharCode(b);
      }
      return s;
    }

    writeStr(addr, str, maxLen = 256) {
      const n = Math.min(str.length, maxLen - 1);
      for (let i = 0; i < n; i++) {
        this.ram[addr + i] = str.charCodeAt(i) & 0xFF;
      }
      this.ram[addr + n] = 0;
      return n;
    }

    loadBinary(bytes, argStr = '') {
      if (this.jit) this.jit.invalidateAll();
      this.ram.fill(0, 0, 0x0E0000);
      this.ram.set(bytes, 0);
      this.writeStr(0x0DF000, argStr, 1024);
      this.reg.fill(0);
      this.reg[13] = 0x0DF000;
      this.reg[14] = 0x0DF000;
      this.ramDV.setUint32(0x0DF800, 0x2F000000, true);
      this.reg[15] = 0x0DF800;
      this.pc = 0;
      this.flags = 0;
      this.halted = false;
      this.yielded = false;
    }

    stepInterp(maxSteps) {
      const reg = this.reg;
      const ram = this.ram;
      const dv = this.ramDV;
      let pc = this.pc;
      let flags = this.flags;
      let steps = 0;

      while (steps < maxSteps && !this.halted) {
        const inst = dv.getUint32(pc, true);
        pc = (pc + 4) | 0;
        steps++;

        const op = (inst >>> 24) & 0x3F;
        const rd = (inst >>> 20) & 0x0F;
        const ra = (inst >>> 16) & 0x0F;
        const rb = (inst >>> 12) & 0x0F;
        const imm16 = (inst << 16) >> 16;
        const uimm16 = inst & 0xFFFF;

        switch (op) {
          case 0x00:
            break;
          case 0x01:
            reg[rd] = reg[ra];
            break;
          case 0x02:
            reg[rd] = imm16;
            break;
          case 0x03:
            reg[rd] = uimm16;
            break;
          case 0x04:
            reg[rd] = (reg[rd] & 0xFFFF) | (uimm16 << 16);
            break;
          case 0x05:
            reg[rd] = (reg[ra] + reg[rb]) | 0;
            break;
          case 0x06:
            reg[rd] = (reg[ra] - reg[rb]) | 0;
            break;
          case 0x07:
            reg[rd] = Math.imul(reg[ra], reg[rb]);
            break;
          case 0x08:
            reg[rd] = reg[rb] === 0 ? 0 : (reg[ra] / reg[rb]) | 0;
            break;
          case 0x09:
            reg[rd] = reg[rb] === 0 ? 0 : (reg[ra] % reg[rb]) | 0;
            break;
          case 0x0A:
            reg[rd] = reg[rb] === 0 ? 0 : ((reg[ra] >>> 0) / (reg[rb] >>> 0)) | 0;
            break;
          case 0x0B:
            reg[rd] = reg[rb] === 0 ? 0 : ((reg[ra] >>> 0) % (reg[rb] >>> 0)) | 0;
            break;
          case 0x0C:
            reg[rd] = reg[ra] & reg[rb];
            break;
          case 0x0D:
            reg[rd] = reg[ra] | reg[rb];
            break;
          case 0x0E:
            reg[rd] = reg[ra] ^ reg[rb];
            break;
          case 0x0F:
            reg[rd] = reg[ra] << (reg[rb] & 31);
            break;
          case 0x10:
            reg[rd] = reg[ra] >>> (reg[rb] & 31);
            break;
          case 0x11:
            reg[rd] = reg[ra] >> (reg[rb] & 31);
            break;
          case 0x12:
            reg[rd] = (reg[ra] + imm16) | 0;
            break;
          case 0x13:
            reg[rd] = (reg[ra] - imm16) | 0;
            break;
          case 0x14:
            reg[rd] = reg[ra] & uimm16;
            break;
          case 0x15:
            reg[rd] = reg[ra] | uimm16;
            break;
          case 0x16:
            reg[rd] = reg[ra] ^ uimm16;
            break;
          case 0x17:
            reg[rd] = reg[ra] << (uimm16 & 31);
            break;
          case 0x18:
            reg[rd] = reg[ra] >>> (uimm16 & 31);
            break;
          case 0x19:
            reg[rd] = reg[ra] >> (uimm16 & 31);
            break;
          case 0x1A: {
            const a = reg[ra], b = reg[rb];
            const ua = a >>> 0, ub = b >>> 0;
            let f = 0;
            if (a === b) f |= 1;
            if (a < b) f |= 2;
            if (ua < ub) f |= 4;
            flags = f;
            break;
          }
          case 0x1B: {
            const a = reg[ra], b = imm16;
            const ua = a >>> 0, ub = b >>> 0;
            let f = 0;
            if (a === b) f |= 1;
            if (a < b) f |= 2;
            if (ua < ub) f |= 4;
            flags = f;
            break;
          }
          case 0x1C:
            reg[rd] = ram[(reg[ra] + imm16) & 0xFFFFF];
            break;
          case 0x1D:
            reg[rd] = (ram[(reg[ra] + imm16) & 0xFFFFF] << 24) >> 24;
            break;
          case 0x1E:
            reg[rd] = dv.getUint16((reg[ra] + imm16) & 0xFFFFF, true);
            break;
          case 0x1F:
            reg[rd] = dv.getInt16((reg[ra] + imm16) & 0xFFFFF, true);
            break;
          case 0x20:
            reg[rd] = dv.getInt32((reg[ra] + imm16) & 0xFFFFF, true);
            break;

          case 0x22: {
            const addr = (reg[ra] + imm16) & 0xFFFFF;
            dv.setUint16(addr, reg[rd] & 0xFFFF, true);
            if (this.jitEnabled && addr < 0x050000 && this.jit) this.jit.invalidateAll();

          }
          case 0x23: {
            const addr = (reg[ra] + imm16) & 0xFFFFF;
            dv.setInt32(addr, reg[rd], true);

          case 0x25:

            break;

            pc = inst & 0x00FFFFFF;
            break;
          case 0x27:
            if (flags & 1) pc = inst & 0x00FFFFFF;
            break;
          case 0x28:
            if (!(flags & 1)) pc = inst & 0x00FFFFFF;
            break;
          case 0x29:
            if (flags & 2) pc = inst & 0x00FFFFFF;
            break;
          case 0x2A:
            if (!(flags & 2)) pc = inst & 0x00FFFFFF;
            break;
          case 0x2B:
            if (flags & 3) pc = inst & 0x00FFFFFF;
            break;
          case 0x2C:
            if (!(flags & 3)) pc = inst & 0x00FFFFFF;
            break;
          case 0x2D:

            pc = inst & 0x00FFFFFF;
            break;
          case 0x2E:
            pc = reg[15];
            break;

          case 0x30:
            if (flags & 4) pc = inst & 0x00FFFFFF;
            break;
          case 0x31:
            if (!(flags & 4)) pc = inst & 0x00FFFFFF;
            break;
          case 0x32:
            if (flags & 5) pc = inst & 0x00FFFFFF;
            break;
          case 0x33:
            if (!(flags & 5)) pc = inst & 0x00FFFFFF;
            break;
          case 0x34:
            reg[15] = pc;
            pc = reg[rd];
            break;
          case 0x35:
            pc = reg[rd];
            break;
          case 0x36:
            switch (uimm16) {
              case 0: reg[rd] = (flags & 1) ? 1 : 0; break;
              case 1: reg[rd] = !(flags & 1) ? 1 : 0; break;
              case 2: reg[rd] = (flags & 2) ? 1 : 0; break;
              case 3: reg[rd] = !(flags & 2) ? 1 : 0; break;
              case 4: reg[rd] = (flags & 3) ? 1 : 0; break;
              case 5: reg[rd] = !(flags & 3) ? 1 : 0; break;
              case 6: reg[rd] = (flags & 4) ? 1 : 0; break;
              case 7: reg[rd] = !(flags & 4) ? 1 : 0; break;
              case 8: reg[rd] = (flags & 5) ? 1 : 0; break;
              case 9: reg[rd] = !(flags & 5) ? 1 : 0; break;
            }
            break;
          default:
            this.halted = true;
            break;
        }
      }

      this.pc = pc;
      this.flags = flags;
      return steps;
    }

    stepBatch(maxSteps) {

        const n = this.stepInterp(maxSteps);

        if (blk === undefined) {
          const c = (hotCounts[idx] + 1) & 0xFFFF;
          hotCounts[idx] = c;

        if (blk) {
          state32[0] = pc;
          state32[1] = this.flags;
          state32[2] = 0;
          const ran = blk.fn();

          this.flags = state32[1];
          if (state32[2]) jit.invalidateAll();
          steps += ran;
          this.jitInstCount += ran;
        } else {
          const ran = this.stepInterp(1);
          steps += ran;
          this.interpInstCount += ran;

    handleSys(num) {

      switch (num) {

          const code = r[0];

            if (this.jit) this.jit.invalidateAll();
            this.ram.set(saved.ram, 0);
            this.reg.set(saved.reg);
            this.pc = saved.pc;
            this.flags = saved.flags;
            this.reg[0] = code;
          } else {
            this.exitCode = code;
            this.halted = true;
          }

        }
        case 1: { // OPEN(path_ptr, mode) -> fd
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const mode = r[1];
          if (mode === 0) {
            const data = this.fs.readFile(path);
            if (!data) { r[0] = -1; break; }
            const fd = this.fs.nextFd++;
            this.fs.fds.set(fd, { path, mode: 0, pos: 0, data: new Uint8Array(data) });
            r[0] = fd;
          } else {
            const fd = this.fs.nextFd++;
            this.fs.fds.set(fd, { path, mode: 1, pos: 0, chunks: [], len: 0 });
            r[0] = fd;
          }
          break;
        }
        case 2: { // READ(fd, buf_ptr, len) -> bytes_read
          const desc = this.fs.fds.get(r[0]);
          if (!desc || desc.mode !== 0) { r[0] = -1; break; }
          const buf = r[1];
          const len = r[2];
          const avail = Math.max(0, Math.min(len, desc.data.length - desc.pos));
          for (let i = 0; i < avail; i++) {
            this.ram[(buf + i) & 0xFFFFF] = desc.data[desc.pos + i];
          }
          desc.pos += avail;
          r[0] = avail;
          break;
        }
        case 3: { // WRITE(fd, buf_ptr, len) -> bytes_written
          const fd = r[0];
          const buf = r[1];
          const len = r[2];
          if (fd === 1 || fd === 2) {
            if (this.hooks.onStdout) {
              let s = '';
              for (let i = 0; i < len; i++) s += String.fromCharCode(this.ram[(buf + i) & 0xFFFFF]);
              this.hooks.onStdout(s);
            }
            r[0] = len;
            break;
          }
          const desc = this.fs.fds.get(fd);
          if (!desc || desc.mode !== 1) { r[0] = -1; break; }
          const chunk = new Uint8Array(len);
          for (let i = 0; i < len; i++) chunk[i] = this.ram[(buf + i) & 0xFFFFF];
          desc.chunks.push(chunk);
          desc.len += len;
          r[0] = len;
          break;
        }
        case 4: { // CLOSE(fd) -> 0
          const fd = r[0];
          const desc = this.fs.fds.get(fd);
          if (!desc) { r[0] = -1; break; }
          if (desc.mode === 1) {
            const merged = new Uint8Array(desc.len);
            let off = 0;
            for (const c of desc.chunks) { merged.set(c, off); off += c.length; }
            this.fs.writeFile(desc.path, merged);
          }
          this.fs.fds.delete(fd);
          r[0] = 0;
          break;
        }
        case 5: { // LIST(dir_ptr, idx, name_out_ptr, is_dir_ptr, size_ptr) -> 1 or 0
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const idx = r[1];
          const entries = this.fs.list(path);
          if (!entries || idx < 0 || idx >= entries.length) {
            r[0] = 0;
            break;
          }
          const e = entries[idx];
          if (r[2]) this.writeStr(r[2], e.name, 32);
          if (r[3]) this.ramDV.setInt32(r[3] & 0xFFFFF, e.isDir, true);
          if (r[4]) this.ramDV.setInt32(r[4] & 0xFFFFF, e.size, true);
          r[0] = 1;
          break;
        }
        case 6: { // MKDIR(path_ptr)
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          r[0] = this.fs.mkdir(path);
          break;
        }
        case 7: { // DELETE(path_ptr)
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          r[0] = this.fs.unlink(path);
          break;
        }
        case 8: { // STAT(path_ptr, size_ptr, is_dir_ptr) -> 0 if exists, -1 if not
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const st = this.fs.stat(path);
          if (!st) { r[0] = -1; break; }
          if (r[1]) this.ramDV.setInt32(r[1] & 0xFFFFF, st.size, true);
          if (r[2]) this.ramDV.setInt32(r[2] & 0xFFFFF, st.isDir, true);
          r[0] = 0;
          break;
        }
        case 9: { // EXEC(bin_path_ptr, arg_str_ptr) -> exit_code
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const argStr = r[1] ? this.readStr(r[1]) : '';
          const bin = this.fs.readFile(path);
          if (!bin) { r[0] = -1; break; }

            ram: this.ram.slice(0, 0x0E0000),
            reg: new Int32Array(this.reg),
            pc: this.pc,
            flags: this.flags

          this.loadBinary(bin, argStr);
          break;
        }
        case 10: // YIELD() -> copies live VRAM to tear-free presentBuf
          this.yielded = true;
          this.presentNow();
          if (this.hooks.onYield) this.hooks.onYield();
          break;

          if (this.keyQueue.length > 0) {
            r[0] = this.keyQueue.shift();
          } else {
            r[0] = 0;
          }
          break;

          r[0] = (Date.now() - this.bootTime) | 0;
          break;

          if (this.hooks.onSave) this.hooks.onSave();
          r[0] = 0;
          break;
        case 14: { // EXPORT(bin_path_ptr, title_ptr)
          const binPath = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const title = this.readStr(r[1]);
          if (this.hooks.onExport) r[0] = this.hooks.onExport(binPath, title);
          else r[0] = 0;
          break;
        }
        case 15: { // REBOOTSTRAP() -> 0 if stage1==stage2==stage3, 2 if stage2==stage3
          if (this.hooks.onRebootstrap) r[0] = this.hooks.onRebootstrap();
          else r[0] = 0;
          break;
        }
        case 16: { // SELFTEST(report_buf_ptr) -> failed_count
          if (this.hooks.onSelftest) r[0] = this.hooks.onSelftest(r[0]);
          else r[0] = 0;
          break;
        }
        case 17: { // MIPS([report_buf_ptr]) -> MIPS * 10
          if (this.hooks.onMips) r[0] = this.hooks.onMips(r[0]);
          else r[0] = (this.lastMips * 10) | 0;
          break;

        case 18: { // CHDIR(path_ptr) -> 0 or -1
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const st = this.fs.stat(path);
          if (st && st.isDir) {
            this.cwd = path;
            r[0] = 0;
          } else {
            r[0] = -1;
          }
          break;
        }
        case 19: { // GETCWD(buf_ptr) -> 0
          this.writeStr(r[0], this.cwd, 128);
          r[0] = 0;
          break;
        }
        case 20: { // GETARGS(buf_ptr) -> 0
          const args = this.readStr(0x0DF000);
          this.writeStr(r[0], args, 512);
          r[0] = 0;
          break;
        }
        case 21: { // JIT(mode) -> 0:off, 1:on, -1:query
          if (r[0] === 0 || r[0] === 1) {
            this.jitEnabled = r[0];
            if (this.hooks.onJitToggle) this.hooks.onJitToggle(r[0]);
          }
          r[0] = this.jitEnabled;
          break;
        }
        default:
          r[0] = -1;
          break;
      }
    }
  }

// Exact 1-to-1 algorithmic match with /src/cc.tt so stage1 == stage2 == stage3 byte-for-byte!

const TK_EOF = 0;
const TK_NUM = 1;
const TK_IDENT = 2;
const TK_STR = 3;

const TK_INT = 10;
const TK_BYTE = 11;
const TK_STRUCT = 12;
const TK_IF = 13;
const TK_ELSE = 14;
const TK_WHILE = 15;
const TK_FOR = 16;
const TK_RETURN = 17;
const TK_BREAK = 18;
const TK_CONTINUE = 19;
const TK_IMPORT = 20;
const TK_SYS = 21;

const TK_NE = 257;    // !=

  function emitLoadImm(rd, val) {

    if (v >= -32768 && v <= 32767) {
      emitI(0x02, rd, 0, v & 0xFFFF); // LDI
    } else if (v >= 0 && v <= 65535) {

  // Lexer state
  let lexPos = 0;
  let tok = 0;
  let tokVal = 0;
  let tokStr = '';
  const tokBytes = new Uint8Array(512);
  let tokBytesLen = 0;
  let lineNum = 1;

  function isAlpha(c) {
    return (c >= 65 && c <= 90) || (c >= 97 && c <= 122) || c === 95;
  }
  function isDigit(c) {
    return c >= 48 && c <= 57;
  }
  function isHex(c) {
    return isDigit(c) || (c >= 65 && c <= 70) || (c >= 97 && c <= 102);
  }
  function hexVal(c) {

    if (c >= 65 && c <= 70) return c - 55;

  function readEscape() {

    if (c === 114) return 13; // \r

    if (c === 48) return 0;   // \0
    if (c === 92) return 92;  // \\
    if (c === 34) return 34;  // \"
    if (c === 39) return 39;  // \'
    if (c === 120) {          // \xHH

      const h2 = hexVal(src[lexPos++]);

    }
    return c;
  }

  function nextToken() {
    while (lexPos < srcLen) {
      const c = src[lexPos];
      if (c === 32 || c === 9 || c === 13) {
        lexPos++;
        continue;
      }
      if (c === 10) {
        lineNum++;
        lexPos++;
        continue;
      }
      if (c === 47 && src[lexPos + 1] === 47) { // //
        lexPos += 2;
        while (lexPos < srcLen && src[lexPos] !== 10) lexPos++;
        continue;
      }
      if (c === 47 && src[lexPos + 1] === 42) { // /*
        lexPos += 2;
        while (lexPos < srcLen && !(src[lexPos] === 42 && src[lexPos + 1] === 47)) {
          if (src[lexPos] === 10) lineNum++;
          lexPos++;
        }
        if (lexPos < srcLen) lexPos += 2;
        continue;
      }
      break;
    }

    if (lexPos >= srcLen) {
      tok = TK_EOF;
      return;
    }

    const c = src[lexPos];

    if (isAlpha(c)) {
      let s = '';
      while (lexPos < srcLen && (isAlpha(src[lexPos]) || isDigit(src[lexPos]))) {
        s += String.fromCharCode(src[lexPos++]);
      }
      tokStr = s;
      if (s === 'int') { tok = TK_INT; return; }
      if (s === 'byte') { tok = TK_BYTE; return; }
      if (s === 'struct') { tok = TK_STRUCT; return; }
      if (s === 'if') { tok = TK_IF; return; }
      if (s === 'else') { tok = TK_ELSE; return; }
      if (s === 'while') { tok = TK_WHILE; return; }
      if (s === 'for') { tok = TK_FOR; return; }
      if (s === 'return') { tok = TK_RETURN; return; }
      if (s === 'break') { tok = TK_BREAK; return; }
      if (s === 'continue') { tok = TK_CONTINUE; return; }
      if (s === 'import') { tok = TK_IMPORT; return; }
      if (s === 'sys') { tok = TK_SYS; return; }
      if (s === 'const') { tok = TK_CONST; return; }
      for (let i = constCount - 1; i >= 0; i--) {
        if (constName[i] === s) {
          tok = TK_NUM;
          tokVal = constVal[i];
          return;
        }
      }
      tok = TK_IDENT;
      return;
    }

    if (isDigit(c)) {
      let v = 0;
      if (c === 48 && (src[lexPos + 1] === 120 || src[lexPos + 1] === 88)) {
        lexPos += 2;
        while (lexPos < srcLen && isHex(src[lexPos])) {

        }
      } else {

        }
      }
      tok = TK_NUM;
      tokVal = v | 0;
      return;
    }

    if (c === 39) { // '\''
      lexPos++;
      let v = src[lexPos++];

      tokVal = v;
      return;

      lexPos++;
      tokBytesLen = 0;

    const c2 = src[lexPos + 1];
    if (c === 61 && c2 === 61) { lexPos += 2; tok = 256; return; }
    if (c === 33 && c2 === 61) { lexPos += 2; tok = 257; return; }
    if (c === 60 && c2 === 61) { lexPos += 2; tok = 258; return; }
    if (c === 62 && c2 === 61) { lexPos += 2; tok = 259; return; }
    if (c === 60 && c2 === 60) { lexPos += 2; tok = 260; return; }
    if (c === 62 && c2 === 62) { lexPos += 2; tok = 261; return; }
    if (c === 38 && c2 === 38) { lexPos += 2; tok = 262; return; }
    if (c === 124 && c2 === 124) { lexPos += 2; tok = 263; return; }
    if (c === 43 && c2 === 43) { lexPos += 2; tok = 264; return; }
    if (c === 45 && c2 === 45) { lexPos += 2; tok = 265; return; }
    if (c === 43 && c2 === 61) { lexPos += 2; tok = 266; return; }
    if (c === 45 && c2 === 61) { lexPos += 2; tok = 267; return; }
    if (c === 45 && c2 === 62) { lexPos += 2; tok = 268; return; }

    tok = c;

  function expect(t) {

    }
    nextToken();

  // Symbol tables
  const constName = [];
  const constVal = [];
  let constCount = 0;

  const structName = [];
  const structSize = [];
  let structCount = 0;

  const fieldStructIdx = [];
  const fieldName = [];
  const fieldType = [];
  const fieldPtr = [];
  const fieldOffset = [];
  const fieldIsArr = [];
  let fieldCount = 0;

  const gName = [];
  const gType = [];
  const gPtr = [];
  const gStruct = [];
  const gIsArr = [];
  const gAddr = [];
  let gCount = 0;
  let gNextAddr = 0x050000;

  const lName = [];
  const lType = [];
  const lPtr = [];
  const lStruct = [];
  const lIsArr = [];
  const lOffset = [];
  let lCount = 0;
  let curLocalOffset = -4;

  const fnName = [];
  const fnAddr = [];
  const fnDefined = [];
  const fnRetType = [];
  const fnRetPtr = [];
  const fnRetStruct = [];
  let fnCount = 0;

  const fixupCodeAddr = [];
  const fixupFnIdx = [];
  let fixupCount = 0;

  const breakPatchAddr = new Int32Array(256);
  const breakLoopDepth = new Int32Array(256);
  let breakCount = 0;
  const contTargetAddr = new Int32Array(64);
  const contPatchAddr = new Int32Array(256);
  const contLoopDepth = new Int32Array(256);
  let contCount = 0;
  let loopDepth = 0;

  let exprType = TY_INT;
  let exprPtr = 0;
  let exprStruct = -1;
  let exprIsLval = 0;

  function typeSize(baseType, ptrDepth, sIdx) {
    if (ptrDepth > 0) return 4;
    if (baseType === TY_BYTE) return 1;
    if (baseType === TY_STRUCT) return structSize[sIdx];
    return 4;
  }

  function derefSize(baseType, ptrDepth, sIdx) {
    if (ptrDepth > 1) return 4;
    if (baseType === TY_BYTE) return 1;
    if (baseType === TY_STRUCT) return structSize[sIdx];
    return 4;
  }

  function rvalLoad() {

      } else {
        emitI(0x20, 0, 0, 0); // LDW R0, [R0 + 0]

      exprIsLval = 0;
    }
  }

  function findStruct(name) {
    for (let i = 0; i < structCount; i++) {
      if (structName[i] === name) return i;
    }
    throw new Error(`Line ${lineNum}: unknown struct ${name}`);
  }

  function findFn(name) {
    for (let i = 0; i < fnCount; i++) {
      if (fnName[i] === name) return i;
    }
    return -1;
  }

  let parsedBaseType = TY_INT;
  let parsedPtr = 0;
  let parsedStruct = -1;

  function isTypeStart() {
    return tok === TK_INT || tok === TK_BYTE || tok === TK_STRUCT;
  }

  function parseType() {
    parsedPtr = 0;
    parsedStruct = -1;
    if (tok === TK_INT) {
      parsedBaseType = TY_INT;
      nextToken();
    } else if (tok === TK_BYTE) {
      parsedBaseType = TY_BYTE;
      nextToken();
    } else if (tok === TK_STRUCT) {
      parsedBaseType = TY_STRUCT;
      nextToken();
      parsedStruct = findStruct(tokStr);

  function parseExpr() {
    parseAssign();
  }

  function emitStoreLval() {

  function parseAssign() {

      const lhsType = exprType;
      const lhsPtr = exprPtr;
      const lhsStruct = exprStruct;

      if (op === 61) {

        exprPtr = lhsPtr;
        exprStruct = lhsStruct;

        emitI(0x25, 1, 0, 0); // POP R1

        exprPtr = lhsPtr;
        exprStruct = lhsStruct;

        exprIsLval = 0;

  function parseCond() {
    parseLogOr();

      nextToken();
      emitI(0x1B, 0, 0, 0); // CMPI R0, 0

      emitJ(0x27, 0); // JZ false
      parseExpr();
      rvalLoad();
      const tType = exprType;
      const tPtr = exprPtr;
      const tStruct = exprStruct;
      expect(58); // ':'
      const patchEnd = codePos;
      emitJ(0x26, 0); // JMP end
      patchAddr24(patchFalse, codePos);
      parseCond();
      rvalLoad();
      patchAddr24(patchEnd, codePos);

      exprPtr = tPtr;
      exprStruct = tStruct;
      exprIsLval = 0;

  function parseLogOr() {
    parseLogAnd();
    while (tok === TK_OR) {

      nextToken();
      emitI(0x1B, 0, 0, 0);

      emitJ(0x28, 0); // JNZ true
      parseLogAnd();
      rvalLoad();
      emitI(0x1B, 0, 0, 0);
      const patchTrue2 = codePos;
      emitJ(0x28, 0);
      emitLoadImm(0, 0);
      const patchEnd = codePos;
      emitJ(0x26, 0);
      const trueAddr = codePos;

      patchAddr24(patchTrue2, trueAddr);
      emitLoadImm(0, 1);
      patchAddr24(patchEnd, codePos);

      exprPtr = 0;
      exprStruct = -1;
      exprIsLval = 0;
    }

  function parseLogAnd() {
    parseBitOr();
    while (tok === TK_AND) {

      nextToken();
      emitI(0x1B, 0, 0, 0);
      const patchFalse = codePos;
      emitJ(0x27, 0); // JZ false

      rvalLoad();
      emitI(0x1B, 0, 0, 0);
      const patchFalse2 = codePos;
      emitJ(0x27, 0);
      emitLoadImm(0, 1);
      const patchEnd = codePos;
      emitJ(0x26, 0);
      const falseAddr = codePos;
      patchAddr24(patchFalse, falseAddr);
      patchAddr24(patchFalse2, falseAddr);
      emitLoadImm(0, 0);
      patchAddr24(patchEnd, codePos);
      exprType = TY_INT;
      exprPtr = 0;
      exprStruct = -1;
      exprIsLval = 0;

  function parseBitOr() {
    parseBitXor();
    while (tok === 124) {
      rvalLoad();
      emitI(0x24, 0, 0, 0);
      nextToken();
      parseBitXor();
      rvalLoad();
      emitI(0x25, 1, 0, 0);
      emitR(0x0D, 0, 1, 0);
      exprType = TY_INT;
      exprPtr = 0;
      exprIsLval = 0;
    }

  function parseBitXor() {
    parseBitAnd();
    while (tok === 94) {
      rvalLoad();
      emitI(0x24, 0, 0, 0);
      nextToken();
      parseBitAnd();
      rvalLoad();
      emitI(0x25, 1, 0, 0);
      emitR(0x0E, 0, 1, 0);
      exprType = TY_INT;
      exprPtr = 0;
      exprIsLval = 0;

  function parseBitAnd() {
    parseEq();
    while (tok === 38) {
      rvalLoad();
      emitI(0x24, 0, 0, 0);
      nextToken();
      parseEq();
      rvalLoad();
      emitI(0x25, 1, 0, 0);
      emitR(0x0C, 0, 1, 0);
      exprType = TY_INT;
      exprPtr = 0;
      exprIsLval = 0;

  function parseEq() {
    parseRel();
    while (tok === TK_EQ || tok === TK_NE) {

      rvalLoad();
      emitI(0x24, 0, 0, 0);
      nextToken();
      parseRel();
      rvalLoad();
      emitI(0x25, 1, 0, 0);

      parseShift();
      rvalLoad();
      emitI(0x25, 1, 0, 0);

      parseAdd();
      rvalLoad();
      emitI(0x25, 1, 0, 0);

      const lStruct = exprStruct;

        exprPtr = rPtr;
        exprStruct = rStruct;

          emitR(0x08, 0, 0, 2);

        exprPtr = 0;
        exprStruct = -1;

        exprPtr = 0;
        exprStruct = -1;

  function parseMul() {
    parseUnary();
    while (tok === 42 || tok === 47 || tok === 37) {

      rvalLoad();
      emitI(0x24, 0, 0, 0);
      nextToken();
      parseUnary();
      rvalLoad();
      emitI(0x25, 1, 0, 0);
      if (op === 42) emitR(0x07, 0, 1, 0);

      exprPtr = 0;
      exprStruct = -1;
      exprIsLval = 0;

  function parseUnary() {

      parseUnary();
      rvalLoad();
      emitLoadImm(1, 0);
      emitR(0x06, 0, 1, 0);
      exprType = TY_INT;
      exprPtr = 0;
      exprIsLval = 0;

      parseUnary();
      rvalLoad();
      emitI(0x1B, 0, 0, 0);
      emitI(0x36, 0, 0, 0);
      exprType = TY_INT;
      exprPtr = 0;
      exprIsLval = 0;

      parseUnary();
      rvalLoad();
      emitLoadImm(1, -1);
      emitR(0x0E, 0, 0, 1);

      exprPtr = 0;
      exprIsLval = 0;
      return;

      parseUnary();
      rvalLoad();
      if (exprPtr > 0) exprPtr--;

      return;

      parseUnary();

      return;

      const op = tok;
      nextToken();
      parseUnary();
      if (!exprIsLval) throw new Error(`Line ${lineNum}: invalid lvalue in ++/--`);
      const step = exprPtr > 0 ? derefSize(exprType, exprPtr, exprStruct) : 1;
      emitR(0x01, 1, 0, 0);
      rvalLoad();
      if (op === TK_INC) emitI(0x12, 0, 0, step);

  function parsePostfix() {
    parsePrimary();
    while (true) {

        const bStruct = exprStruct;

        rvalLoad();
        expect(93);
        const elemPtr = bPtr > 0 ? bPtr - 1 : 0;

          emitR(0x07, 0, 0, 2);
        }

        emitR(0x05, 0, 1, 0);

        exprPtr = elemPtr;
        exprStruct = bStruct;

        const isArrow = (tok === TK_ARROW);
        if (isArrow) rvalLoad();
        const sIdx = exprStruct;

        nextToken();
        const fName = tokStr;
        expect(TK_IDENT);
        let found = -1;
        for (let i = 0; i < fieldCount; i++) {

        exprType = fieldType[found];
        exprPtr = fieldPtr[found];
        exprStruct = -1;

          exprIsLval = 1;
        }

        if (!exprIsLval) throw new Error(`Line ${lineNum}: invalid lvalue in post ++/--`);
        const op = tok;
        nextToken();
        const step = exprPtr > 0 ? derefSize(exprType, exprPtr, exprStruct) : 1;
        emitR(0x01, 1, 0, 0);
        rvalLoad();
        emitR(0x01, 2, 0, 0);
        if (op === TK_INC) emitI(0x12, 0, 0, step);

  // Run full 3-Stage Bootstrap verification on a fresh CPU instance (respecting forceJit or cpu.jitEnabled)
  function runThreeStageBootstrap(forceJit, srcFile) {
    const target = srcFile || "/src/cc.tt";
    const bCPU = new TabCompCPU(vfs);
    initHardwareMemory(bCPU);
    bCPU.jitEnabled = (forceJit !== undefined) ? forceJit : cpu.jitEnabled;

    const s1 = compileTabTalk(target, vfs);
    vfs.writeFile("/bin/cc_stage1", s1);

    bCPU.cwd = "/src";
    bCPU.loadBinary(s1, target + " -o /bin/cc_stage2");
    while (!bCPU.halted) bCPU.stepBatch(500000);
    const s2 = vfs.readFile("/bin/cc_stage2");

    bCPU.cwd = "/src";
    bCPU.loadBinary(s2, target + " -o /bin/cc_stage3");
    while (!bCPU.halted) bCPU.stepBatch(500000);
    const s3 = vfs.readFile("/bin/cc_stage3");

    const eq = function(a, b) {
      if (!a || !b || a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
      return true;
    };
    const s2_eq_s3 = eq(s2, s3);
    const s1_eq_s2 = eq(s1, s2);
    if (s2_eq_s3 && !srcFile) {
      vfs.writeFile("/bin/cc", s3);
    }
    vfs.unlink("/bin/cc_stage1");
    vfs.unlink("/bin/cc_stage2");
    vfs.unlink("/bin/cc_stage3");
    return {
      s2_eq_s3: s2_eq_s3,
      s1_eq_s2: s1_eq_s2,
      size: s3 ? s3.length : 0,
      s2: s2,
      s3: s3,
      jitSteps: bCPU.jitInstCount,
      interpSteps: bCPU.interpInstCount
    };
  }

  // Comprehensive 13-Part Self-Test Suite (callable from shell 'selftest' AND window.TABCOMP_SELFTEST())
  function runAllSelfTestsSync() {
    const results = [];
    let passed = 0;
    let failed = 0;
    function record(name, pass, detail) {
      if (pass) passed++;
      else failed++;
      results.push({ name: name, pass: !!pass, detail: String(detail) });
    }

    // 1. ISA Test Suite
    try {
      const tFS = new TabCompFS();
      const tCPU = new TabCompCPU(tFS);
      const dv = tCPU.ramDV;
      let p = 0;
      const emit = function(w) { dv.setUint32(p, w >>> 0, true); p += 4; };
      emit((0x02 << 24) | (1 << 20) | ((-25) & 0xFFFF));
      emit((0x02 << 24) | (2 << 20) | 4);
      emit((0x08 << 24) | (3 << 20) | (1 << 16) | (2 << 12));
      emit((0x11 << 24) | (4 << 20) | (1 << 16) | (2 << 12));
      emit((0x03 << 24) | (5 << 20) | 0x1000);
      emit((0x21 << 24) | (1 << 20) | (5 << 16) | 0);
      emit((0x1D << 24) | (6 << 20) | (5 << 16) | 0);
      emit((0x1C << 24) | (7 << 20) | (5 << 16) | 0);
      emit((0x24 << 24) | (3 << 20));
      emit((0x25 << 24) | (8 << 20));
      emit((0x2F << 24) | 0);
      tCPU.reg[14] = 0x0DF000;
      tCPU.stepBatch(100);
      const ok = (tCPU.reg[3] === -6 && tCPU.reg[4] === -2 && tCPU.reg[6] === -25 && tCPU.reg[7] === 231 && tCPU.reg[8] === -6);
      record("ISA", ok, "R3=" + tCPU.reg[3] + ",R4=" + tCPU.reg[4] + ",R6=" + tCPU.reg[6] + ",R7=" + tCPU.reg[7] + ",R8=" + tCPU.reg[8]);
    } catch (e) {
      record("ISA", false, e.message);
    }

    // 2. Compiler Test (recursion, pointers, structs, strings)
    try {
      const testProg = [
        'import "/src/lib/std.tt";',
        'struct Pair { int a; int b; };',
        'int fact(int n) { if (n <= 1) return 1; return n * fact(n - 1); }',
        'int main() {',
        '  struct Pair p;',
        '  p.a = fact(5);',
        '  int* ptr = &p.b;',
        '  *ptr = strlen("TabComp");',
        '  print_int(p.a + p.b);',
        '  return 0;',
        '}'
      ].join("\n");
      vfs.writeFile("/home/_test_cc.tt", testProg);
      const cCPU = new TabCompCPU(vfs);
      initHardwareMemory(cCPU);
      cCPU.jitEnabled = 1;
      let outStr = "";
      cCPU.hooks.onStdout = function(s) { outStr += s; };
      const ccBin = vfs.readFile("/bin/cc");
      cCPU.cwd = "/home";
      cCPU.loadBinary(ccBin, "/home/_test_cc.tt -o /home/_test_cc.bin");
      while (!cCPU.halted) cCPU.stepBatch(200000);
      const testBin = vfs.readFile("/home/_test_cc.bin");
      cCPU.loadBinary(testBin, "");
      while (!cCPU.halted) cCPU.stepBatch(100000);
      vfs.unlink("/home/_test_cc.tt");
      vfs.unlink("/home/_test_cc.bin");
      record("Compiler", outStr.trim() === "127", "fact(5)+strlen('TabComp')=" + outStr.trim());
    } catch (e) {
      record("Compiler", false, e.message);
    }

    // 3. Bootstrap Fixed Point (Interpreter stage1 == stage2 == stage3)
    let interpStage3 = null;
    try {
      const bRes = runThreeStageBootstrap(0);
      interpStage3 = bRes.s3;
      record("Bootstrap fixed point", bRes.s2_eq_s3 && bRes.s1_eq_s2,
        "stage2==stage3:" + bRes.s2_eq_s3 + ", stage1==stage2:" + bRes.s1_eq_s2 + " (" + bRes.size + " bytes)");
    } catch (e) {
      record("Bootstrap fixed point", false, e.message);
    }

    // 4. Filesystem Round-Trip
    try {
      vfs.mkdir("/home/_fstest");
      vfs.writeFile("/home/_fstest/item.txt", "XINU-1989");
      const rText = vfs.readText("/home/_fstest/item.txt");
      const list = vfs.list("/home/_fstest");
      const listOk = list && list.length === 1 && list[0].name === "item.txt" && list[0].size === 9;
      vfs.unlink("/home/_fstest/item.txt");
      vfs.unlink("/home/_fstest");
      const gone = vfs.stat("/home/_fstest") === null;
      record("FS", rText === "XINU-1989" && listOk && gone, "read=" + rText + ",listOk=" + listOk + ",deleted=" + gone);
    } catch (e) {
      record("FS", false, e.message);
    }

    // 5. Save Identity
    try {
      const pristineHTML = buildHTMLFromPristine(PRISTINE_DISK);
      const savedHTML = generateSaveHTML();
      const identical = (savedHTML === pristineHTML);
      record("Save identity", identical, "len=" + savedHTML.length + ",byteIdentical=" + identical);
    } catch (e) {
      record("Save identity", false, e.message);
    }

    // 6. Save Fidelity
    try {
      vfs.writeFile("/home/_fidelity.txt", "HEREDITY-OK-42");
      const modifiedHTML = generateSaveHTML();
      const mStart = modifiedHTML.indexOf('<script type="application/x-tabcomp-disk" id="tc-disk">');
      const mEnd = modifiedHTML.indexOf('<\/script>', mStart);
      const extractedB64 = modifiedHTML.slice(mStart + 55, mEnd);
      const checkFS = new TabCompFS();
      deserializeDiskB64(extractedB64, checkFS);
      const restored = checkFS.readText("/home/_fidelity.txt");
      const fCountMatch = checkFS.files.size === vfs.files.size;
      vfs.unlink("/home/_fidelity.txt");
      record("Save fidelity", restored === "HEREDITY-OK-42" && fCountMatch,
        "restored=" + restored + ",files=" + checkFS.files.size);
    } catch (e) {
      vfs.unlink("/home/_fidelity.txt");
      record("Save fidelity", false, e.message);
    }

    // 7. Export Cartridge
    try {
      const cartStr = generateCartridgeHTML("/bin/breakout", "TabBreakout");
      const hasPlayer = cartStr && cartStr.indexOf("TabCompCPU") >= 0 && cartStr.indexOf("presentBuf") >= 0 && cartStr.indexOf("A TabComp™ Production") >= 0;
      const noCompilerOrShell = cartStr && cartStr.indexOf("compileTabTalk") < 0 && cartStr.indexOf("TABCOMP_SELFTEST") < 0;
      record("Export", !!(hasPlayer && noCompilerOrShell),
        "cartSize=" + (cartStr ? cartStr.length : 0) + ",hasPlayer=" + hasPlayer + ",noCompiler=" + noCompilerOrShell);
    } catch (e) {
      record("Export", false, e.message);
    }

    // 8. Performance
    try {
      const peak = measurePeakMIPS();
      record("Performance", peak >= 5.0, peak.toFixed(1) + " MIPS (peak)");
    } catch (e) {
      record("Performance", false, e.message);
    }

    // 9. Font & MMIO Bounds Test ("aZ{~" rendered via draw_char vs FONT_8X8_HEX bit-for-bit + verifyHardwareRegions assertion)
    try {
      const badOob = verifyHardwareRegions([{ name: "BAD_FONT", start: 0x0FFE00, size: 768 }]);
      const badOvl = verifyHardwareRegions([
        { name: "R1", start: 0x0F0000, size: 64000 },
        { name: "R2", start: 0x0FF000, size: 512 }
      ]);
      const assertChecksOk = cpu.hwAssertOk && !badOob.ok && !badOvl.ok;

      const fontProg = [
        'import "/src/lib/std.tt";',
        'int main() {',
        '  cls(0);',
        '  draw_char(0, 0, 97, 15, 0);',  // 'a'
        '  draw_char(8, 0, 90, 15, 0);',  // 'Z'
        '  draw_char(16, 0, 123, 15, 0);', // '{'
        '  draw_char(24, 0, 126, 15, 0);', // '~'
        '  return 0;',
        '}'
      ].join("\n");
      vfs.writeFile("/home/_font_test.tt", fontProg);
      const fontBin = compileTabTalk("/home/_font_test.tt", vfs);
      vfs.unlink("/home/_font_test.tt");

      const fCPU = new TabCompCPU(vfs);
      initHardwareMemory(fCPU);
      fCPU.loadBinary(fontBin, "");
      while (!fCPU.halted) fCPU.stepBatch(100000);

      const testChars = [97, 90, 123, 126];
      let bitsMatch = true;
      let checkedBits = 0;
      for (let ci = 0; ci < testChars.length; ci++) {
        const ch = testChars[ci];
        const fOff = (ch - 32) * 8;
        for (let r = 0; r < 8; r++) {
          const expectedByte = parseInt(FONT_8X8_HEX.substr((fOff + r) * 2, 2), 16);
          for (let c = 0; c < 8; c++) {
            const expectedPix = (expectedByte & (128 >> c)) ? 15 : 0;
            const actualPix = fCPU.ram[0x0F0000 + r * 320 + ci * 8 + c];
            if (actualPix !== expectedPix) bitsMatch = false;
            checkedBits++;
          }
        }
      }
      record("Font & MMIO bounds", assertChecksOk && bitsMatch,
        "hwAssert=" + assertChecksOk + ",glyphs='aZ{~'(" + checkedBits + "/256 bits match)");
    } catch (e) {
      vfs.unlink("/home/_font_test.tt");
      record("Font & MMIO bounds", false, e.message);
    }

    // 10. Tear-Free YIELD Present Test (cls(1) -> rect(20,20,100,60,14) -> yield() under tiny slice budget)
    try {
      const tearProg = [
        'import "/src/lib/std.tt";',
        'int main() {',
        '  int f = 0;',
        '  while (f < 3) {',
        '    cls(1);',
        '    rect(20, 20, 100, 60, 14);',
        '    yield();',
        '    f++;',
        '  }',
        '  return 0;',
        '}'
      ].join("\n");
      vfs.writeFile("/home/_tear_test.tt", tearProg);
      const tearBin = compileTabTalk("/home/_tear_test.tt", vfs);
      vfs.unlink("/home/_tear_test.tt");

      const yCPU = new TabCompCPU(vfs);
      initHardwareMemory(yCPU);
      yCPU.loadBinary(tearBin, "");
      let slices = 0;
      let tornSlices = 0;
      let checkedSlices = 0;
      // Run with a 2,500-instruction slice budget (a single frame takes ~285,000 instructions, so >110 slices per frame!)
      while (!yCPU.halted && slices < 500) {
        yCPU.yielded = false;
        yCPU.stepBatch(2500);
        slices++;
        if (yCPU.presentCount > 0) {
          checkedSlices++;
          const pb = yCPU.presentBuf;
          // Verify key interior and exterior scanlines in presentBuf have the complete rectangle and zero tearing
          for (let y = 0; y < 200; y += 5) {
            const inY = (y >= 20 && y < 80);
            for (let x = 0; x < 320; x += 4) {
              const inX = (x >= 20 && x < 120);
              const exp = (inX && inY) ? 14 : 1;
              if (pb[y * 320 + x] !== exp) {
                tornSlices++;
                break;
              }
            }
          }
        }
      }
      record("Tear-free YIELD present", yCPU.presentCount === 3 && checkedSlices > 100 && tornSlices === 0,
        "frames=" + yCPU.presentCount + ",slices=" + slices + ",tornSlices=" + tornSlices);
    } catch (e) {
      vfs.unlink("/home/_tear_test.tt");
      record("Tear-free YIELD present", false, e.message);
    }

    // 11. Disk Binary Reproducibility (recompile every /bin/* from /src/*.tt using /bin/cc and compare bytes)
    try {
      const targets = ["cc", "sh", "edit", "sprite", "breakout", "tracker", "tilemap"];
      const ccBin = vfs.readFile("/bin/cc");
      const rCPU = new TabCompCPU(vfs);
      initHardwareMemory(rCPU);
      rCPU.jitEnabled = 1;
      let matchedCount = 0;
      for (let i = 0; i < targets.length; i++) {
        const name = targets[i];
        const tmpOut = "/home/_repro_" + name;
        rCPU.cwd = "/src";
        rCPU.loadBinary(ccBin, "/src/" + name + ".tt -o " + tmpOut);
        while (!rCPU.halted) rCPU.stepBatch(500000);
        const fresh = vfs.readFile(tmpOut);
        const diskBin = vfs.readFile("/bin/" + name);
        vfs.unlink(tmpOut);
        if (fresh && diskBin && fresh.length === diskBin.length) {
          let same = true;
          for (let k = 0; k < fresh.length; k++) {
            if (fresh[k] !== diskBin[k]) { same = false; break; }
          }
          if (same) matchedCount++;
        }
      }
      record("Disk binary reproducibility", matchedCount === targets.length,
        matchedCount + "/" + targets.length + " binaries match /src/*.tt byte-for-byte");
    } catch (e) {
      record("Disk binary reproducibility", false, e.message);
    }

    // 12. JIT Bootstrap Equivalence (3-stage bootstrap with jit on == jit off byte-for-byte)
    try {
      const jRes = runThreeStageBootstrap(1);
      let matchesInterp = false;
      if (interpStage3 && jRes.s3 && interpStage3.length === jRes.s3.length) {
        matchesInterp = true;
        for (let i = 0; i < interpStage3.length; i++) {
          if (interpStage3[i] !== jRes.s3[i]) { matchesInterp = false; break; }
        }
      }
      const ok = jRes.s2_eq_s3 && jRes.s1_eq_s2 && matchesInterp && jRes.jitSteps > 10000000;
      record("JIT bootstrap equivalence", ok,
        "jitSteps=" + jRes.jitSteps + ",interpSteps=" + jRes.interpSteps + ",matchInterp=" + matchesInterp);
    } catch (e) {
      record("JIT bootstrap equivalence", false, e.message);
    }

    // 13. JIT Tamper Fixed Point (KEHA trailer with jit on)
    try {
      const origCC = vfs.readText("/src/cc.tt");
      const tampered = origCC.replace("int outFd = fopen(outPath, 1);", "emit32(0x4148454B);\n  int outFd = fopen(outPath, 1);");
      vfs.writeFile("/src/_cc_keha.tt", tampered);
      const tRes = runThreeStageBootstrap(1, "/src/_cc_keha.tt");
      vfs.unlink("/src/_cc_keha.tt");
      const s2 = tRes.s2;
      const s3 = tRes.s3;
      const tail = s3 && s3.length >= 4
        ? String.fromCharCode(s3[s3.length - 4], s3[s3.length - 3], s3[s3.length - 2], s3[s3.length - 1])
        : "";
      const ok = tRes.s2_eq_s3 && !tRes.s1_eq_s2 && tail === "KEHA" && tRes.jitSteps > 10000000;
      record("JIT tamper fixed point", ok,
        "tail=" + tail + ",s2==s3=" + tRes.s2_eq_s3 + ",jitSteps=" + tRes.jitSteps);
    } catch (e) {
      vfs.unlink("/src/_cc_keha.tt");
      record("JIT tamper fixed point", false, e.message);
    }

    return { passed: passed, failed: failed, results: results };
  }

  // Keyboard handling + Halt/Break key (Ctrl+C or Escape returns runaway app to shell)
  window.addEventListener("keydown", function(e) {
    sound.unlock();
    if ((e.ctrlKey && (e.key === "c" || e.key === "C")) || (e.key === "Escape" && cpu.procStack.length > 0)) {
      e.preventDefault();
      if (cpu.procStack.length > 0) {
        const rootShell = cpu.procStack[0];
        cpu.procStack.length = 0;
        if (cpu.jit) cpu.jit.invalidateAll();
        cpu.ram.set(rootShell.ram, 0);
        cpu.reg.set(rootShell.reg);
        cpu.pc = rootShell.pc;
        cpu.flags = rootShell.flags;
        cpu.reg[0] = 130;
        for (let i = 0; i < 32; i++) cpu.ram[0x0FFD20 + i] = 0;
        sound.syncFromRAM();
        cpu.presentNow();
      }
      return;
    }

    if (e.key === "Tab" || e.key === "Backspace" || e.key.startsWith("Arrow") ||
        e.key === "PageUp" || e.key === "PageDown" || e.key === "Home" || e.key === "End" ||
        (e.ctrlKey && (e.key === "s" || e.key === "S" || e.key === "q" || e.key === "Q"))) {
      e.preventDefault();
    }

    let ascii = 0;
    if (e.ctrlKey && (e.key === "s" || e.key === "S")) ascii = 19;
    else if (e.ctrlKey && (e.key === "q" || e.key === "Q")) ascii = 17;
    else if (e.key.length === 1) ascii = e.key.charCodeAt(0);
    else if (e.key === "Enter") ascii = 13;
    else if (e.key === "Backspace") ascii = 8;
    else if (e.key === "Tab") ascii = 9;
    else if (e.key === "Escape") ascii = 27;

    const mods = (e.shiftKey ? 1 : 0) | (e.ctrlKey ? 2 : 0) | (e.altKey ? 4 : 0);
    const kcode = e.keyCode & 255;
    cpu.keyQueue.push((mods << 16) | (kcode << 8) | (ascii & 255));
    if (!bootDone) {
      launchShell();
    }
    if (ascii === 13 || ascii === 19 || ascii === 17 || e.ctrlKey) {
      let guard = 0;
      while (!cpu.halted && guard < 5000) {
        cpu.yielded = false;
        cpu.stepBatch(20000);
        guard++;
        if (cpu.yielded && cpu.keyQueue.length === 0) break;
      }
      cpu.presentFallbackIfStale(performance.now());
      renderFramebufferToCanvas(cpu, ctx2d, imgData);
    }
  });

  // Boot sequence: POST memory count + MMIO assertion + MIPS report + Bootstrap status + Launch /bin/sh
  let bootFrame = 0;
  const BOOT_TOTAL_FRAMES = 24;
  let bootDone = false;

  function drawBootBanner(frameIdx) {
    const ram = cpu.ram;
    ram.fill(1, 0x0F0000, 0x0F0000 + 64000);
    const drawStr = function(x, y, s, fg, bg) {
      for (let i = 0; i < s.length; i++) {
        const ch = s.charCodeAt(i);
        const fOff = 0x0EF000 + (ch - 32) * 8;
        for (let r = 0; r < 8; r++) {
          const bits = ram[fOff + r];
          const rowOff = 0x0F0000 + (y + r) * 320;
          for (let c = 0; c < 8; c++) {
            ram[rowOff + x + i * 8 + c] = (bits & (128 >> c)) ? fg : bg;
          }
        }
      }
    };
    drawStr(16, 12, "ConsciousNode SoftWorks ROM BIOS v1.1", 14, 1);
    drawStr(16, 24, "TabComp(TM) 1.1 - The Computer That", 11, 1);
    drawStr(16, 34, "Fits In Your Tab! (XINU Architecture)", 11, 1);

    if (!cpu.hwAssertOk) {
      drawStr(16, 52, "POST HW ASSERT FAIL:", 12, 1);
      drawStr(16, 64, cpu.hwAssertMsg.slice(0, 36), 12, 1);
      cpu.presentNow();
      return;
    }

    const memCount = Math.min(1048576, Math.floor(((frameIdx + 1) / 10) * 1048576));
    drawStr(16, 50, "POST MEMORY TEST: " + memCount + " BYTES OK", 15, 1);
    drawStr(16, 62, "HW MMIO MAP: 6 REGIONS VERIFIED OK", 10, 1);
    drawStr(16, 74, "1,048,576 BYTES FREE", 10, 1);
    drawStr(16, 86, "CPU: " + cpu.peakMips.toFixed(0) + " MIPS (peak) | run: " + cpu.runMips.toFixed(0) + " MIPS", 14, 1);

    const stage = Math.min(3, Math.floor((frameIdx / BOOT_TOTAL_FRAMES) * 3) + 1);
    drawStr(16, 104, "BOOTSTRAPPING TABTALK... STAGE " + stage + " OF 3", 15, 1);

    const barW = Math.floor(((frameIdx + 1) / BOOT_TOTAL_FRAMES) * 280);
    for (let y = 120; y < 132; y++) {
      for (let x = 16; x < 16 + 280; x++) {
        ram[0x0F0000 + y * 320 + x] = (x < 16 + barW) ? 10 : 8;
      }
    }
    drawStr(16, 144, "FIXED POINT: STAGE 1 == 2 == 3 (OK)", 11, 1);
    cpu.presentNow();
  }

  function launchShell() {
    const shBin = vfs.readFile("/bin/sh");
    cpu.cwd = "/home";
    cpu.loadBinary(shBin, "");
    bootDone = true;
    statusEl.textContent = "System Ready • Type 'help' in Shell • Ctrl+C / Esc returns to Shell";
  }

  measurePeakMIPS();
  canvas.focus();

  let rollingSteps = 0;
  let rollingMs = 0;

  function mainLoop() {
    cpu.vsyncCount = (cpu.vsyncCount + 1) | 0;
    cpu.ramDV.setInt32(0x0FFD00, (Date.now() - cpu.bootTime) | 0, true);
    cpu.ramDV.setInt32(0x0FFD04, cpu.vsyncCount, true);

    if (!bootDone) {
      if (cpu.keyQueue.length > 0) {
        bootFrame = BOOT_TOTAL_FRAMES;
      }
      drawBootBanner(bootFrame);
      renderFramebufferToCanvas(cpu, ctx2d, imgData);
      bootFrame++;
      if (bootFrame >= BOOT_TOTAL_FRAMES) {
        launchShell();
      } else {
        requestAnimationFrame(mainLoop);
        return;
      }
    }

    cpu.yielded = false;
    const sliceStart = performance.now();
    let frameSteps = 0;
    while (!cpu.halted && (performance.now() - sliceStart) < 8.0) {
      cpu.yielded = false;
      frameSteps += cpu.stepBatch(20000);
      if (cpu.yielded && cpu.keyQueue.length === 0) break;
    }
    const sliceDt = performance.now() - sliceStart;
    if (sliceDt >= 0.5 && frameSteps > 1000) {
      rollingSteps += frameSteps;
      rollingMs += sliceDt;
      if (rollingMs >= 50.0) {
        cpu.runMips = (rollingSteps / 1e6) / (rollingMs / 1000);
        updateMipsBadge();
        rollingSteps = 0;
        rollingMs = 0;
      }
    }

    if (cpu.halted) {
      launchShell();
    }

    cpu.presentFallbackIfStale(performance.now());
    sound.syncFromRAM();
    renderFramebufferToCanvas(cpu, ctx2d, imgData);
    requestAnimationFrame(mainLoop);
  }

  requestAnimationFrame(mainLoop);
})();
</script>
