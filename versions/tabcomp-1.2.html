<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; worker-src blob:">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TabComp™ 1.2 — The Computer That Fits In Your Tab!</title>
<style id="tc-style">
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0d14;
    color: #e4e8f0;
    font-family: "Courier New", Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 12px;
    user-select: none;
  }
  .tc-chassis {
    background: #1a1e29;
    border: 3px solid #3c465c;
    border-radius: 10px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.12);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 100%;
  }
  .tc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 2px solid #2b3244;
    padding-bottom: 8px;
    flex-wrap: wrap;
  }
  .tc-brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .tc-logo {
    font-size: 18px;
    font-weight: 900;
    color: #00f0ff;
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(0,240,255,0.45);
  }
  .tc-sub {
    font-size: 11px;
    color: #9ba6bf;
  }
  .tc-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tc-badge {
    background: #0d1018;
    border: 1px solid #2f384d;
    color: #48ff7a;
    padding: 4px 8px;
    font-size: 12px;
    font-weight: bold;
    border-radius: 4px;
  }
  .tc-btn {
    background: #263044;
    border: 1px solid #4d5d80;
    color: #ffffff;
    font-family: inherit;
    font-size: 12px;
    font-weight: bold;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  .tc-btn:hover { background: #33415c; border-color: #00f0ff; }
  .tc-btn:active { transform: translateY(1px); }
  .tc-bezel {
    background: #050608;
    border: 4px solid #0f131c;
    border-radius: 6px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #tc-screen {
    width: 640px;
    height: 400px;
    max-width: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000000;
    display: block;
    outline: none;
  }
  .tc-footer {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #7d89a3;
  }
  .tc-turbo {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(#d8cfba, #b8af96);
    border: 1px solid #7c745e;
    border-bottom-width: 3px;
    color: #231f1a;
    font-weight: 900;
    letter-spacing: 0.5px;
  }
  .tc-turbo:hover { background: linear-gradient(#e4dcc7, #c4bb9f); border-color: #ffe63c; }
  .tc-led {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2b3024;
    border: 1px solid #161912;
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.6);
    display: inline-block;
  }
  .tc-led.tc-led-on {
    background: #38ff64;
    border-color: #1a8c35;
    box-shadow: 0 0 6px #38ff64, inset 0 1px 1px #b8ffc8;
  }
  /* TabPad(TM) Game Controller for Cartridges & Arcade Apps */
  .tp-pad {
    display: none;
    flex-direction: column;
    gap: 6px;
    padding: 8px 10px;
    margin-top: 2px;
    background: linear-gradient(#cfc6ab, #b9b095);
    border: 2px solid #8f8670;
    border-radius: 8px;
    box-shadow: inset 0 1px 0 #efe7cf, 0 4px 10px rgba(0,0,0,0.6);
    touch-action: manipulation;
  }
  .tp-pad.tp-on { display: flex; }
  .tp-label {
    font: 700 10px "Courier New", monospace;
    color: #5c5444;
    letter-spacing: 1px;
    display: flex;
    justify-content: space-between;
    padding: 0 2px;
  }
  .tp-body {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .tp-dpad {
    display: grid;
    grid-template-columns: repeat(3, 40px);
    grid-template-rows: repeat(3, 34px);
    gap: 3px;
  }
  .tp-center {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .tp-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .tp-btn {
    border-radius: 5px;
    background: linear-gradient(#f4eedb, #ddd4b8);
    border: 1px solid #8b8269;
    border-bottom-width: 4px;
    color: #2a2620;
    font: 700 13px "Courier New", Courier, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 40px;
    height: 36px;
    padding: 0 10px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    cursor: pointer;
  }
  .tp-btn.tp-meta {
    background: linear-gradient(#bdb6a0, #a39b82);
    color: #1d1a15;
    font-size: 11px;
    height: 32px;
  }
  .tp-btn.tp-act {
    background: linear-gradient(#e86850, #c4432b);
    border-color: #7a2617;
    color: #fff8ee;
    min-width: 58px;
    height: 42px;
  }
  .tp-btn.tp-down {
    border-bottom-width: 1px;
    transform: translateY(3px);
    filter: brightness(0.92);
  }
  /*@@TABKEY_STYLE_BEGIN*/
  /* TabKey(TM) 101 on-screen keyboard (1.0.2, Kehai Interim; carried into 1.1.1) */
  .tk-board { display:none; flex-direction:column; gap:4px; padding:8px 6px 6px; margin-top:2px;
    background:linear-gradient(#cfc6ab,#b9b095); border:2px solid #8f8670; border-radius:8px;
    box-shadow: inset 0 1px 0 #efe7cf, 0 4px 10px rgba(0,0,0,0.6); touch-action:manipulation; }
  .tk-board.tk-on { display:flex; }
  .tk-row { display:flex; gap:4px; }
  .tk-key { flex:1 1 0; min-width:0; height:clamp(30px,7.5vw,44px); border-radius:5px;
    background:linear-gradient(#f4eedb,#ddd4b8); border:1px solid #8b8269; border-bottom-width:4px;
    color:#2a2620; font:700 clamp(11px,3.2vw,15px) "Courier New",Courier,monospace;
    display:flex; align-items:center; justify-content:center; padding:0;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation; cursor:pointer; }
  .tk-key.tk-mod { background:linear-gradient(#bdb6a0,#a39b82); color:#1d1a15; font-size:clamp(9px,2.6vw,13px); }
  .tk-key.tk-down { border-bottom-width:1px; transform:translateY(3px); background:#c9c0a4; }
  .tk-key.tk-lit { background:linear-gradient(#ffe68a,#f0c84a); }
  .tk-key.tk-lock { background:linear-gradient(#ffb070,#f08a3a); }
  .tk-label { font:700 10px "Courier New",monospace; color:#5c5444; letter-spacing:1px; display:flex; justify-content:space-between; padding:0 2px; }

</style>
</head>
<body>
<div class="tc-chassis">
  <div class="tc-header">
    <div class="tc-brand">
      <span class="tc-logo">TabComp™ 1.2</span>
      <span class="tc-sub">ConsciousNode SoftWorks • 1,048,576 BYTES FREE</span>
    </div>
    <div class="tc-controls">
      <span id="tc-mips-badge" class="tc-badge">CLOCK: MAX | --.- MIPS (JIT)</span>
      <button id="tc-btn-turbo" class="tc-btn tc-turbo" type="button" title="Toggle Turbo Clock (MAX / 25 MIPS)"><span id="tc-turbo-led" class="tc-led tc-led-on"></span>TURBO</button>
      <button id="tc-btn-save" class="tc-btn" type="button" title="Save self-replicating HTML with embedded disk">💾 Save HTML</button>
      <button id="tc-btn-fs" class="tc-btn" type="button" title="Fullscreen Mode">⛶ Fullscreen</button>
    </div>
  </div>
  <div class="tc-bezel">
    <canvas id="tc-screen" width="320" height="200" tabindex="0"></canvas>
  </div>
  <div class="tc-footer">
    <span id="tc-status">Click screen to focus • Ctrl+C / Esc breaks to Shell</span>
    <span>XINU Architecture: Single-File Self-Hosting 32-Bit Personal Computer</span>
  </div>
</div>

  // Hardware MMIO & ROM Region Map (must all lie within 0x000000..0x0FFFFF with zero overlaps)
  const HARDWARE_REGIONS = [
    { name: "FONT_ROM",   start: 0x0EF000, size: 768   }, // 0x0EF000..0x0EF2FF
    { name: "VRAM",       start: 0x0F0000, size: 64000 }, // 0x0F0000..0x0FF9FF
    { name: "PALETTE",    start: 0x0FFA00, size: 768   }, // 0x0FFA00..0x0FFCFF
    { name: "TIMER_MS",   start: 0x0FFD00, size: 4     }, // 0x0FFD00..0x0FFD03
    { name: "VSYNC_CNT",  start: 0x0FFD04, size: 4     }, // 0x0FFD04..0x0FFD07
    { name: "SOUND_REGS", start: 0x0FFD20, size: 32    }  // 0x0FFD20..0x0FFD3F
  ];

  function verifyHardwareRegions(regions) {
    for (let i = 0; i < regions.length; i++) {
      const r = regions[i];
      const end = r.start + r.size;
      if (r.start < 0 || r.size <= 0 || end > 0x100000) {
        return { ok: false, msg: r.name + " out of 1 MiB bounds (0x" + r.start.toString(16) + "..0x" + (end - 1).toString(16) + ")" };
      }
      for (let j = i + 1; j < regions.length; j++) {
        const b = regions[j];
        const bEnd = b.start + b.size;
        if (!(end <= b.start || bEnd <= r.start)) {
          return { ok: false, msg: r.name + " overlaps " + b.name };
        }
      }
    }
    return { ok: true, msg: "6 regions verified in 0x000000..0x0FFFFF" };
  }

  function initHardwareMemory(cpu) {
    // 1. Startup hardware region bounds & overlap assertion
    const check = verifyHardwareRegions(HARDWARE_REGIONS);
    cpu.hwAssertOk = check.ok;
    cpu.hwAssertMsg = check.msg;

    // 2. Load 8x8 font at 0x0EF000..0x0EF2FF
    for (let i = 0; i < 768; i++) {
      cpu.ram[0x0EF000 + i] = parseInt(FONT_8X8_HEX.substr(i * 2, 2), 16);
    }
    // 3. Load 256-colour VGA Mode 13h style palette at 0x0FFA00..0x0FFCFF
    const ega16 = [
      [0,0,0],       [0,18,110],    [0,150,40],    [0,160,160],
      [170,20,20],   [150,0,150],   [170,95,0],    [180,185,195],
      [85,90,105],   [65,125,255],  [72,255,122],  [0,240,255],
      [255,80,80],   [255,85,255],  [255,230,60],  [255,255,255]
    ];
    for (let i = 0; i < 16; i++) {
      cpu.ram[0x0FFA00 + i * 3 + 0] = ega16[i][0];
      cpu.ram[0x0FFA00 + i * 3 + 1] = ega16[i][1];
      cpu.ram[0x0FFA00 + i * 3 + 2] = ega16[i][2];
    }
    for (let i = 16; i < 256; i++) {
      cpu.ram[0x0FFA00 + i * 3 + 0] = (i * 37) & 255;
      cpu.ram[0x0FFA00 + i * 3 + 1] = (i * 73) & 255;
      cpu.ram[0x0FFA00 + i * 3 + 2] = (i * 139) & 255;
    }
  }

  // 4-Channel Web Audio Synthesizer
  class TabCompSound {
    constructor(cpu) {
      this.cpu = cpu;
      this.ctx = null;
      this.channels = [];
    }
    unlock() {
      if (this.ctx) {
        if (this.ctx.state === "suspended") this.ctx.resume();
        return;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      const types = ["square", "triangle", "sawtooth", "square"];
      for (let i = 0; i < 4; i++) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = types[i];
        osc.frequency.value = 0;
        gain.gain.value = 0;
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        this.channels.push({ osc, gain });
      }
    }
    syncFromRAM() {
      if (!this.ctx) return;
      const ram = this.cpu.ram;
      for (let i = 0; i < 4; i++) {
        const base = 0x0FFD20 + i * 8;
        const freq = ram[base] | (ram[base + 1] << 8);
        const vol = ram[base + 2];
        const ch = this.channels[i];
        if (freq > 20 && vol > 0) {
          const f = i === 3 ? (freq * ((Math.random() * 0.5) + 0.75)) : freq;
          ch.osc.frequency.setTargetAtTime(f, this.ctx.currentTime, 0.005);
          ch.gain.gain.setTargetAtTime((vol / 255) * 0.08, this.ctx.currentTime, 0.005);
        } else {
          ch.gain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.005);
        }
      }
    }
  }

  // Display Renderer: draws ONLY the tear-free present buffer (cpu.presentBuf), NEVER live VRAM!
  function renderFramebufferToCanvas(cpu, ctx2d, imgData) {
    const ram = cpu.ram;
    const pbuf = cpu.presentBuf;
    const data32 = new Uint32Array(imgData.data.buffer);
    const palBase = 0x0FFA00;
    const pal32 = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      const r = ram[palBase + i * 3];
      const g = ram[palBase + i * 3 + 1];
      const b = ram[palBase + i * 3 + 2];
      pal32[i] = (255 << 24) | (b << 16) | (g << 8) | r;
    }
    for (let i = 0; i < 64000; i++) {
      data32[i] = pal32[pbuf[i]];
    }
    ctx2d.putImageData(imgData, 0, 0);
  }

  class TabCompFS {
    constructor() {
      this.files = new Map();
      this.dirs = new Set(['/', '/src', '/bin', '/home']);
      this.fds = new Map();
      this.nextFd = 3;
    }

    normPath(p, cwd = '/home') {
      if (!p) return cwd;
      p = p.replace(/\\/g, '/').trim();
      if (!p.startsWith('/')) {
        p = (cwd === '/' ? '/' : cwd + '/') + p;
      }
      const parts = p.split('/');
      const out = [];
      for (const part of parts) {
        if (!part || part === '.') continue;
        if (part === '..') { out.pop(); continue; }
        out.push(part.slice(0, 31));
      }
      return '/' + out.join('/');
    }

    writeFile(path, content) {
      const p = this.normPath(path, '/');
      const lastSlash = p.lastIndexOf('/');
      if (lastSlash > 0) {
        const dir = p.slice(0, lastSlash);
        this.mkdir(dir);
      }
      if (typeof content === 'string') {
        this.files.set(p, new TextEncoder().encode(content));
      } else if (content instanceof Uint8Array) {
        this.files.set(p, new Uint8Array(content));
      } else {
        this.files.set(p, new Uint8Array(content));
      }
    }

    readFile(path) {
      const p = this.normPath(path, '/');
      return this.files.get(p) || null;
    }

    readText(path) {
      const d = this.readFile(path);
      return d ? new TextDecoder().decode(d) : null;
    }

    mkdir(path) {
      const p = this.normPath(path, '/');
      const parts = p.split('/').filter(Boolean);
      let cur = '';
      this.dirs.add('/');
      for (const part of parts) {
        cur += '/' + part;
        this.dirs.add(cur);
      }
      return 0;
    }

    unlink(path) {
      const p = this.normPath(path, '/');
      if (this.files.has(p)) {
        this.files.delete(p);
        return 0;
      }
      if (this.dirs.has(p) && p !== '/') {
        this.dirs.delete(p);
        return 0;
      }
      return -1;
    }

    stat(path) {
      const p = this.normPath(path, '/');
      if (this.dirs.has(p)) return { exists: 1, isDir: 1, size: 0 };
      if (this.files.has(p)) return { exists: 1, isDir: 0, size: this.files.get(p).length };
      return null;
    }

    list(dirPath) {
      const p = this.normPath(dirPath, '/');
      if (!this.dirs.has(p)) return null;
      const prefix = p === '/' ? '/' : p + '/';
      const entries = [];
      for (const d of this.dirs) {
        if (d !== p && d.startsWith(prefix)) {
          const rest = d.slice(prefix.length);
          if (!rest.includes('/')) {
            entries.push({ name: rest, isDir: 1, size: 0 });
          }
        }
      }
      for (const [f, data] of this.files.entries()) {
        if (f.startsWith(prefix)) {
          const rest = f.slice(prefix.length);
          if (!rest.includes('/')) {
            entries.push({ name: rest, isDir: 0, size: data.length });
          }
        }
      }
      entries.sort((a, b) => (b.isDir - a.isDir) || a.name.localeCompare(b.name));
      return entries;
    }
  }

  // Zero-dependency WebAssembly Basic-Block / Superblock JIT Compiler
  // Shares linear memory directly with TabCompCPU (0x000000..0x0FFFFF = RAM, 0x100000..0x10003F = R0..R15, 0x100040 = pc, 0x100044 = flags, 0x100048 = codeDirty)
  function encodeULEB128(val, out) {
    let v = val >>> 0;
    do {
      let b = v & 0x7F;
      v >>>= 7;
      if (v !== 0) b |= 0x80;
      out.push(b);
    } while (v !== 0);

  function encodeSLEB128(val, out) {
    let v = val | 0;
    let more = true;
    while (more) {
      let b = v & 0x7F;
      v >>= 7;
      if ((v === 0 && (b & 0x40) === 0) || (v === -1 && (b & 0x40) !== 0)) {
        more = false;
      } else {
        b |= 0x80;
      }
      out.push(b);
    }
  }

  function emitSection(id, payload, out) {
    out.push(id);
    encodeULEB128(payload.length, out);
    for (let i = 0; i < payload.length; i++) out.push(payload[i]);
  }

  const L_FLAGS = 16;
  const L_EXIT_PC = 17;
  const L_STEPS = 18;
  const L_ITERS = 19;
  const L_A = 20;
  const L_B = 21;
  const L_DIRTY = 22;

  class TabCompWasmJIT {
    constructor(cpu) {

      this.wasmMem = cpu.wasmMem;

      this.blockTable.fill(undefined);

        out.push(0x20, L_STEPS);
        pushConst(stepCount, out);
        out.push(0x6A, 0x21, L_STEPS);

          case 0x29: pushConst(2, out); out.push(0x71); break;
          case 0x2A: pushConst(2, out); out.push(0x71, 0x45); break;
          case 0x2B: pushConst(3, out); out.push(0x71); break;
          case 0x2C: pushConst(3, out); out.push(0x71, 0x45); break;
          case 0x30: pushConst(4, out); out.push(0x71); break;
          case 0x31: pushConst(4, out); out.push(0x71, 0x45); break;
          case 0x32: pushConst(5, out); out.push(0x71); break;

            break;

          case 0x06:
          case 0x07:

          case 0x13:

          case 0x15:

            else if (op === 0x1F) trace.push(0x2E, 0x00, 0x00);

          case 0x22:
          case 0x23:

            getReg(rd, trace);

            trace.push(0x22, L_A);

            trace.push(0x71);
            trace.push(0x28, 0x00, 0x00);
            trace.push(0x21, L_B);
            trace.push(0x20, L_A);
            pushConst(4, trace);
            trace.push(0x6A);
            setReg(14, trace);
            trace.push(0x20, L_B);
            setReg(rd, trace);

          case 0x36:

              case 1: pushConst(1, trace); trace.push(0x71, 0x45); break;
              case 2: pushConst(2, trace); trace.push(0x71, 0x45, 0x45); break;
              case 3: pushConst(2, trace); trace.push(0x71, 0x45); break;
              case 4: pushConst(3, trace); trace.push(0x71, 0x45, 0x45); break;
              case 5: pushConst(3, trace); trace.push(0x71, 0x45); break;
              case 6: pushConst(4, trace); trace.push(0x71, 0x45, 0x45); break;
              case 7: pushConst(4, trace); trace.push(0x71, 0x45); break;
              case 8: pushConst(5, trace); trace.push(0x71, 0x45, 0x45); break;
              case 9: pushConst(5, trace); trace.push(0x71, 0x45); break;

          case 0x28:
          case 0x29:
          case 0x2A:
          case 0x2B:
          case 0x2C:
          case 0x30:
          case 0x31:
          case 0x32:

            trace.push(0x04, 0x40);

          }
          case 0x26: {
            const target = inst & 0x00FFFFFF;
            count++;

              this.hooks.onStdout(s);
            }
            r[0] = len;
            break;
          }
          const desc = this.fs.fds.get(fd);
          if (!desc || desc.mode !== 1) { r[0] = -1; break; }
          const chunk = new Uint8Array(len);
          for (let i = 0; i < len; i++) chunk[i] = this.ram[(buf + i) & 0xFFFFF];
          desc.chunks.push(chunk);
          desc.len += len;
          r[0] = len;
          break;
        }
        case 4: { // CLOSE(fd) -> 0
          const fd = r[0];
          const desc = this.fs.fds.get(fd);
          if (!desc) { r[0] = -1; break; }
          if (desc.mode === 1) {
            const merged = new Uint8Array(desc.len);
            let off = 0;
            for (const c of desc.chunks) { merged.set(c, off); off += c.length; }
            this.fs.writeFile(desc.path, merged);
          }
          this.fs.fds.delete(fd);
          r[0] = 0;
          break;
        }
        case 5: { // LIST(dir_ptr, idx, name_out_ptr, is_dir_ptr, size_ptr) -> 1 or 0
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const idx = r[1];
          const entries = this.fs.list(path);
          if (!entries || idx < 0 || idx >= entries.length) {
            r[0] = 0;
            break;
          }
          const e = entries[idx];
          if (r[2]) this.writeStr(r[2], e.name, 32);
          if (r[3]) this.ramDV.setInt32(r[3] & 0xFFFFF, e.isDir, true);
          if (r[4]) this.ramDV.setInt32(r[4] & 0xFFFFF, e.size, true);
          r[0] = 1;
          break;
        }
        case 6: { // MKDIR(path_ptr)
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          r[0] = this.fs.mkdir(path);
          break;
        }
        case 7: { // DELETE(path_ptr)
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          r[0] = this.fs.unlink(path);
          break;
        }
        case 8: { // STAT(path_ptr, size_ptr, is_dir_ptr) -> 0 if exists, -1 if not
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const st = this.fs.stat(path);
          if (!st) { r[0] = -1; break; }
          if (r[1]) this.ramDV.setInt32(r[1] & 0xFFFFF, st.size, true);
          if (r[2]) this.ramDV.setInt32(r[2] & 0xFFFFF, st.isDir, true);
          r[0] = 0;
          break;
        }
        case 9: { // EXEC(bin_path_ptr, arg_str_ptr) -> exit_code
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const argStr = r[1] ? this.readStr(r[1]) : '';
          const bin = this.fs.readFile(path);
          if (!bin) { r[0] = -1; break; }

            ram: this.ram.slice(0, 0x0E0000),
            reg: new Int32Array(this.reg),
            pc: this.pc,
            flags: this.flags
          });

          break;
        }
        case 10: // YIELD() -> copies live VRAM to tear-free presentBuf
          this.yielded = true;
          this.presentNow();
          if (this.hooks.onYield) this.hooks.onYield();
          break;
        case 11: { // KEY() -> next key or 0
          if (this.keyQueue.length > 0) {
            r[0] = this.keyQueue.shift();
          } else {
            r[0] = 0;
          }
          break;
        }
        case 12: { // TIME() -> ms since boot
          const elapsedMs = ((typeof performance !== "undefined" ? performance.now() : Date.now()) - this.bootPerf) | 0;
          this.ramDV.setInt32(0x0FFD00, elapsedMs, true);
          r[0] = elapsedMs;
          break;
        }
        case 13: // SAVE()
          if (this.hooks.onSave) this.hooks.onSave();
          r[0] = 0;
          break;
        case 14: { // EXPORT(bin_path_ptr, title_ptr)
          const binPath = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const title = this.readStr(r[1]);
          if (this.hooks.onExport) r[0] = this.hooks.onExport(binPath, title);
          else r[0] = 0;
          break;
        }
        case 15: { // REBOOTSTRAP() -> 0 if stage1==stage2==stage3, 2 if stage2==stage3
          if (this.hooks.onRebootstrap) r[0] = this.hooks.onRebootstrap();
          else r[0] = 0;
          break;
        }
        case 16: { // SELFTEST(report_buf_ptr) -> failed_count
          if (this.hooks.onSelftest) r[0] = this.hooks.onSelftest(r[0]);
          else r[0] = 0;
          break;
        }
        case 17: { // MIPS([report_buf_ptr]) -> MIPS * 10
          if (this.hooks.onMips) r[0] = this.hooks.onMips(r[0]);
          else r[0] = (this.lastMips * 10) | 0;
          break;
        }
        case 18: { // CHDIR(path_ptr) -> 0 or -1
          const path = this.fs.normPath(this.readStr(r[0]), this.cwd);
          const st = this.fs.stat(path);
          if (st && st.isDir) {
            this.cwd = path;
            r[0] = 0;
          } else {
            r[0] = -1;
          }
          break;
        }
        case 19: { // GETCWD(buf_ptr) -> 0
          this.writeStr(r[0], this.cwd, 128);
          r[0] = 0;
          break;
        }
        case 20: { // GETARGS(buf_ptr) -> 0
          const args = this.readStr(0x0DF000);
          this.writeStr(r[0], args, 512);
          r[0] = 0;
          break;
        }
        case 21: { // JIT(mode) -> 0:off, 1:on, -1:query
          if (r[0] === 0 || r[0] === 1) {
            this.jitEnabled = (r[0] && this.wasmMem) ? 1 : 0;
            if (this.hooks.onJitToggle) this.hooks.onJitToggle(this.jitEnabled);
          }
          r[0] = this.jitEnabled;
          break;
        }
        case 22: { // CLOCK(rate) -> 0:max, 1..1000:MIPS, -1:query
          const arg = r[0] | 0;
          if (arg === 0) {
            this.setClock(0);
          } else if (arg >= 1 && arg <= 1000) {
            this.setClock(arg);
          }
          r[0] = this.clockRate;
          break;
        }
        default:
          r[0] = -1;
          break;
      }
    }
  }

  // TabPad(TM) Compact On-Screen Game Controller (shared by Cartridges & Main System)
  function buildTabPad(chassisEl, controlsEl, keyHandlerFn, autoShowOnCoarse) {
    if (!chassisEl || typeof document === "undefined") return null;
    const pad = document.createElement("div");
    pad.className = "tp-pad";
    const label = document.createElement("div");
    label.className = "tp-label";
    label.innerHTML = "<span>TabPad™ Game Controller</span><span>ConsciousNode SoftWorks</span>";
    pad.appendChild(label);

    const body = document.createElement("div");
    body.className = "tp-body";

    function sendKey(key, code) {
      keyHandlerFn({
        key: key,
        keyCode: code,
        shiftKey: false,
        ctrlKey: false,
        altKey: false,
        preventDefault: function() {}
      });
    }

    function makeBtn(text, key, code, cls, repeatable) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "tp-btn" + (cls ? " " + cls : "");
      b.textContent = text;
      let repTimer = null;
      const stop = function() {
        b.classList.remove("tp-down");
        if (repTimer) {
          clearTimeout(repTimer);
          repTimer = null;
        }
      };
      b.addEventListener("pointerdown", function(ev) {
        ev.preventDefault();
        b.classList.add("tp-down");
        sendKey(key, code);
        if (repeatable) {
          const tick = function() {
            sendKey(key, code);
            repTimer = setTimeout(tick, 55);
          };
          repTimer = setTimeout(tick, 180);
        }
      });
      b.addEventListener("pointerup", stop);
      b.addEventListener("pointerleave", stop);
      b.addEventListener("pointercancel", stop);
      b.addEventListener("contextmenu", function(ev) { ev.preventDefault(); });
      return b;
    }

    const dpad = document.createElement("div");
    dpad.className = "tp-dpad";
    const cells = [
      null, ["▲", "ArrowUp", 38], null,
      ["◀", "ArrowLeft", 37], null, ["▶", "ArrowRight", 39],
      null, ["▼", "ArrowDown", 40], null
    ];
    for (let i = 0; i < cells.length; i++) {
      const c = cells[i];
      if (!c) {
        dpad.appendChild(document.createElement("div"));
      } else {
        dpad.appendChild(makeBtn(c[0], c[1], c[2], "", true));
      }
    }
    body.appendChild(dpad);

    const center = document.createElement("div");
    center.className = "tp-center";
    center.appendChild(makeBtn("Esc", "Escape", 27, "tp-meta", false));
    center.appendChild(makeBtn("R", "r", 82, "tp-meta", false));
    center.appendChild(makeBtn("Q", "q", 81, "tp-meta", false));
    body.appendChild(center);

    const actions = document.createElement("div");
    actions.className = "tp-actions";
    actions.appendChild(makeBtn("Space", " ", 32, "tp-act", true));
    actions.appendChild(makeBtn("Enter", "Enter", 13, "tp-act", false));
    body.appendChild(actions);

    pad.appendChild(body);
    chassisEl.appendChild(pad);

    if (controlsEl) {
      const t = document.createElement("button");
      t.type = "button";
      t.className = "tc-btn";
      t.title = "On-screen game controller (TabPad)";
      t.textContent = "🎮 Pad";
      t.addEventListener("click", function() { pad.classList.toggle("tp-on"); });
      controlsEl.appendChild(t);
    }

    const coarse = (typeof window !== "undefined") && window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    if (coarse && autoShowOnCoarse) {
      pad.classList.add("tp-on");
    }
    return pad;
  }

  // Stage 0 TabTalk Compiler in JS
// Exact 1-to-1 algorithmic match with /src/cc.tt so stage1 == stage2 == stage3 byte-for-byte!

const TK_EOF = 0;
const TK_NUM = 1;
const TK_IDENT = 2;
const TK_STR = 3;

const TK_INT = 10;
const TK_BYTE = 11;
const TK_STRUCT = 12;
const TK_IF = 13;
const TK_ELSE = 14;
const TK_WHILE = 15;
const TK_FOR = 16;
const TK_RETURN = 17;
const TK_BREAK = 18;
const TK_CONTINUE = 19;
const TK_IMPORT = 20;
const TK_SYS = 21;
const TK_CONST = 22;

const TK_EQ = 256;    // ==
const TK_NE = 257;    // !=
const TK_LE = 258;    // <=
const TK_GE = 259;    // >=
const TK_SHL = 260;   // <<
const TK_SHR = 261;   // >>
const TK_AND = 262;   // &&
const TK_OR = 263;    // ||
const TK_INC = 264;   // ++
const TK_DEC = 265;   // --
const TK_ADDEQ = 266; // +=
const TK_SUBEQ = 267; // -=
const TK_ARROW = 268; // ->

const TY_INT = 1;
const TY_BYTE = 2;
const TY_STRUCT = 3;

function compileTabTalk(srcPath, fsController) {
  // Source buffer (expanded with imports)
  const src = new Uint8Array(262144);
  let srcLen = 0;

  // Imported file table (up to 32 files, 32 bytes each)
  const impNames = [];

  function loadSourceFile(pathStr, curDir) {
    const norm = fsController.normPath(pathStr, curDir);
    for (let i = 0; i < impNames.length; i++) {
      if (impNames[i] === norm) return;
    }
    impNames.push(norm);
    const raw = fsController.readFile(norm);
    if (!raw) throw new Error('Cannot open file: ' + norm);
    const dir = norm.slice(0, norm.lastIndexOf('/')) || '/';

    let i = 0;
    const n = raw.length;
    while (i < n) {
      if (
        i + 7 < n &&
        raw[i] === 105 && raw[i + 1] === 109 && raw[i + 2] === 112 &&
        raw[i + 3] === 111 && raw[i + 4] === 114 && raw[i + 5] === 116 &&
        (raw[i + 6] === 32 || raw[i + 6] === 9) &&
        (i === 0 || raw[i - 1] === 10 || raw[i - 1] === 13 || raw[i - 1] === 32 || raw[i - 1] === 9)
      ) {
        let j = i + 6;
        while (j < n && (raw[j] === 32 || raw[j] === 9)) j++;
        if (raw[j] === 34) { // '"'
          j++;
          let fname = '';
          while (j < n && raw[j] !== 34) {
            fname += String.fromCharCode(raw[j]);
            j++;
          }
          if (raw[j] === 34) j++;
          if (raw[j] === 59) j++;
          loadSourceFile(fname, dir);
          src[srcLen++] = 10;
          i = j;
          continue;
        }
      }
      src[srcLen++] = raw[i++];
    }
    src[srcLen++] = 10;
  }

  loadSourceFile(srcPath, '/src');
  src[srcLen] = 0;

  // Code buffer
  const code = new Uint8Array(262144);
  const codeDV = new DataView(code.buffer);
  let codePos = 0;

  function emit32(w) {
    codeDV.setUint32(codePos, w >>> 0, true);
    codePos += 4;
  }
  function patchAddr24(addr, target) {
    const old = codeDV.getUint32(addr, true);
    codeDV.setUint32(addr, ((old & 0xFF000000) | (target & 0x00FFFFFF)) >>> 0, true);
  }
  function emitR(op, rd, ra, rb) {
    emit32(((op & 0x3F) << 24) | ((rd & 0x0F) << 20) | ((ra & 0x0F) << 16) | ((rb & 0x0F) << 12));
  }
  function emitI(op, rd, ra, imm16) {
    emit32(((op & 0x3F) << 24) | ((rd & 0x0F) << 20) | ((ra & 0x0F) << 16) | (imm16 & 0xFFFF));
  }
  function emitJ(op, addr24) {
    emit32(((op & 0x3F) << 24) | (addr24 & 0x00FFFFFF));
  }

    const v = val | 0;
    if (v >= -32768 && v <= 32767) {
      emitI(0x02, rd, 0, v & 0xFFFF); // LDI
    } else if (v >= 0 && v <= 65535) {
      emitI(0x03, rd, 0, v & 0xFFFF); // LDIU
    } else {

  let lexPos = 0;
  let tok = 0;
  let tokVal = 0;
  let tokStr = '';
  const tokBytes = new Uint8Array(512);
  let tokBytesLen = 0;
  let lineNum = 1;

  function isAlpha(c) {
    return (c >= 65 && c <= 90) || (c >= 97 && c <= 122) || c === 95;
  }
  function isDigit(c) {
    return c >= 48 && c <= 57;

      return;
    }

    if (isAlpha(c)) {

      while (lexPos < srcLen && (isAlpha(src[lexPos]) || isDigit(src[lexPos]))) {
        s += String.fromCharCode(src[lexPos++]);
      }
      tokStr = s;
      if (s === 'int') { tok = TK_INT; return; }
      if (s === 'byte') { tok = TK_BYTE; return; }
      if (s === 'struct') { tok = TK_STRUCT; return; }
      if (s === 'if') { tok = TK_IF; return; }
      if (s === 'else') { tok = TK_ELSE; return; }
      if (s === 'while') { tok = TK_WHILE; return; }
      if (s === 'for') { tok = TK_FOR; return; }
      if (s === 'return') { tok = TK_RETURN; return; }
      if (s === 'break') { tok = TK_BREAK; return; }
      if (s === 'continue') { tok = TK_CONTINUE; return; }
      if (s === 'import') { tok = TK_IMPORT; return; }
      if (s === 'sys') { tok = TK_SYS; return; }
      if (s === 'const') { tok = TK_CONST; return; }
      for (let i = constCount - 1; i >= 0; i--) {

          tok = TK_NUM;
          tokVal = constVal[i];
          return;
        }
      }
      tok = TK_IDENT;
      return;
    }

    if (isDigit(c)) {
      let v = 0;
      if (c === 48 && (src[lexPos + 1] === 120 || src[lexPos + 1] === 88)) {
        lexPos += 2;
        while (lexPos < srcLen && isHex(src[lexPos])) {

        }

        }
      }
      tok = TK_NUM;
      tokVal = v | 0;
      return;
    }

      lexPos++;
      let v = src[lexPos++];
      if (v === 92) v = readEscape();
      if (src[lexPos] === 39) lexPos++;

      tokVal = v;
      return;
    }

    if (c === 34) { // '"'
      lexPos++;
      tokBytesLen = 0;
      while (lexPos < srcLen && src[lexPos] !== 34) {

        if (ch === 92) ch = readEscape();

      }
      if (src[lexPos] === 34) lexPos++;
      tokBytes[tokBytesLen] = 0;
      tok = TK_STR;
      return;
    }

    const c2 = src[lexPos + 1];
    if (c === 61 && c2 === 61) { lexPos += 2; tok = 256; return; }
    if (c === 33 && c2 === 61) { lexPos += 2; tok = 257; return; }
    if (c === 60 && c2 === 61) { lexPos += 2; tok = 258; return; }
    if (c === 62 && c2 === 61) { lexPos += 2; tok = 259; return; }
    if (c === 60 && c2 === 60) { lexPos += 2; tok = 260; return; }
    if (c === 62 && c2 === 62) { lexPos += 2; tok = 261; return; }
    if (c === 38 && c2 === 38) { lexPos += 2; tok = 262; return; }
    if (c === 124 && c2 === 124) { lexPos += 2; tok = 263; return; }
    if (c === 43 && c2 === 43) { lexPos += 2; tok = 264; return; }
    if (c === 45 && c2 === 45) { lexPos += 2; tok = 265; return; }
    if (c === 43 && c2 === 61) { lexPos += 2; tok = 266; return; }
    if (c === 45 && c2 === 61) { lexPos += 2; tok = 267; return; }
    if (c === 45 && c2 === 62) { lexPos += 2; tok = 268; return; }

    tok = c;
  }

  function expect(t) {
    if (tok !== t) {
      throw new Error(`Line ${lineNum}: expected token ${t} ('${String.fromCharCode(t)}'), got ${tok} ('${tokStr}')`);
    }
    nextToken();
  }

  // Symbol tables
  const constName = [];
  const constVal = [];
  let constCount = 0;

  const structName = [];
  const structSize = [];
  let structCount = 0;

  const fieldStructIdx = [];
  const fieldName = [];
  const fieldType = [];
  const fieldPtr = [];
  const fieldOffset = [];
  const fieldIsArr = [];
  let fieldCount = 0;

  const gName = [];
  const gType = [];
  const gPtr = [];
  const gStruct = [];
  const gIsArr = [];
  const gAddr = [];
  let gCount = 0;
  let gNextAddr = 0x050000;

  const lName = [];
  const lType = [];
  const lPtr = [];
  const lStruct = [];
  const lIsArr = [];
  const lOffset = [];
  let lCount = 0;
  let curLocalOffset = -4;

  const fnName = [];
  const fnAddr = [];
  const fnDefined = [];
  const fnRetType = [];
  const fnRetPtr = [];
  const fnRetStruct = [];
  let fnCount = 0;

  const fixupCodeAddr = [];
  const fixupFnIdx = [];
  let fixupCount = 0;

  const breakPatchAddr = new Int32Array(256);
  const breakLoopDepth = new Int32Array(256);
  let breakCount = 0;
  const contTargetAddr = new Int32Array(64);
  const contPatchAddr = new Int32Array(256);
  const contLoopDepth = new Int32Array(256);
  let contCount = 0;
  let loopDepth = 0;

  let exprType = TY_INT;
  let exprPtr = 0;
  let exprStruct = -1;
  let exprIsLval = 0;

  function typeSize(baseType, ptrDepth, sIdx) {
    if (ptrDepth > 0) return 4;
    if (baseType === TY_BYTE) return 1;
    if (baseType === TY_STRUCT) return structSize[sIdx];
    return 4;
  }

  function derefSize(baseType, ptrDepth, sIdx) {
    if (ptrDepth > 1) return 4;
    if (baseType === TY_BYTE) return 1;
    if (baseType === TY_STRUCT) return structSize[sIdx];
    return 4;
  }

  function rvalLoad() {
    if (exprIsLval) {
      if (exprPtr === 0 && exprType === TY_BYTE) {
        emitI(0x1C, 0, 0, 0); // LDB R0, [R0 + 0]
      } else if (exprPtr === 0 && exprType === TY_STRUCT) {
        // struct value remains address in R0
      } else {
        emitI(0x20, 0, 0, 0); // LDW R0, [R0 + 0]
      }
      exprIsLval = 0;
    }
  }

  function findStruct(name) {
    for (let i = 0; i < structCount; i++) {
      if (structName[i] === name) return i;
    }
    throw new Error(`Line ${lineNum}: unknown struct ${name}`);
  }

  function findFn(name) {
    for (let i = 0; i < fnCount; i++) {
      if (fnName[i] === name) return i;
    }
    return -1;
  }

  let parsedBaseType = TY_INT;
  let parsedPtr = 0;
  let parsedStruct = -1;

  function isTypeStart() {
    return tok === TK_INT || tok === TK_BYTE || tok === TK_STRUCT;
  }

  function parseType() {
    parsedPtr = 0;
    parsedStruct = -1;
    if (tok === TK_INT) {
      parsedBaseType = TY_INT;
      nextToken();
    } else if (tok === TK_BYTE) {
      parsedBaseType = TY_BYTE;
      nextToken();
    } else if (tok === TK_STRUCT) {
      parsedBaseType = TY_STRUCT;
      nextToken();
      parsedStruct = findStruct(tokStr);
      expect(TK_IDENT);
    } else {
      throw new Error(`Line ${lineNum}: expected type`);
    }
    while (tok === 42) {
      parsedPtr++;
      nextToken();
    }
  }

  function parseExpr() {
    parseAssign();
  }

  function emitStoreLval() {
    if (exprPtr === 0 && exprType === TY_BYTE) {
      emitI(0x21, 0, 1, 0); // STB R0, [R1 + 0]
    } else {
      emitI(0x23, 0, 1, 0); // STW R0, [R1 + 0]
    }
  }

  function parseAssign() {
    parseCond();
    if (tok === 61 || tok === TK_ADDEQ || tok === TK_SUBEQ) {
      if (!exprIsLval) throw new Error(`Line ${lineNum}: invalid lvalue in assignment`);
      const op = tok;
      const lhsType = exprType;
      const lhsPtr = exprPtr;
      const lhsStruct = exprStruct;
      nextToken();

      if (op === 61) {
        emitI(0x24, 0, 0, 0); // PUSH R0
        parseAssign();
        rvalLoad();
        emitI(0x25, 1, 0, 0); // POP R1
        exprType = lhsType;
        exprPtr = lhsPtr;
        exprStruct = lhsStruct;
        emitStoreLval();
        exprIsLval = 0;
      } else {
        emitI(0x24, 0, 0, 0); // PUSH R0
        rvalLoad();
        emitI(0x24, 0, 0, 0); // PUSH R0
        parseAssign();
        rvalLoad();
        const scale = lhsPtr > 0 ? derefSize(lhsType, lhsPtr, lhsStruct) : 1;
        if (scale > 1) {
          emitLoadImm(2, scale);
          emitR(0x07, 0, 0, 2);
        }
        emitI(0x25, 1, 0, 0); // POP R1
        if (op === TK_ADDEQ) emitR(0x05, 0, 1, 0);
        else emitR(0x06, 0, 1, 0);
        emitI(0x25, 1, 0, 0); // POP R1
        exprType = lhsType;
        exprPtr = lhsPtr;
        exprStruct = lhsStruct;
        emitStoreLval();
        exprIsLval = 0;
      }
    }
  }

  function parseCond() {
    parseLogOr();
    if (tok === 63) { // '?'
      rvalLoad();
      nextToken();
      emitI(0x1B, 0, 0, 0); // CMPI R0, 0
      const patchFalse = codePos;
      emitJ(0x27, 0); // JZ false
      parseExpr();
      rvalLoad();
      const tType = exprType;
      const tPtr = exprPtr;
      const tStruct = exprStruct;
      expect(58); // ':'
      const patchEnd = codePos;
      emitJ(0x26, 0); // JMP end
      patchAddr24(patchFalse, codePos);
      parseCond();
      rvalLoad();
      patchAddr24(patchEnd, codePos);
      exprType = tType;
      exprPtr = tPtr;
      exprStruct = tStruct;
      exprIsLval = 0;
    }
  }

  function parseLogOr() {
    parseLogAnd();
    while (tok === TK_OR) {
      rvalLoad();
      nextToken();
      emitI(0x1B, 0, 0, 0);
      const patchTrue = codePos;
      emitJ(0x28, 0); // JNZ true
      parseLogAnd();
      rvalLoad();
      emitI(0x1B, 0, 0, 0);
      const patchTrue2 = codePos;
      emitJ(0x28, 0);
      emitLoadImm(0, 0);
      const patchEnd = codePos;
      emitJ(0x26, 0);
      const trueAddr = codePos;
      patchAddr24(patchTrue, trueAddr);
      patchAddr24(patchTrue2, trueAddr);
      emitLoadImm(0, 1);
      patchAddr24(patchEnd, codePos);
      exprType = TY_INT;
      exprPtr = 0;
      exprStruct = -1;
      exprIsLval = 0;
    }
  }

  function parseLogAnd() {
    parseBitOr();
    while (tok === TK_AND) {
      rvalLoad();
      nextToken();
      emitI(0x1B, 0, 0, 0);
      const patchFalse = codePos;
      emitJ(0x27, 0); // JZ false
      parseBitOr();
      rvalLoad();
      emitI(0x1B, 0, 0, 0);
      const patchFalse2 = codePos;
      emitJ(0x27, 0);
      emitLoadImm(0, 1);
      const patchEnd = codePos;
      emitJ(0x26, 0);
      const falseAddr = codePos;
      patchAddr24(patchFalse, falseAddr);
      patchAddr24(patchFalse2, falseAddr);
      emitLoadImm(0, 0);
      patchAddr24(patchEnd, codePos);
      exprType = TY_INT;
      exprPtr = 0;
      exprStruct = -1;
      exprIsLval = 0;
    }
  }

  function parseBitOr() {
    parseBitXor();
    while (tok === 124) {
      rvalLoad();
      emitI(0x24, 0, 0, 0);
      nextToken();
      parseBitXor();
      rvalLoad();
      emitI(0x25, 1, 0, 0);
      emitR(0x0D, 0, 1, 0);
      exprType = TY_INT;
      exprPtr = 0;
      exprIsLval = 0;
    }
  }

  function parseBitXor() {
    parseBitAnd();
    while (tok === 94) {
      rvalLoad();
      emitI(0x24, 0, 0, 0);
      nextToken();
      parseBitAnd();
      rvalLoad();
      emitI(0x25, 1, 0, 0);
      emitR(0x0E, 0, 1, 0);
      exprType = TY_INT;
      exprPtr = 0;
      exprIsLval = 0;
    }
  }

  function parseBitAnd() {
    parseEq();
    while (tok === 38) {
      rvalLoad();
      emitI(0x24, 0, 0, 0);
      nextToken();
      parseEq();
      rvalLoad();
      emitI(0x25, 1, 0, 0);
      emitR(0x0C, 0, 1, 0);
      exprType = TY_INT;
      exprPtr = 0;
      exprIsLval = 0;
    }
  }

  function parseEq() {
    parseRel();
    while (tok === TK_EQ || tok === TK_NE) {
      const op = tok;
      rvalLoad();
      emitI(0x24, 0, 0, 0);
      nextToken();
      parseRel();
      rvalLoad();
      emitI(0x25, 1, 0, 0);
      emitR(0x1A, 0, 1, 0);
      emitI(0x36, 0, 0, op === TK_EQ ? 0 : 1);
      exprType = TY_INT;
      exprPtr = 0;
      exprIsLval = 0;
    }
  }

  function parseRel() {
    parseShift();
    while (tok === 60 || tok === 62 || tok === TK_LE || tok === TK_GE) {
      const op = tok;
      rvalLoad();
      emitI(0x24, 0, 0, 0);
      nextToken();
      parseShift();
      rvalLoad();
      emitI(0x25, 1, 0, 0);
      emitR(0x1A, 0, 1, 0);
      let cc = 2;
      if (op === 60) cc = 2;
      else if (op === TK_GE) cc = 3;
      else if (op === TK_LE) cc = 4;
      else if (op === 62) cc = 5;
      emitI(0x36, 0, 0, cc);
      exprType = TY_INT;
      exprPtr = 0;
      exprIsLval = 0;
    }
  }

  function parseShift() {
    parseAdd();
    while (tok === TK_SHL || tok === TK_SHR) {
      const op = tok;
      rvalLoad();
      emitI(0x24, 0, 0, 0);
      nextToken();
      parseAdd();
      rvalLoad();
      emitI(0x25, 1, 0, 0);
      if (op === TK_SHL) emitR(0x0F, 0, 1, 0);
      else emitR(0x11, 0, 1, 0);
      exprType = TY_INT;
      exprPtr = 0;
      exprIsLval = 0;
    }
  }

  function parseAdd() {
    parseMul();
    while (tok === 43 || tok === 45) {
      const op = tok;
      rvalLoad();
      const lType = exprType;
      const lPtr = exprPtr;
      const lStruct = exprStruct;
      emitI(0x24, 0, 0, 0);
      nextToken();
      parseMul();
      rvalLoad();
      const rType = exprType;
      const rPtr = exprPtr;
      const rStruct = exprStruct;
      emitI(0x25, 1, 0, 0);

      if (lPtr > 0 && rPtr === 0) {
        const scale = derefSize(lType, lPtr, lStruct);
        if (scale > 1) {
          emitLoadImm(2, scale);
          emitR(0x07, 0, 0, 2);
        }
        if (op === 43) emitR(0x05, 0, 1, 0);
        else emitR(0x06, 0, 1, 0);
        exprType = lType;
        exprPtr = lPtr;
        exprStruct = lStruct;
      } else if (lPtr === 0 && rPtr > 0 && op === 43) {
        const scale = derefSize(rType, rPtr, rStruct);
        if (scale > 1) {
          emitLoadImm(2, scale);
          emitR(0x07, 1, 1, 2);
        }
        emitR(0x05, 0, 1, 0);
        exprType = rType;
        exprPtr = rPtr;
        exprStruct = rStruct;
      } else if (lPtr > 0 && rPtr > 0 && op === 45) {
        emitR(0x06, 0, 1, 0);
        const scale = derefSize(lType, lPtr, lStruct);
        if (scale > 1) {
          emitLoadImm(2, scale);
          emitR(0x08, 0, 0, 2);
        }
        exprType = TY_INT;
        exprPtr = 0;
        exprStruct = -1;
      } else {
        if (op === 43) emitR(0x05, 0, 1, 0);
        else emitR(0x06, 0, 1, 0);
        exprType = TY_INT;
        exprPtr = 0;
        exprStruct = -1;
      }
      exprIsLval = 0;
    }
  }

  function parseMul() {
    parseUnary();
    while (tok === 42 || tok === 47 || tok === 37) {
      const op = tok;
      rvalLoad();
      emitI(0x24, 0, 0, 0);
      nextToken();
      parseUnary();
      rvalLoad();
      emitI(0x25, 1, 0, 0);
      if (op === 42) emitR(0x07, 0, 1, 0);
      else if (op === 47) emitR(0x08, 0, 1, 0);
      else emitR(0x09, 0, 1, 0);
      exprType = TY_INT;
      exprPtr = 0;
      exprStruct = -1;
      exprIsLval = 0;
    }
  }

  function parseUnary() {
    if (tok === 45) {
      nextToken();
      parseUnary();
      rvalLoad();
      emitLoadImm(1, 0);
      emitR(0x06, 0, 1, 0);
      exprType = TY_INT;
      exprPtr = 0;
      exprIsLval = 0;
      return;
    }
    if (tok === 33) {
      nextToken();
      parseUnary();
      rvalLoad();
      emitI(0x1B, 0, 0, 0);
      emitI(0x36, 0, 0, 0);
      exprType = TY_INT;
      exprPtr = 0;
      exprIsLval = 0;
      return;
    }
    if (tok === 126) {
      nextToken();
      parseUnary();
      rvalLoad();
      emitLoadImm(1, -1);
      emitR(0x0E, 0, 0, 1);
      exprType = TY_INT;
      exprPtr = 0;
      exprIsLval = 0;
      return;
    }
    if (tok === 42) {
      nextToken();
      parseUnary();
      rvalLoad();
      if (exprPtr > 0) exprPtr--;
      exprIsLval = 1;
      return;
    }
    if (tok === 38) {
      nextToken();
      parseUnary();
      if (!exprIsLval && exprType !== TY_STRUCT) {
        throw new Error(`Line ${lineNum}: cannot take address of rvalue`);
      }
      exprPtr++;
      exprIsLval = 0;
      return;
    }
    if (tok === TK_INC || tok === TK_DEC) {
      const op = tok;
      nextToken();
      parseUnary();
      if (!exprIsLval) throw new Error(`Line ${lineNum}: invalid lvalue in ++/--`);
      const step = exprPtr > 0 ? derefSize(exprType, exprPtr, exprStruct) : 1;
      emitR(0x01, 1, 0, 0);
      rvalLoad();
      if (op === TK_INC) emitI(0x12, 0, 0, step);
      else emitI(0x13, 0, 0, step);
      emitStoreLval();
      exprIsLval = 0;
      return;
    }
    parsePostfix();
  }

  function parsePostfix() {
    parsePrimary();
    while (true) {
      if (tok === 91) {
        rvalLoad();
        const bType = exprType;
        const bPtr = exprPtr;
        const bStruct = exprStruct;
        emitI(0x24, 0, 0, 0);
        nextToken();
        parseExpr();
        rvalLoad();
        expect(93);
        const elemPtr = bPtr > 0 ? bPtr - 1 : 0;
        const scale = typeSize(bType, elemPtr, bStruct);
        if (scale > 1) {
          emitLoadImm(2, scale);
          emitR(0x07, 0, 0, 2);
        }
        emitI(0x25, 1, 0, 0);
        emitR(0x05, 0, 1, 0);
        exprType = bType;
        exprPtr = elemPtr;
        exprStruct = bStruct;
        exprIsLval = (exprPtr === 0 && exprType === TY_STRUCT) ? 0 : 1;
      } else if (tok === 46 || tok === TK_ARROW) {
        const isArrow = (tok === TK_ARROW);
        if (isArrow) rvalLoad();
        const sIdx = exprStruct;
        if (sIdx < 0) throw new Error(`Line ${lineNum}: member access on non-struct`);
        nextToken();
        const fName = tokStr;
        expect(TK_IDENT);
        let found = -1;
        for (let i = 0; i < fieldCount; i++) {
          if (fieldStructIdx[i] === sIdx && fieldName[i] === fName) {
            found = i;
            break;
          }
        }
        if (found < 0) throw new Error(`Line ${lineNum}: unknown field ${fName}`);
        const off = fieldOffset[found];
        if (off !== 0) emitI(0x12, 0, 0, off);
        exprType = fieldType[found];
        exprPtr = fieldPtr[found];
        exprStruct = -1;
        if (fieldIsArr[found]) {
          exprPtr++;
          exprIsLval = 0;
        } else {
          exprIsLval = 1;
        }
      } else if (tok === TK_INC || tok === TK_DEC) {
        if (!exprIsLval) throw new Error(`Line ${lineNum}: invalid lvalue in post ++/--`);
        const op = tok;
        nextToken();
        const step = exprPtr > 0 ? derefSize(exprType, exprPtr, exprStruct) : 1;
        emitR(0x01, 1, 0, 0);
        rvalLoad();
        emitR(0x01, 2, 0, 0);
        if (op === TK_INC) emitI(0x12, 0, 0, step);
        else emitI(0x13, 0, 0, step);
        emitStoreLval();
        emitR(0x01, 0, 2, 0);
        exprIsLval = 0;
      } else {
        break;
      }
    }
  }

  function parsePrimary() {
    if (tok === TK_NUM) {
      emitLoadImm(0, tokVal);
      nextToken();
      exprType = TY_INT;
      exprPtr = 0;
      exprStruct = -1;
      exprIsLval = 0;
      return;
    }
    if (tok === TK_STR) {
      const jmpAddr = codePos;
      emitJ(0x26, 0);
      const strAddr = codePos;
      for (let i = 0; i <= tokBytesLen; i++) {
        code[codePos++] = tokBytes[i];
      }
      while ((codePos & 3) !== 0) {
        code[codePos++] = 0;
      }
      patchAddr24(jmpAddr, codePos);
      emitLoadImm(0, strAddr);
      nextToken();
      exprType = TY_BYTE;
      exprPtr = 1;
      exprStruct = -1;
      exprIsLval = 0;
      return;
    }
    if (tok === 40) {
      nextToken();
      parseExpr();
      expect(41);
      return;
    }
    if (tok === TK_SYS) {
      nextToken();
      expect(40);
      if (tok !== TK_NUM) throw new Error(`Line ${lineNum}: sys() first arg must be constant number`);
      const sysNum = tokVal;
      nextToken();
      let nArgs = 0;
      while (tok === 44) {
        nextToken();
        parseExpr();
        rvalLoad();
        emitI(0x24, 0, 0, 0);
        nArgs++;
      }
      expect(41);
      for (let i = nArgs - 1; i >= 0; i--) {
        emitI(0x25, i, 0, 0);
      }
      emitI(0x2F, 0, 0, sysNum);
      exprType = TY_INT;
      exprPtr = 0;
      exprStruct = -1;
      exprIsLval = 0;
      return;
    }
    if (tok === TK_IDENT) {
      const name = tokStr;
      nextToken();
      if (tok === 40) {
        nextToken();
        let nArgs = 0;
        if (tok !== 41) {
          while (true) {
            parseExpr();
            rvalLoad();
            emitI(0x24, 0, 0, 0);
            nArgs++;
            if (tok === 44) nextToken();
            else break;
          }
        }
        expect(41);
        let fIdx = findFn(name);
        if (fIdx < 0) {
          fIdx = fnCount++;
          fnName[fIdx] = name;
          fnAddr[fIdx] = 0;
          fnDefined[fIdx] = 0;
          fnRetType[fIdx] = TY_INT;
          fnRetPtr[fIdx] = 0;
          fnRetStruct[fIdx] = -1;
        }
        if (fnDefined[fIdx]) {
          emitJ(0x2D, fnAddr[fIdx]);
        } else {
          fixupCodeAddr[fixupCount] = codePos;
          fixupFnIdx[fixupCount] = fIdx;
          fixupCount++;
          emitJ(0x2D, 0);
        }
        if (nArgs > 0) {
          emitI(0x12, 14, 14, nArgs * 4);
        }
        exprType = fnRetType[fIdx];
        exprPtr = fnRetPtr[fIdx];
        exprStruct = fnRetStruct[fIdx];
        exprIsLval = 0;
        return;
      }

      for (let i = lCount - 1; i >= 0; i--) {
        if (lName[i] === name) {
          if (lOffset[i] >= -32768 && lOffset[i] <= 32767) {
            emitI(0x12, 0, 13, lOffset[i]);
          } else {
            emitLoadImm(2, lOffset[i]);
            emitR(0x05, 0, 13, 2);
          }
          exprType = lType[i];
          exprPtr = lPtr[i];
          exprStruct = lStruct[i];
          if (lIsArr[i] === 2) {
            emitI(0x20, 0, 0, 0);
            exprIsLval = 0;
          } else if (lIsArr[i] === 1) {
            exprPtr++;
            exprIsLval = 0;
          } else if (exprPtr === 0 && exprType === TY_STRUCT) {
            exprIsLval = 0;
          } else {
            exprIsLval = 1;
          }
          return;
        }
      }

      for (let i = gCount - 1; i >= 0; i--) {
        if (gName[i] === name) {
          emitLoadImm(0, gAddr[i]);
          exprType = gType[i];
          exprPtr = gPtr[i];
          exprStruct = gStruct[i];
          if (gIsArr[i]) {
            exprPtr++;
            exprIsLval = 0;
          } else if (exprPtr === 0 && exprType === TY_STRUCT) {
            exprIsLval = 0;
          } else {
            exprIsLval = 1;
          }
          return;
        }
      }

      throw new Error(`Line ${lineNum}: undefined identifier '${name}'`);
    }

    throw new Error(`Line ${lineNum}: unexpected token ${tok} ('${tokStr}')`);
  }

  function emitFuncReturn() {
    emitI(0x13, 14, 13, 4); // SUBI SP, FP, 4
    emitI(0x25, 15, 0, 0);  // POP LR
    emitI(0x25, 13, 0, 0);  // POP FP
    emitJ(0x2E, 0);         // RET
  }

  function parseStmt() {
    if (tok === 123) {
      nextToken();
      while (tok !== 125 && tok !== TK_EOF) {
        parseStmt();
      }
      expect(125);
      return;
    }
    if (isTypeStart()) {
      parseType();
      const bType = parsedBaseType;
      const bPtr = parsedPtr;
      const bStruct = parsedStruct;
      while (true) {
        let ptr = bPtr;
        while (tok === 42) { ptr++; nextToken(); }
        const vName = tokStr;
        expect(TK_IDENT);
        let isArr = 0;
        let elemCount = 1;
        if (tok === 91) {
          isArr = 1;
          nextToken();
          elemCount = tokVal;
          expect(TK_NUM);
          expect(93);
        }
        const sz = typeSize(bType, ptr, bStruct) * elemCount;
        const alignedSz = (sz + 3) & ~3;
        curLocalOffset -= alignedSz;
        const thisOffset = curLocalOffset;

        // Stack space allocated in function prologue

        const idx = lCount++;
        lName[idx] = vName;
        lType[idx] = bType;
        lPtr[idx] = ptr;
        lStruct[idx] = bStruct;
        lIsArr[idx] = isArr;
        lOffset[idx] = thisOffset;

        if (tok === 61) {
          nextToken();
          parseExpr();
          rvalLoad();
          emitLoadImm(2, thisOffset);
          emitR(0x05, 1, 13, 2); // ADD R1, FP, R2
          if (ptr === 0 && bType === TY_BYTE) emitI(0x21, 0, 1, 0);
          else emitI(0x23, 0, 1, 0);
        }
        if (tok === 44) nextToken();
        else break;
      }
      expect(59);
      return;
    }
    if (tok === TK_IF) {
      nextToken();
      expect(40);
      parseExpr();
      rvalLoad();
      expect(41);
      emitI(0x1B, 0, 0, 0);
      const patchFalse = codePos;
      emitJ(0x27, 0);
      parseStmt();
      if (tok === TK_ELSE) {
        nextToken();
        const patchEnd = codePos;
        emitJ(0x26, 0);
        patchAddr24(patchFalse, codePos);
        parseStmt();
        patchAddr24(patchEnd, codePos);
      } else {
        patchAddr24(patchFalse, codePos);
      }
      return;
    }
    if (tok === TK_WHILE) {
      nextToken();
      loopDepth++;
      const loopStart = codePos;
      contTargetAddr[loopDepth] = loopStart;
      expect(40);
      parseExpr();
      rvalLoad();
      expect(41);
      emitI(0x1B, 0, 0, 0);
      const patchExit = codePos;
      emitJ(0x27, 0);
      parseStmt();
      emitJ(0x26, loopStart);
      const exitAddr = codePos;
      patchAddr24(patchExit, exitAddr);
      while (breakCount > 0 && breakLoopDepth[breakCount - 1] === loopDepth) {
        breakCount--;
        patchAddr24(breakPatchAddr[breakCount], exitAddr);
      }
      while (contCount > 0 && contLoopDepth[contCount - 1] === loopDepth) {
        contCount--;
        patchAddr24(contPatchAddr[contCount], loopStart);
      }
      loopDepth--;
      return;
    }
    if (tok === TK_FOR) {
      nextToken();
      expect(40);
      if (tok !== 59) {
        if (isTypeStart()) {
          parseStmt();
        } else {
          parseExpr();
          expect(59);
        }
      } else {
        expect(59);
      }
      loopDepth++;
      const condAddr = codePos;
      let patchExit = -1;
      if (tok !== 59) {
        parseExpr();
        rvalLoad();
        emitI(0x1B, 0, 0, 0);
        patchExit = codePos;
        emitJ(0x27, 0);
      }
      expect(59);
      const patchBody = codePos;
      emitJ(0x26, 0);
      const stepAddr = codePos;
      contTargetAddr[loopDepth] = stepAddr;
      if (tok !== 41) {
        parseExpr();
      }
      expect(41);
      emitJ(0x26, condAddr);
      patchAddr24(patchBody, codePos);
      parseStmt();
      emitJ(0x26, stepAddr);
      const exitAddr = codePos;
      if (patchExit >= 0) patchAddr24(patchExit, exitAddr);
      while (breakCount > 0 && breakLoopDepth[breakCount - 1] === loopDepth) {
        breakCount--;
        patchAddr24(breakPatchAddr[breakCount], exitAddr);
      }
      while (contCount > 0 && contLoopDepth[contCount - 1] === loopDepth) {
        contCount--;
        patchAddr24(contPatchAddr[contCount], stepAddr);
      }
      loopDepth--;
      return;
    }
    if (tok === TK_RETURN) {
      nextToken();
      if (tok !== 59) {
        parseExpr();
        rvalLoad();
      }
      expect(59);
      emitFuncReturn();
      return;
    }
    if (tok === TK_BREAK) {
      nextToken();
      expect(59);
      breakPatchAddr[breakCount] = codePos;
      breakLoopDepth[breakCount] = loopDepth;
      breakCount++;
      emitJ(0x26, 0);
      return;
    }
    if (tok === TK_CONTINUE) {
      nextToken();
      expect(59);
      contPatchAddr[contCount] = codePos;
      contLoopDepth[contCount] = loopDepth;
      contCount++;
      emitJ(0x26, 0);
      return;
    }
    if (tok === 59) {
      nextToken();
      return;
    }
    parseExpr();
    expect(59);
  }

  emitJ(0x26, 0);

  nextToken();
  while (tok !== TK_EOF) {
    if (tok === TK_CONST) {
      nextToken();
      const cName = tokStr;
      expect(TK_IDENT);
      expect(61);
      let sign = 1;
      if (tok === 45) { sign = -1; nextToken(); }
      const cVal = (tokVal * sign) | 0;
      expect(TK_NUM);
      expect(59);
      constName[constCount] = cName;
      constVal[constCount] = cVal;
      constCount++;
      continue;
    }
    if (tok === TK_STRUCT) {
      nextToken();
      const sName = tokStr;
      expect(TK_IDENT);
      if (tok === 123) {
        nextToken();
        const sIdx = structCount++;
        structName[sIdx] = sName;
        let offset = 0;
        while (tok !== 125 && tok !== TK_EOF) {
          parseType();
          const fName = tokStr;
          expect(TK_IDENT);
          let isArr = 0;
          let count = 1;
          if (tok === 91) {
            isArr = 1;
            nextToken();
            count = tokVal;
            expect(TK_NUM);
            expect(93);
          }
          expect(59);
          const fIdx = fieldCount++;
          fieldStructIdx[fIdx] = sIdx;
          fieldName[fIdx] = fName;
          fieldType[fIdx] = parsedBaseType;
          fieldPtr[fIdx] = parsedPtr;
          fieldIsArr[fIdx] = isArr;
          const fSz = typeSize(parsedBaseType, parsedPtr, parsedStruct) * count;
          if (fSz >= 4 && (offset & 3) !== 0) offset = (offset + 3) & ~3;
          fieldOffset[fIdx] = offset;
          offset += fSz;
        }
        expect(125);
        expect(59);
        structSize[sIdx] = (offset + 3) & ~3;
        continue;
      } else {
        parsedBaseType = TY_STRUCT;
        parsedStruct = findStruct(sName);
        parsedPtr = 0;
        while (tok === 42) { parsedPtr++; nextToken(); }
      }
    } else {
      parseType();
    }

    const declBaseType = parsedBaseType;
    const declPtr = parsedPtr;
    const declStruct = parsedStruct;
    const declName = tokStr;
    expect(TK_IDENT);

    if (tok === 40) {
      nextToken();
      lCount = 0;
      const pTypes = [];
      const pPtrs = [];
      const pStructs = [];
      const pNames = [];
      let nParams = 0;
      if (tok !== 41) {
        while (true) {
          parseType();
          const pName = tokStr;
          expect(TK_IDENT);
          let pPtr = parsedPtr;
          if (tok === 91) {
            nextToken();
            expect(93);
            pPtr++;
          }
          pTypes.push(parsedBaseType);
          pPtrs.push(pPtr);
          pStructs.push(parsedStruct);
          pNames.push(pName);
          nParams++;
          if (tok === 44) nextToken();
          else break;
        }
      }
      expect(41);

      let fIdx = findFn(declName);
      if (fIdx < 0) {
        fIdx = fnCount++;
        fnName[fIdx] = declName;
        fnAddr[fIdx] = 0;
        fnDefined[fIdx] = 0;
      }
      fnRetType[fIdx] = declBaseType;
      fnRetPtr[fIdx] = declPtr;
      fnRetStruct[fIdx] = declStruct;

      if (tok === 59) {
        nextToken();
        continue;
      }

      fnAddr[fIdx] = codePos;
      fnDefined[fIdx] = 1;

      for (let i = 0; i < nParams; i++) {
        const idx = lCount++;
        lName[idx] = pNames[i];
        lType[idx] = pTypes[i];
        lPtr[idx] = pPtrs[i];
        lStruct[idx] = pStructs[i];
        lIsArr[idx] = (pPtrs[i] === 0 && pTypes[i] === TY_STRUCT) ? 2 : 0;
        lOffset[idx] = 4 + (nParams - 1 - i) * 4;
      }

      curLocalOffset = -4;
      emitI(0x24, 13, 0, 0);
      emitR(0x01, 13, 14, 0);
      emitI(0x24, 15, 0, 0);
      const spAllocPos = codePos;
      emitI(0x03, 2, 0, 0); // LDIU R2, frameSize (patched)
      emitR(0x06, 14, 14, 2); // SUB SP, SP, R2

      parseStmt();

      const frameSize = (-4 - curLocalOffset);
      codeDV.setUint16(spAllocPos, frameSize & 0xFFFF, true);

      emitLoadImm(0, 0);
      emitFuncReturn();
    } else {
      let ptr = declPtr;
      let vName = declName;
      while (true) {
        let isArr = 0;
        let elemCount = 1;
        if (tok === 91) {
          isArr = 1;
          nextToken();
          elemCount = tokVal;
          expect(TK_NUM);
          expect(93);
        }
        const sz = typeSize(declBaseType, ptr, declStruct) * elemCount;
        const alignedSz = (sz + 3) & ~3;
        const idx = gCount++;
        gName[idx] = vName;
        gType[idx] = declBaseType;
        gPtr[idx] = ptr;
        gStruct[idx] = declStruct;
        gIsArr[idx] = isArr;
        gAddr[idx] = gNextAddr;
        gNextAddr += alignedSz;

        if (tok === 44) {
          nextToken();
          ptr = 0;
          while (tok === 42) { ptr++; nextToken(); }
          vName = tokStr;
          expect(TK_IDENT);
        } else {
          break;
        }
      }
      expect(59);
    }
  }

  const mainIdx = findFn('main');
  if (mainIdx < 0 || !fnDefined[mainIdx]) {
    throw new Error('Undefined main() function');
  }
  patchAddr24(0, fnAddr[mainIdx]);

  for (let i = 0; i < fixupCount; i++) {
    const fIdx = fixupFnIdx[i];
    if (!fnDefined[fIdx]) {
      throw new Error(`Undefined function '${fnName[fIdx]}'`);
    }
    patchAddr24(fixupCodeAddr[i], fnAddr[fIdx]);
  }

  return code.slice(0, codePos);
}

  function updateMipsBadge() {

  // Measure peak tight-loop MIPS (for POST banner & peak badge)
  function measurePeakMIPS() {
    const benchFS = new TabCompFS();
    const benchCPU = new TabCompCPU(benchFS);
    const dv = benchCPU.ramDV;
    dv.setUint32(0, (0x02 << 24) | (0 << 20) | 0, true);
    dv.setUint32(4, (0x12 << 24) | (0 << 20) | (0 << 16) | 1, true);
    dv.setUint32(8, (0x05 << 24) | (1 << 20) | (1 << 16) | (0 << 12), true);
    dv.setUint32(12, (0x0E << 24) | (2 << 20) | (2 << 16) | (1 << 12), true);
    dv.setUint32(16, (0x26 << 24) | 4, true);
    benchCPU.pc = 0;
    const t0 = performance.now();
    const steps = 600000;
    benchCPU.stepInterp(steps);
    const dt = Math.max(0.5, performance.now() - t0);
    const peak = (steps / 1e6) / (dt / 1000);
    cpu.peakMips = peak;
    cpu.runMips = peak;
    cpu.lastMips = cpu.runMips;
    updateMipsBadge();
    return peak;
  }

  // Honest real-workload benchmark: compiles /src/edit.tt (or /src/cc.tt) with both Interpreter and WebAssembly JIT
  function benchmarkRealWorkload(targetSrc) {
    const srcPath = targetSrc || "/src/edit.tt";
    const ccBin = vfs.readFile("/bin/cc");
    const bCPU = new TabCompCPU(vfs);
    initHardwareMemory(bCPU);

    // 1. Interpreter run
    bCPU.jitEnabled = 0;
    bCPU.interpInstCount = 0;
    bCPU.cwd = "/src";
    bCPU.loadBinary(ccBin, srcPath + " -o /home/_bench_out.bin");
    const t0 = performance.now();
    while (!bCPU.halted) bCPU.stepBatch(500000);
    const interpMs = Math.max(0.5, performance.now() - t0);
    const interpSteps = bCPU.interpInstCount;
    const interpMips = (interpSteps / 1e6) / (interpMs / 1000);

    // 2. WebAssembly JIT cold run (populates Wasm blocks)
    bCPU.jitEnabled = 1;
    bCPU.jitInstCount = 0;
    bCPU.interpInstCount = 0;
    bCPU.cwd = "/src";
    bCPU.loadBinary(ccBin, srcPath + " -o /home/_bench_out.bin");
    const t1 = performance.now();
    while (!bCPU.halted) bCPU.stepBatch(500000);
    const jitColdMs = Math.max(0.5, performance.now() - t1);
    const jitColdTotal = bCPU.jitInstCount + bCPU.interpInstCount;
    const jitColdMips = (jitColdTotal / 1e6) / (jitColdMs / 1000);

    // 3. WebAssembly JIT warm run
    bCPU.jitInstCount = 0;
    bCPU.interpInstCount = 0;
    bCPU.cwd = "/src";
    bCPU.loadBinary(ccBin, srcPath + " -o /home/_bench_out.bin");
    const t2 = performance.now();
    while (!bCPU.halted) bCPU.stepBatch(500000);
    const jitWarmMs = Math.max(0.5, performance.now() - t2);
    const jitWarmTotal = bCPU.jitInstCount + bCPU.interpInstCount;
    const jitWarmMips = (jitWarmTotal / 1e6) / (jitWarmMs / 1000);

    vfs.unlink("/home/_bench_out.bin");

    const activeMips = cpu.jitEnabled ? jitWarmMips : interpMips;
    cpu.runMips = activeMips;
    cpu.lastMips = activeMips;
    updateMipsBadge();

    return {
      srcPath: srcPath,
      steps: interpSteps,
      interpMs: interpMs,
      interpMips: interpMips,
      jitColdMs: jitColdMs,
      jitColdMips: jitColdMips,
      jitWarmMs: jitWarmMs,
      jitWarmMips: jitWarmMips,
      jitInstShare: (bCPU.jitInstCount / Math.max(1, jitWarmTotal)) * 100,
      activeMips: activeMips
    };
  }
